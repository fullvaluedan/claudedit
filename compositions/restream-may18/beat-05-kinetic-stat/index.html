<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beat 05 — 3.5× Altcoin Options Kinetic Stat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body,
      html {
        width: 1920px;
        height: 1080px;
        background: #0a0a0a;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }

      #master-root {
        width: 1920px;
        height: 1080px;
        position: relative;
        background: #0a0a0a;
      }

      /* Radial glow — required background texture, never solid flat color */
      #bg-glow {
        position: absolute;
        top: 0;
        right: 0;
        width: 900px;
        height: 1080px;
        background: radial-gradient(
          ellipse at 75% 40%,
          rgba(0, 212, 255, 0.1) 0%,
          transparent 60%
        );
        pointer-events: none;
        z-index: 0;
      }

      /* Vertical rule — structural element separating speaker zone from data zone */
      #zone-rule {
        position: absolute;
        left: 1152px;
        top: 80px;
        width: 2px;
        height: 920px;
        background: #2a2a2a;
        transform-origin: top center;
        z-index: 1;
      }

      /* A-roll video frame — direct child of body, positioned by master GSAP */
      #short_mag_cut_frame {
        position: absolute;
        z-index: 2;
        overflow: hidden;
        background: #000;
      }

      #short_mag_cut,
      #short_mag_cut_frame > img.__render_frame__,
      #short_mag_cut_frame > img.__preview_render_frame__ {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }

      /* Overlay layers */
      .overlay-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      #graphics-comp {
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div
      id="master-root"
      data-composition-id="master"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="13.3"
    >
      <!-- Background texture (decorative, audited by inspect → ignore) -->
      <div id="bg-glow" data-layout-ignore></div>

      <!-- Vertical rule divider between speaker zone and data zone -->
      <div id="zone-rule" data-layout-ignore></div>

      <!-- Graphics Sub-composition (stat card) -->
      <div
        id="graphics-comp"
        class="overlay-layer"
        data-composition-id="graphics"
        data-composition-src="compositions/graphics.html"
        data-start="0"
        data-duration="13.3"
        data-track-index="3"
      ></div>

      <script>
        window.__timelines = window.__timelines || {};

        const masterTL = gsap.timeline({ paused: true });
        const v = document.getElementById("short_mag_cut_frame");
        const rule = document.getElementById("zone-rule");

        // Speaker enters from left, settles at 60% of frame (DESIGN.md: speaker occupies left 60%)
        masterTL.fromTo(
          v,
          { x: -1200, y: 0, width: 1152, height: 1080 },
          { x: 0, y: 0, width: 1152, height: 1080, duration: 0.5, ease: "expo.out" },
          0,
        );

        // Zone rule draws down as speaker settles
        masterTL.fromTo(
          rule,
          { scaleY: 0 },
          { scaleY: 1, duration: 0.65, ease: "power3.out" },
          0.3,
        );

        window.__timelines["master"] = masterTL;
      </script>
    </div>

    <!-- A-roll Video — direct child of body (avoids video_nested_in_timed_element) -->
    <!-- Absolute path to source — no copying, data-media-start trims to beat window -->
    <div id="short_mag_cut_frame">
      <video
        id="short_mag_cut"
        src="/Users/dan/conductor/workspaces/claudedit/nashville/Copy of live-with-restream,-may-18-May-28-2026-restream.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="13.3"
        data-media-start="417.7"
        data-track-index="1"
      ></video>
    </div>
    <audio
      id="a-roll-audio"
      src="/Users/dan/conductor/workspaces/claudedit/nashville/Copy of live-with-restream,-may-18-May-28-2026-restream.mp4"
      data-start="0"
      data-duration="13.3"
      data-media-start="417.7"
      data-track-index="5"
      data-volume="1"
    ></audio>
  </body>
</html>
