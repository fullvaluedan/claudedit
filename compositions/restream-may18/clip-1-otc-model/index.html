<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clip 1 — OTC Model: Agency vs Principal (Wintermute OTC Desk) — v3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body, html {
        width: 1920px; height: 1080px;
        background: #0a0a0a; overflow: hidden;
        font-family: "Inter", sans-serif;
      }
      #master-root { width: 1920px; height: 1080px; position: relative; background: #0a0a0a; }

      /* Dot grid */
      #master-root::before {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(circle, rgba(255,255,255,0.038) 1px, transparent 1px);
        background-size: 44px 44px; pointer-events: none; z-index: 0;
      }

      /* Left-zone glow */
      #bg-glow {
        position: absolute; top: 0; left: 0; width: 1152px; height: 1080px;
        background:
          radial-gradient(ellipse at 22% 55%, rgba(0,212,255,0.13) 0%, transparent 50%),
          radial-gradient(ellipse at 78% 18%, rgba(0,212,255,0.05) 0%, transparent 38%);
        pointer-events: none; z-index: 0; opacity: 0;
      }
      #zone-rule {
        position: absolute; left: 1151px; top: 60px; width: 1px; height: 960px;
        background: #2a2a2a; transform-origin: top center; z-index: 1; opacity: 0;
      }

      /*
        VIDEO — starts FULL FRAME (1920×1080), visible from t=0 for the cold-open kinetic (both speakers).
        v3 R1 fix: the master timeline performs EXACTLY ONE view transition — FULL → Mode A at comp 30.2.
        There is NO toFull() after the head and NO toModeA() other than the single one at 30.2.
        FULL holds 0.0–30.2 (c1b1 + c1b3 kinetics + c1b4 clean breath); Mode A holds 30.2–111.3 (entire OTC explanation).

        Mode A (85% scale of right-40% zone): width:614, height:864
          Centered in right zone: x=1152+(768-614)/2=1229, y=(1080-864)/2=108
          Bottom clearance 1080-108-864=108px > 40px ✓ ; top clearance 108px > 20px ✓
          object-position: 85% center → Jasper horizontally centered in the 614px window,
          name lower-third "Jasper De Maere / Wintermute" fully visible (verified by frame extraction:
          83% sits him a touch left; 85% centers him with the name still inside; 88% clips "…asper").
      */
      #short_mag_cut_frame {
        position: absolute;
        left: 0; top: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: transparent;
        border-radius: 0; z-index: 2;
      }
      #short_mag_cut,
      #short_mag_cut_frame > img.__render_frame__,
      #short_mag_cut_frame > img.__preview_render_frame__ {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover;
        /* 85% center: Jasper centered in the Mode-A crop, full name visible */
        object-position: 85% center;
        display: block;
      }

      .overlay-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
      }
      /*
        z-index:3 rule — MUST list EVERY overlay beat id (else it renders BEHIND the z-index:2 video).
        v3 (EDL directive g): exactly these 8 ids. c1b4 is now a clean breath (no overlay) and
        c1b7pre is deleted, so neither appears; c1b6b-edge is ADDED.
      */
      #beat-c1b1-half-decade,
      #beat-c1b3-moving-fast,
      #beat-c1b5-two-sides,
      #beat-c1b6-jasper,
      #beat-c1b6b-edge,
      #beat-c1b7-agency-principal,
      #beat-c1b8-warehouse,
      #beat-c1b9-enter-exit { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="master-root" data-composition-id="master" data-width="1920" data-height="1080" data-start="0" data-duration="111.3">
      <div id="bg-glow" data-layout-ignore></div>
      <div id="zone-rule" data-layout-ignore></div>

      <!--
        c1b1 — kinetic-type · COLD OPEN · comp 0.0–6.0 · src 239.10–245.10 · FULL-FRAME · WORD-SYNCED
        HALF A DECADE / ANOTHER CAREER / IN AN INDUSTRY (cyan: IN AN INDUSTRY)
        Opens on Jasper's real line "I think in like half a decade… another career in an industry."
        WORD-SYNCED: half@0.62 another@2.58 industry@4.24 (src−239.10)
      -->
      <div id="beat-c1b1-half-decade" class="overlay-layer clip"
        data-composition-id="beat-c1b1-half-decade"
        data-composition-src="compositions/beat-c1b1-half-decade.html"
        data-start="0.0" data-duration="6.0" data-track-index="3"></div>

      <!--
        c1b3 — kinetic-type · comp 9.4–15.4 · src 248.50–254.50 · FULL-FRAME · WORD-SYNCED
        IT'S MOVING / VERY FAST / UNLIKE ANY YEAR PRIOR (cyan: UNLIKE ANY YEAR PRIOR)
        Stays FULL-FRAME — grouped with c1b1 (NO Mode-A flip between them; R1).
        WORD-SYNCED: moving@10.12 very@10.38 haven't@11.36 (src−239.10)
      -->
      <div id="beat-c1b3-moving-fast" class="overlay-layer clip"
        data-composition-id="beat-c1b3-moving-fast"
        data-composition-src="compositions/beat-c1b3-moving-fast.html"
        data-start="9.4" data-duration="6.0" data-track-index="3"></div>

      <!--
        c1b4 — CLEAN FULL-FRAME · comp 15.4–30.2 · src 254.50–269.30 · NO OVERLAY (EDL directive b)
        The run-breaker: host pivot question carried on audio over both speakers, frame stays full + stable.
        No graphic. (No beat <div> — there is nothing to mount; the video simply holds full-frame here.)
        View switch FULL → MODE-A fires at comp 30.2 as Jasper begins his structured answer.
      -->

      <!--
        c1b5 — flowchart (1→2 split) · comp 33.0–48.5 · src 272.10–287.60 · MODE A · WORD-SYNCED reveals
        THE FIRM → MARKET-MAKING (neutral) + OTC DESK (accent = single cyan). Sets up the centerpiece.
        WORD-SYNCED reveals: MARKET-MAKING@36.66 (market) · OTC-DESK@46.66 (OTC) (src−239.10)
      -->
      <div id="beat-c1b5-two-sides" class="overlay-layer clip"
        data-composition-id="beat-c1b5-two-sides"
        data-composition-src="compositions/beat-c1b5-two-sides.html"
        data-start="33.0" data-duration="17.0" data-track-index="3"></div>

      <!--
        c1b6 — liquid-glass card (Jasper name) · comp 50.0–60.0 · src 289.10–299.10 · MODE A
        JASPER DE MAERE · Wintermute. MID-clip per no-outro rule. Fades by comp 60 (clip continues).
      -->
      <div id="beat-c1b6-jasper" class="overlay-layer clip"
        data-composition-id="beat-c1b6-jasper"
        data-composition-src="compositions/beat-c1b6-jasper.html"
        data-start="50.0" data-duration="10.0" data-track-index="3"></div>

      <!--
        c1b6b — data-chart (2-bar EDGE panel) · comp 69.5–76.0 · src 308.60–315.10 · MODE A · WORD-SYNCED
        NEW (EDL directive d) — replaces v2's c1b7pre kinetic. Removes a kinetic (variety move).
        EXECUTION EDGE · MINIMIZE MARKET IMPACT (neutral) · BEST PRICING (cyan) · note "Algorithms + proprietary tech".
        WORD-SYNCED bars: MINIMIZE-IMPACT@70.94 (minimize) · BEST-PRICING@73.32 (best) (src−239.10)
      -->
      <div id="beat-c1b6b-edge" class="overlay-layer clip"
        data-composition-id="beat-c1b6b-edge"
        data-composition-src="compositions/beat-c1b6b-edge.html"
        data-start="69.5" data-duration="11.0" data-track-index="3"></div>

      <!--
        c1b7 — swiss-grid TWO-COLUMN (CENTERPIECE) + shimmer-sweep · comp 80.5–99.0 · src 319.60–338.10 · MODE A · WORD-SYNCED
        ★ THE LEAD DEVICE ★. AGENCY (rival desks, neutral) vs PRINCIPAL (Wintermute, cyan header + the only shimmer).
        WORD-SYNCED: AGENCY@82.68 PRINCIPAL@84.62(+shimmer) RISK-PRICE@87.76 OTHER-SIDE@88.92 ALIGNED@96.30 (src−239.10)
      -->
      <div id="beat-c1b7-agency-principal" class="overlay-layer clip"
        data-composition-id="beat-c1b7-agency-principal"
        data-composition-src="compositions/beat-c1b7-agency-principal.html"
        data-start="80.5" data-duration="19.5" data-track-index="3"></div>

      <!--
        c1b8 — flowchart (3-node decay chain) · comp 100.0–106.5 · src 339.10–345.60 · MODE A · WORD-SYNCED
        WAREHOUSE THE RISK → WORK OFF GRADUALLY → PRICE IMPACT MINIMIZED (final node cyan). (EDL directive e)
        WORD-SYNCED: final-node@103.44 (appreciates) / alignment@104.70 (src−239.10)
      -->
      <div id="beat-c1b8-warehouse" class="overlay-layer clip"
        data-composition-id="beat-c1b8-warehouse"
        data-composition-src="compositions/beat-c1b8-warehouse.html"
        data-start="100.0" data-duration="6.5" data-track-index="3"></div>

      <!--
        c1b9 — kinetic-type · CLOSE (content close) · comp 106.7–111.3 · src 345.80–350.40 · MODE A · WORD-SYNCED
        HELP PEOPLE / ENTER / AND EXIT POSITIONS (cyan: AND EXIT POSITIONS). Plays IN Mode-A (left zone) — a
        full-frame flip here would be a sub-8s segment = R1 FAIL. Holds through clip end, no outro.
        WORD-SYNCED close: helping@108.58 enter@109.42 exit@110.54 (src−239.10)
      -->
      <div id="beat-c1b9-enter-exit" class="overlay-layer clip"
        data-composition-id="beat-c1b9-enter-exit"
        data-composition-src="compositions/beat-c1b9-enter-exit.html"
        data-start="106.7" data-duration="4.6" data-track-index="3"></div>

      <script>
        window.__timelines = window.__timelines || {};
        const masterTL = gsap.timeline({ paused: true });

        const v   = document.getElementById("short_mag_cut_frame");
        const vid = document.getElementById("short_mag_cut");
        const gr  = document.getElementById("bg-glow");
        const zr  = document.getElementById("zone-rule");

        // Mode A: 85% of right-40% zone. object-position:85% centers Jasper, name visible.
        const MODE_A = { left: 1229, top: 108, width: 614, height: 864 };

        // ── PHASE 0  comp 0.0–30.2 — FULL FRAME (default CSS). ──
        // c1b1 cold open (0–6) → c1b3 kinetic (9.4–15.4) → c1b4 clean host-Q breath (15.4–30.2, NO overlay).
        // Both early kinetics stay FULL together (R1 grouping). No Mode-A between them.

        // helpers (clip-2 pattern): toModeA / toFull keep view in lock-step with the graphic clusters.
        const FULL = { left: 0, top: 0, width: 1920, height: 1080, borderRadius: "0px" };
        const toModeA = (t) => {
          masterTL.to(v, { left: MODE_A.left, top: MODE_A.top, width: MODE_A.width, height: MODE_A.height,
            borderRadius: "6px", duration: 0.7, ease: "expo.inOut" }, t);
          masterTL.to(gr, { opacity: 1, duration: 0.5, ease: "power2.out" }, t + 0.3);
          masterTL.to(zr, { scaleY: 1, opacity: 1, duration: 0.6, ease: "power4.out" }, t + 0.4);
        };
        const toFull = (t) => {
          masterTL.to(v, { ...FULL, duration: 0.7, ease: "expo.inOut" }, t);
          masterTL.to(gr, { opacity: 0, duration: 0.4, ease: "power2.in" }, t);
          masterTL.to(zr, { scaleY: 0, duration: 0.4, ease: "power2.in" }, t);
        };

        // ── VIEW TIMELINE (R1/R7: view in lock-step with graphic clusters — no blank-left, no <8s segment). ──
        //   FULL 0–33  → MODE-A 33–60 (c1b5+c1b6) → FULL 60–69.5 (9.5s talking gap, both speakers)
        //   → MODE-A 69.5–111.3 (c1b6b→c1b7→c1b8→c1b9).
        masterTL.set(zr, { scaleY: 0, opacity: 1 }, 0);
        toModeA(33.0);   // boundary moved 30.2→33.0 so Mode-A opens exactly with c1b5 (no 3s blank)
        toFull(60.0);    // full-frame the 9.5s c1b6→c1b6b talking gap (≥8s; was blank-left)
        toModeA(69.5);   // back to Mode-A exactly as c1b6b enters

        // Ken Burns 1.0 → 1.03 across comp 33 → 111.3 (~78.3s). Scale on inner; position on frame (no conflict).
        masterTL.fromTo(vid,
          { scale: 1.0, transformOrigin: "center center" },
          { scale: 1.03, duration: 78.3, ease: "none" },
          33.0
        );

        // Variety comes from the device-beats INSIDE Mode A. Ends in Mode A.

        window.__timelines["master"] = masterTL;
      </script>
    </div>

    <!-- A-roll: full-frame by default; master timeline shrinks to Mode A once at comp 30.2. media-start 239.10 -->
    <div id="short_mag_cut_frame">
      <video id="short_mag_cut"
        src="source.mp4" muted playsinline
        data-start="0" data-media-start="239.10" data-duration="111.3" data-track-index="1"></video>
    </div>
    <audio id="a-roll-audio"
      src="source.mp4"
      data-start="0" data-media-start="239.10" data-duration="111.3" data-track-index="5" data-volume="1"></audio>
  </body>
</html>
