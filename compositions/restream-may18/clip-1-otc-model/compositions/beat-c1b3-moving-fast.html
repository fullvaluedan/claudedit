<template id="beat-c1b3-moving-fast-template">
<!--
  c1b3 — KINETIC · comp 9.4–15.4 · src 248.50–254.50 · FULL-FRAME (both speakers) · WORD-SYNCED
  Stays FULL-FRAME — grouped with c1b1 (no Mode-A flip between them; R1).
  Jasper: "But it is MOVING VERY FAST. Like I HAVEN'T SEEN it moving like this for as long as I've been looking at the space."
  Phrase build-and-STAY (NO dim). Cyan payoff = UNLIKE ANY YEAR PRIOR (a marked EDITORIAL compression of
  "haven't seen it … for as long as I've been looking"), fired on the real word "haven't". No year numerals (date rule).
  WORD-SYNCED: moving@10.12 very@10.38 haven't@11.36 (src−239.10)
-->
<div data-composition-id="beat-c1b3-moving-fast" data-width="1920" data-height="1080" data-duration="6.0">

  <div class="b3-backdrop" data-layout-ignore></div>

  <div class="b3-zone">
    <div class="b3-words">
      <div id="b3-l1" class="b3-line">IT'S MOVING</div>
      <div id="b3-l2" class="b3-line">VERY FAST</div>
      <div id="b3-l3" class="b3-line b3-cyan b3-line-long">UNLIKE ANY YEAR PRIOR</div>
    </div>
  </div>

  <style>
    [data-composition-id="beat-c1b3-moving-fast"] {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: transparent; font-family: "Inter", "Helvetica", sans-serif;
    }
    [data-composition-id="beat-c1b3-moving-fast"] .b3-backdrop {
      position: absolute; top: 0; left: 0; width: 1000px; height: 1080px;
      background: linear-gradient(to right,
        rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.58) 60%, transparent 100%);
      pointer-events: none;
    }
    [data-composition-id="beat-c1b3-moving-fast"] .b3-zone {
      position: absolute; top: 0; left: 0; width: 1000px; height: 1080px;
      display: flex; align-items: center; padding-left: 80px;
    }
    [data-composition-id="beat-c1b3-moving-fast"] .b3-words {
      display: flex; flex-direction: column; gap: 12px; width: 100%;
    }
    [data-composition-id="beat-c1b3-moving-fast"] .b3-line {
      font-family: "Inter", sans-serif; font-weight: 900; font-size: 130px;
      color: #ffffff; line-height: 1.0; letter-spacing: -0.03em;
      text-transform: uppercase; opacity: 0;
      text-shadow: 0 4px 22px rgba(0,0,0,0.95), 0 2px 8px rgba(0,0,0,0.85);
    }
    /* Long payoff line — smaller so it never wraps in the left zone */
    [data-composition-id="beat-c1b3-moving-fast"] .b3-line-long {
      font-size: 84px; letter-spacing: -0.02em;
    }
    [data-composition-id="beat-c1b3-moving-fast"] .b3-cyan {
      color: #00d4ff;
      text-shadow:
        0 0 80px rgba(0,212,255,0.95), 0 0 40px rgba(0,212,255,0.75),
        0 0 18px rgba(0,212,255,0.55), 0 4px 22px rgba(0,0,0,0.85);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // beat starts comp 9.4 → local offsets = comp − 9.4
    // "moving" comp 10.12 → 0.72
    tl.fromTo("#b3-l1", {opacity:0, y:28}, {opacity:1, y:0, duration:0.28, ease:"expo.out"}, 0.72);
    // "very" comp 10.38 → 0.98
    tl.fromTo("#b3-l2", {opacity:0, y:28}, {opacity:1, y:0, duration:0.28, ease:"expo.out"}, 0.98);
    // "haven't" comp 11.36 → 1.96 (cyan payoff, scale pop) — holds to beat end (long line)
    tl.fromTo("#b3-l3", {opacity:0, y:28, scale:0.92}, {opacity:1, y:0, scale:1, duration:0.32, ease:"expo.out"}, 1.96);

    // Whole stack drifts up + fades @ comp 14.6 → local 5.2 (still full-frame; c1b4 clean breath follows)
    tl.to(".b3-line", {y:-32, opacity:0, duration:0.35, ease:"power2.in"}, 5.2);

    window.__timelines["beat-c1b3-moving-fast"] = tl;
  })();
  </script>
</div>
</template>
