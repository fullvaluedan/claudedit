<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clip 3 — Structured Products: Autocallables & Accelerators (11:58–13:28)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body, html {
        width: 1920px; height: 1080px;
        background: #0a0a0a; overflow: hidden;
        font-family: "Inter", sans-serif;
      }
      #master-root { width: 1920px; height: 1080px; position: relative; background: #0a0a0a; }

      /* Dot grid */
      #master-root::before {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(circle, rgba(255,255,255,0.038) 1px, transparent 1px);
        background-size: 44px 44px; pointer-events: none; z-index: 0;
      }

      /* Left-zone glow (Mode A only) */
      #bg-glow {
        position: absolute; top: 0; left: 0; width: 1152px; height: 1080px;
        background:
          radial-gradient(ellipse at 22% 55%, rgba(0,212,255,0.13) 0%, transparent 50%),
          radial-gradient(ellipse at 78% 18%, rgba(0,212,255,0.05) 0%, transparent 38%);
        pointer-events: none; z-index: 0; opacity: 0;
      }
      #zone-rule {
        position: absolute; left: 1151px; top: 60px; width: 1px; height: 960px;
        background: #2a2a2a; transform-origin: top center; z-index: 1; opacity: 0;
      }

      /*
        VIDEO — starts FULL FRAME (1920×1080), visible from t=0 for the kinetic term-reveal (c3b1).
        GSAP transitions to Mode A at ~comp 6.3 and holds the 54.6s Mode-A body.

        Mode A (80% scale): width:614, height:864
          Centered in right zone: x=1152+(768-614)/2=1229, y=(1080-864)/2=108
          Bottom clearance: 1080-108-864=108px > 40px ✓ | Top clearance: 108px > 20px ✓
          object-position: 80% center → centers Jasper (guest, right half), clears the x=960 seam,
          name "Jasper De Maere · Wintermute" fully readable.
      */
      #short_mag_cut_frame {
        position: absolute;
        left: 0; top: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: transparent;
        border-radius: 0; z-index: 2;
      }
      #short_mag_cut,
      #short_mag_cut_frame > img.__render_frame__,
      #short_mag_cut_frame > img.__preview_render_frame__ {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover;
        object-position: 80% center;
        display: block;
      }

      .overlay-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
      }
      /* z-index:3 — EVERY live overlay beat id (else it renders behind the z-index:2 video) */
      #beat-c3b1, #beat-c3b2, #beat-c3b3, #beat-c3b5, #beat-c3b6, #beat-c3b7, #beat-c3b9 { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="master-root" data-composition-id="master" data-width="1920" data-height="1080" data-start="0" data-duration="90.3">
      <div id="bg-glow" data-layout-ignore></div>
      <div id="zone-rule" data-layout-ignore></div>

      <!-- c3b1 — KINETIC TERM-REVEAL (full-frame, both speakers) — comp 0.0–6.4 -->
      <div id="beat-c3b1" class="overlay-layer clip"
        data-composition-id="beat-c3b1"
        data-composition-src="compositions/beat-c3b1-termreveal.html"
        data-start="0.0" data-duration="6.4" data-track-index="3"></div>

      <!-- c3b2 — LIQUID-GLASS GLOSSARY card (Mode A) — comp 6.4–18.5 -->
      <div id="beat-c3b2" class="overlay-layer clip"
        data-composition-id="beat-c3b2"
        data-composition-src="compositions/beat-c3b2-glossary.html"
        data-start="6.4" data-duration="12.1" data-track-index="3"></div>

      <!-- c3b3 — FLOWCHART distribution chain (Mode A) — comp 18.5–29.0 -->
      <div id="beat-c3b3" class="overlay-layer clip"
        data-composition-id="beat-c3b3"
        data-composition-src="compositions/beat-c3b3-distribution.html"
        data-start="18.5" data-duration="10.5" data-track-index="3"></div>

      <!-- c3b5 — Mode-A CAPTION: demand reality — comp 29.0–42.4 (enters 1.5s earlier to fill the old 29.0–30.5 blank-left gap — R7; Mode-A is never graphic-less) -->
      <div id="beat-c3b5" class="overlay-layer clip"
        data-composition-id="beat-c3b5"
        data-composition-src="compositions/beat-c3b5-demand.html"
        data-start="29.0" data-duration="13.4" data-track-index="3"></div>

      <!-- c3b6 — ★ DATA-CHART adoption by region (PRIMARY DEVICE, Mode A centrepiece) — comp 42.4–61.0 -->
      <div id="beat-c3b6" class="overlay-layer clip"
        data-composition-id="beat-c3b6"
        data-composition-src="compositions/beat-c3b6-datachart.html"
        data-start="42.4" data-duration="18.6" data-track-index="3"></div>

      <!-- c3b7 — KINETIC PRICE↔NARRATIVE loop (full-frame, both speakers) — comp 61.0–75.0 -->
      <div id="beat-c3b7" class="overlay-layer clip"
        data-composition-id="beat-c3b7"
        data-composition-src="compositions/beat-c3b7-price-narrative.html"
        data-start="61.0" data-duration="14.0" data-track-index="3"></div>

      <!-- c3b9 — STAT close: TAKE RATES (Mode A; held to clip end, no outro) — comp 75.0–90.3 -->
      <div id="beat-c3b9" class="overlay-layer clip"
        data-composition-id="beat-c3b9"
        data-composition-src="compositions/beat-c3b9-take-rates.html"
        data-start="75.0" data-duration="15.3" data-track-index="3"></div>

      <script>
        window.__timelines = window.__timelines || {};
        const masterTL = gsap.timeline({ paused: true });

        const v   = document.getElementById("short_mag_cut_frame");
        const vid = document.getElementById("short_mag_cut");
        const gr  = document.getElementById("bg-glow");
        const zr  = document.getElementById("zone-rule");

        // Mode A: 80% of right 40% zone. object-position:80% center shows full name.
        const MODE_A = { left: 1229, top: 108, width: 614, height: 864 };

        // ── VIEW-TIMELINE (only 3 view switches — proves R1, no flip-flop) ──
        //   FF      0.0  – 6.4   (6.4s)  c3b1 term-reveal           [intro zone]
        //   MODE-A  6.4  – 61.0  (54.6s) c3b2→c3b3→breath→c3b5→c3b6 [body — frame rock-stable]
        //   FF      61.0 – 75.0  (14.0s) c3b7 price↔narrative loop  [only A-B-A middle; 14.0s > ~12s]
        //   MODE-A  75.0 – 90.3  (15.3s) c3b9 take-rates stat       [held to clip end, no exit]

        // PHASE 0: comp 0.0–6.4 — FULL FRAME (c3b1 fires over both speakers). CSS default; no GSAP.

        // SWITCH 1 @ ~6.3 — FULL FRAME → Mode A (c3b2 slides in). Ken Burns 1.00→1.04 begins.
        masterTL.to(v, {
          left: MODE_A.left, top: MODE_A.top,
          width: MODE_A.width, height: MODE_A.height,
          borderRadius: "6px",
          duration: 0.7, ease: "expo.inOut"
        }, 6.3);
        masterTL.to(gr, { opacity: 1, duration: 0.5, ease: "power2.out" }, 6.6);
        masterTL.fromTo(zr, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.6, ease: "power4.out" }, 6.7);
        masterTL.fromTo(vid,
          { scale: 1.0, transformOrigin: "center center" },
          { scale: 1.04, duration: 54, ease: "none" },
          6.8
        );

        // MODE-A HOLDS comp 6.4–60.6 across c3b2 (card) → c3b3 (flowchart) → clean breath
        //   (29.0–30.5) → c3b5 (caption) → c3b6 (data-chart). Frame stable — NO bounce.

        // SWITCH 2 @ ~60.8 — Mode A → FULL FRAME for c3b7 (kinetic fires 66.24). glow/rule out at 60.6.
        masterTL.to([gr, zr], { opacity: 0, duration: 0.3, ease: "power2.in" }, 60.6);
        masterTL.to(v, {
          left: 0, top: 0, width: 1920, height: 1080,
          borderRadius: "0px", duration: 0.4, ease: "expo.inOut"
        }, 60.8);

        // FF HOLDS comp 61.0–74.6 (14.0s) — c3b7 price↔narrative loop over both speakers.

        // SWITCH 3 @ ~74.8 — FULL FRAME → Mode A for c3b9 stat close. HELD to clip end (90.3) — no exit.
        masterTL.to(v, {
          left: MODE_A.left, top: MODE_A.top,
          width: MODE_A.width, height: MODE_A.height,
          borderRadius: "6px", duration: 0.4, ease: "expo.inOut"
        }, 74.8);
        masterTL.to(gr, { opacity: 1, duration: 0.35, ease: "power2.out" }, 74.8);
        masterTL.fromTo(zr, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.45, ease: "power4.out" }, 74.8);
        // Ken Burns continues gently to clip end on the held Mode-A frame
        masterTL.fromTo(vid,
          { scale: 1.0, transformOrigin: "center center" },
          { scale: 1.03, duration: 15.3, ease: "none" },
          75.0
        );

        // PHASE END: comp 75.0–90.3 — Mode A held; c3b9 content to clip end. No outro/exit.

        window.__timelines["master"] = masterTL;
      </script>
    </div>

    <!-- A-roll: full-frame by default; GSAP transitions to Mode A at ~comp 6.3. media-start = src_in 718.20 -->
    <div id="short_mag_cut_frame">
      <video id="short_mag_cut"
        src="source.mp4" muted playsinline
        data-start="0" data-duration="90.3" data-media-start="718.20" data-track-index="1"></video>
    </div>
    <audio id="a-roll-audio"
      src="source.mp4"
      data-start="0" data-duration="90.3" data-media-start="718.20" data-track-index="5" data-volume="1"></audio>
  </body>
</html>
