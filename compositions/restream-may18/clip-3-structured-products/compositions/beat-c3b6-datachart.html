<template id="beat-c3b6-template">
<!--
  c3b6 — ★ DATA-CHART: structured-product adoption by region (the distinct PRIMARY DEVICE)
  comp 42.4–61.0 | src 760.60–779.20  (18.6s — the clip's largest beat / centrepiece)
  Restyle of the installed `data-chart` block (bar + line combo, staggered bar reveal + animated
  line + value labels) → DESIGN dark palette, FIT THE LEFT 60% ZONE (Mode A).
  Bars NEUTRAL #3a4654; the conversion LINE (`Take rate`) + dots are the SINGLE cyan (D7).
  Dropped the block's Libre Baskerville / #faf9f6. SVG-bar+line mechanics retained.
  Reveal timing anchored to spoken geography (comp = src − 718.20):
    headline+subtitle structural ~43.0 (off 0.6)
    Asia bar grows  → 49.02 (off 6.62)   Asia 767.22
    Take rate line annotation → 51.48 (off 9.08)  take 769.68 / rate 769.86  (R3: prints TAKE RATE)
    Europe + US bar grows → 54.66 (off 12.26)  Europe 772.86 / US 773.40
    cyan line peaks (no extra cyan callout) → 58.80 (off 16.40)  demand 777.00
-->
<div data-composition-id="beat-c3b6" data-width="1920" data-height="1080" data-duration="18.6">

  <!-- Dark gradient backdrop (left zone) -->
  <div class="b6-backdrop" data-layout-ignore></div>

  <div class="b6-zone">
    <div class="b6-inner">
      <div id="b6-eye" class="b6-eye">STRUCTURED PRODUCTS · BY REGION</div>
      <div id="b6-rule" class="b6-rule"></div>

      <h1 id="b6-headline" class="b6-headline">STRUCTURED-PRODUCT ADOPTION</h1>
      <p id="b6-subtitle" class="b6-subtitle">Best fit by region</p>

      <div id="b6-key" class="b6-key">
        <div class="b6-key-item"><div class="b6-key-box"></div><span class="b6-key-text">Adoption</span></div>
        <!-- R4: legend "Take rate" item removed — the cyan line is labeled inline by #b6-annot (no duplicate) -->
      </div>

      <!-- SVG chart: 2 neutral bars + cyan rising Take-rate line -->
      <svg class="b6-svg" viewBox="0 0 980 520" preserveAspectRatio="xMidYMid meet">
        <g class="b6-gridlines"></g>
        <g class="b6-x-labels"></g>
        <g class="b6-bars"></g>
        <g class="b6-bar-labels"></g>
        <g class="b6-line-group">
          <path class="b6-conv-path" fill="none" stroke="#00d4ff" stroke-width="4"
            style="filter: drop-shadow(0 0 10px rgba(0,212,255,0.55));"/>
          <circle class="b6-line-dot" r="8" fill="#00d4ff" style="opacity:0; filter: drop-shadow(0 0 10px rgba(0,212,255,0.7));"/>
        </g>
        <line x1="90" y1="420" x2="900" y2="420" stroke="#2a2a2a" stroke-width="2"/>
      </svg>

      <!-- Cyan Take-rate line annotation (text), R3 correction owned here -->
      <div id="b6-annot" class="b6-annot">Take rate</div>

      <div id="b6-source" class="b6-source">Wintermute desk view</div>
    </div>
  </div>

  <style>
    [data-composition-id="beat-c3b6"] {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: transparent; font-family: "Inter", sans-serif;
    }
    [data-composition-id="beat-c3b6"] .b6-backdrop {
      position: absolute; top: 0; left: 0; width: 1200px; height: 1080px;
      background: linear-gradient(to right,
        rgba(10,13,18,0.90) 0%, rgba(10,13,18,0.84) 48%,
        rgba(10,13,18,0.32) 74%, transparent 92%);
      pointer-events: none;
    }
    [data-composition-id="beat-c3b6"] .b6-zone {
      position: absolute; top: 0; left: 0; width: 1152px; height: 1080px;
      display: flex; align-items: center;
      mask-image: linear-gradient(to right, black 84%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, black 84%, transparent 100%);
    }
    [data-composition-id="beat-c3b6"] .b6-inner { padding: 0 80px; width: 100%; position: relative; }
    [data-composition-id="beat-c3b6"] .b6-idx {
      font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 500;
      color: #f0f0f0; letter-spacing: 0.1em; margin-bottom: 12px; opacity: 0;
    }
    [data-composition-id="beat-c3b6"] .b6-eye {
      font-family: "Inter", sans-serif; font-size: 32px; font-weight: 700;
      color: #f0f0f0; letter-spacing: 0.2em; text-transform: uppercase;
      margin-bottom: 16px; opacity: 0;
    }
    [data-composition-id="beat-c3b6"] .b6-rule {
      width: 0; height: 2px; background: #2a2a2a; margin-bottom: 22px;
    }
    [data-composition-id="beat-c3b6"] .b6-headline {
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 44px;
      color: #f0f0f0; letter-spacing: -0.01em; line-height: 1.05; margin: 0;
      clip-path: inset(0 100% 0 0); white-space: nowrap;
    }
    [data-composition-id="beat-c3b6"] .b6-subtitle {
      font-family: "Inter", sans-serif; font-size: 26px; font-weight: 600;
      color: #f0f0f0; margin: 10px 0 0 0; clip-path: inset(0 100% 0 0); white-space: nowrap;
    }
    [data-composition-id="beat-c3b6"] .b6-key {
      display: flex; gap: 30px; margin: 18px 0 6px 0; opacity: 0;
    }
    [data-composition-id="beat-c3b6"] .b6-key-item { display: flex; align-items: center; gap: 10px; }
    [data-composition-id="beat-c3b6"] .b6-key-box { width: 16px; height: 16px; background: #3a4654; border-radius: 2px; }
    [data-composition-id="beat-c3b6"] .b6-key-line {
      width: 26px; height: 4px; background: #00d4ff; border-radius: 2px;
      box-shadow: 0 0 10px rgba(0,212,255,0.6);
    }
    [data-composition-id="beat-c3b6"] .b6-key-text {
      font-family: "Inter", sans-serif; font-size: 24px; font-weight: 600; color: #f0f0f0;
    }
    [data-composition-id="beat-c3b6"] .b6-svg {
      width: 980px; height: 520px; overflow: visible; display: block;
    }
    [data-composition-id="beat-c3b6"] .b6-grid-line { stroke: #181818; stroke-width: 1px; opacity: 0; }
    [data-composition-id="beat-c3b6"] .b6-axis-label {
      font-family: "Inter", sans-serif; font-size: 30px; font-weight: 700; fill: #f0f0f0; text-anchor: middle;
    }
    [data-composition-id="beat-c3b6"] .b6-bar { fill: #3a4654; }
    [data-composition-id="beat-c3b6"] .b6-bar-label {
      font-family: "Inter", sans-serif; font-size: 30px; font-weight: 700; fill: #f0f0f0; text-anchor: middle; opacity: 0;
    }
    [data-composition-id="beat-c3b6"] .b6-conv-path { stroke-dasharray: 1200; stroke-dashoffset: 1200; }
    /* Cyan Take-rate annotation text, positioned over the line peak (left, near Asia) */
    [data-composition-id="beat-c3b6"] .b6-annot {
      position: absolute; left: 150px; top: 540px;
      font-family: "Inter", sans-serif; font-size: 30px; font-weight: 800;
      color: #00d4ff; letter-spacing: 0.01em; opacity: 0;
      text-shadow: 0 0 28px rgba(0,212,255,0.7), 0 2px 10px rgba(0,0,0,0.7);
    }
    [data-composition-id="beat-c3b6"] .b6-source {
      font-family: "Inter", sans-serif; font-size: 22px; font-weight: 600;
      color: #f0f0f0; opacity: 0; margin-top: 8px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const S = '[data-composition-id="beat-c3b6"]';
    const svg = document.querySelector(S + " .b6-svg");
    const tl = gsap.timeline({ paused: true });

    // Data (per EDL): relative adoption bars + rising cyan Take-rate line
    const cats = ["Asia", "Europe + US"];
    const adoptionData = [22, 12];          // Asia clearly ahead; Europe+US catching up
    const takeRateData = [78, 54];          // rising take-rate trend (Asia high, Europe+US rising)

    // Chart geometry (within 980×520 viewBox; baseline y=420)
    const startX = 90, baseY = 420, chartH = 340, chartW = 810;
    const barW = 180;
    const maxAdopt = 25, maxRate = 100;
    const xPos = (i) => startX + chartW * (i === 0 ? 0.27 : 0.73);
    const barY = (v) => baseY - (v / maxAdopt) * chartH;
    const lineY = (v) => baseY - (v / maxRate) * chartH;

    const gridG = svg.querySelector(".b6-gridlines");
    const xG = svg.querySelector(".b6-x-labels");
    const barsG = svg.querySelector(".b6-bars");
    const barLabG = svg.querySelector(".b6-bar-labels");
    const convPath = svg.querySelector(".b6-conv-path");
    const lineDot = svg.querySelector(".b6-line-dot");

    // Gridlines
    for (let i = 1; i <= 4; i++) {
      const y = baseY - i * (chartH / 4);
      const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
      ln.setAttribute("x1", startX); ln.setAttribute("y1", y);
      ln.setAttribute("x2", startX + chartW); ln.setAttribute("y2", y);
      ln.setAttribute("class", "b6-grid-line");
      gridG.appendChild(ln);
    }

    // Bars + x labels + bar labels + line points
    const linePts = [];
    cats.forEach((c, i) => {
      const x = xPos(i);

      const lbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
      lbl.setAttribute("x", x); lbl.setAttribute("y", baseY + 44);
      lbl.setAttribute("class", "b6-axis-label"); lbl.textContent = c;
      xG.appendChild(lbl);

      const bh = (adoptionData[i] / maxAdopt) * chartH;
      const bar = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      bar.setAttribute("x", x - barW / 2); bar.setAttribute("y", baseY);
      bar.setAttribute("width", barW); bar.setAttribute("height", 0);
      bar.setAttribute("rx", 4); bar.setAttribute("class", "b6-bar");
      barsG.appendChild(bar);

      linePts.push(`${x},${lineY(takeRateData[i])}`);
    });

    convPath.setAttribute("d", `M ${linePts.join(" L ")}`);
    const pathLen = convPath.getTotalLength();
    convPath.style.strokeDasharray = pathLen;
    convPath.style.strokeDashoffset = pathLen;

    // ---- TIMELINE (offsets relative to beat start comp 42.4) ----
    // Headline + subtitle (structural, ~comp 43.0 = off 0.6)
    tl.fromTo("#b6-eye", {opacity:0, y:12}, {opacity:1, y:0, duration:0.32, ease:"power3.out"}, 0.40);
    tl.fromTo("#b6-rule", {width:"0px"}, {width:"360px", duration:0.5, ease:"power3.inOut"}, 0.52);
    tl.to("#b6-headline", {clipPath:"inset(0 0% 0 0)", duration:0.9, ease:"power1.inOut"}, 0.60);
    tl.to("#b6-subtitle", {clipPath:"inset(0 0% 0 0)", duration:0.9, ease:"power1.inOut"}, 0.95);
    tl.to("#b6-key", {opacity:1, duration:0.4, ease:"power2.out"}, 1.6);
    tl.to(S + " .b6-grid-line", {opacity:1, duration:0.4, stagger:0.12, ease:"power2.out"}, 1.8);

    // Asia bar grows → comp 49.02 = off 6.62
    const bars = barsG.querySelectorAll(".b6-bar");
    const asiaH = (adoptionData[0] / maxAdopt) * chartH;
    tl.to(bars[0], {attr:{height:asiaH, y:baseY - asiaH}, duration:0.7, ease:"power2.out"}, 6.62);

    // Take rate line draws + annotation appears → comp 51.48 = off 9.08 (R3: prints TAKE RATE)
    tl.set(lineDot, {opacity:1, attr:{cx: xPos(0), cy: lineY(takeRateData[0])}}, 9.08);
    tl.to(convPath, {strokeDashoffset:0, duration:2.4, ease:"none"}, 9.08);
    tl.to("#b6-annot", {opacity:1, duration:0.4, ease:"power2.out"}, 9.20);
    // dot travels Asia → Europe+US across the draw
    tl.to(lineDot, {attr:{cx: xPos(1), cy: lineY(takeRateData[1])}, duration:2.4, ease:"none"}, 9.08);

    // Europe + US bar grows → comp 54.66 = off 12.26
    const euH = (adoptionData[1] / maxAdopt) * chartH;
    tl.to(bars[1], {attr:{height:euH, y:baseY - euH}, duration:0.7, ease:"power2.out"}, 12.26);

    // Bar value labels (region names already on axis; bars stay neutral — no numeric clutter,
    // the cyan line is the story). Source line in.
    tl.to("#b6-source", {opacity:1, duration:0.4, ease:"power2.out"}, 13.4);

    // Cyan line peaks (no extra cyan callout) → comp 58.80 = off 16.40: small pulse on the annotation+dot
    tl.to("#b6-annot", {scale:1.06, transformOrigin:"left center", duration:0.3, yoyo:true, repeat:1, ease:"power2.inOut"}, 16.40);
    tl.to(lineDot, {scale:1.25, transformOrigin:"center center", duration:0.3, yoyo:true, repeat:1, ease:"power2.inOut"}, 16.40);

    // Exit as frame returns to FF for c3b7 (offset 18.2 = comp 60.6)
    tl.to(".b6-zone", {opacity:0, duration:0.4, ease:"power2.in"}, 18.20);

    window.__timelines["beat-c3b6"] = tl;
  })();
  </script>
</div>
</template>
