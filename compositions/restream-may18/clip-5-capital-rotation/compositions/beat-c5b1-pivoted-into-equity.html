<template id="beat-c5b1-template">
<!--
  b1 — OPENING KINETIC · the dialog-matched open (kinetic-type, phrase build, NO DIM)
  beat data-start = -0.2 → internal offset = comp_t - (-0.2) = comp_t + 0.2
  3-phrase build over full-frame video (BOTH speakers), dark left-gradient backdrop:
    L1 RETAIL PIVOTED   comp 0.34 ("pivoted" table 15.84)  -> offset 0.54
    L2 VERY AGGRESSIVELY comp 1.60 ("aggressively" 17.10)  -> offset 1.80
    L3 INTO EQUITY *CYAN comp 2.58 ("equity" 18.08)        -> offset 2.78
  Lines slam in and STAY. Whole stack drifts out ~comp 3.4 so FULL frame is clean before b2.
-->
<div data-composition-id="beat-c5b1" data-width="1920" data-height="1080" data-duration="5.2">

  <div class="c5b1-backdrop" data-layout-ignore></div>

  <div class="c5b1-zone">
    <div class="c5b1-words">
      <div id="c5b1-l1" class="c5b1-line">RETAIL PIVOTED</div>
      <div id="c5b1-l2" class="c5b1-line">VERY AGGRESSIVELY</div>
      <div id="c5b1-l3" class="c5b1-line c5b1-cyan">INTO EQUITY</div>
    </div>
  </div>

  <style>
    [data-composition-id="beat-c5b1"] {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: transparent;
      font-family: "Inter", "Helvetica", sans-serif;
    }
    [data-composition-id="beat-c5b1"] .c5b1-backdrop {
      position: absolute; top: 0; left: 0; width: 1000px; height: 1080px;
      background: linear-gradient(to right,
        rgba(0,0,0,0.78) 0%,
        rgba(0,0,0,0.55) 60%,
        transparent 100%);
      pointer-events: none;
    }
    [data-composition-id="beat-c5b1"] .c5b1-zone {
      position: absolute; top: 0; left: 0;
      width: 1000px; height: 1080px;
      display: flex; align-items: center;
      padding-left: 80px;
    }
    [data-composition-id="beat-c5b1"] .c5b1-words {
      display: flex; flex-direction: column; gap: 12px; width: 100%;
    }
    [data-composition-id="beat-c5b1"] .c5b1-line {
      font-family: "Inter", sans-serif; font-weight: 900; font-size: 130px;
      color: #ffffff; line-height: 1.0; letter-spacing: -0.03em;
      text-transform: uppercase; opacity: 0;
      text-shadow: 0 4px 22px rgba(0,0,0,0.95), 0 2px 8px rgba(0,0,0,0.85);
    }
    [data-composition-id="beat-c5b1"] .c5b1-cyan {
      color: #00d4ff;
      text-shadow:
        0 0 80px rgba(0,212,255,0.95),
        0 0 40px rgba(0,212,255,0.75),
        0 0 18px rgba(0,212,255,0.55),
        0 4px 22px rgba(0,0,0,0.85);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // L1 "RETAIL PIVOTED" — comp 0.34 → offset 0.54
    tl.fromTo("#c5b1-l1", {opacity:0, y:28}, {opacity:1, y:0, duration:0.28, ease:"expo.out"}, 0.54);
    // L2 "VERY AGGRESSIVELY" — comp 1.60 → offset 1.80
    tl.fromTo("#c5b1-l2", {opacity:0, y:28}, {opacity:1, y:0, duration:0.28, ease:"expo.out"}, 1.80);
    // L3 "INTO EQUITY" *CYAN — comp 2.58 → offset 2.78
    tl.fromTo("#c5b1-l3", {opacity:0, y:28, scale:0.92}, {opacity:1, y:0, scale:1, duration:0.32, ease:"expo.out"}, 2.78);

    // Whole stack drifts out ~comp 3.4 → offset 3.6 (clean FULL frame before b2)
    tl.to(".c5b1-line", {y:-32, opacity:0, duration:0.28, ease:"power2.in"}, 3.6);

    window.__timelines["beat-c5b1"] = tl;
  })();
  </script>
</div>
</template>
