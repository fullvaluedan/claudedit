<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clip 5 — Capital Rotation (18:55–21:38)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body, html {
        width: 1920px; height: 1080px;
        background: #0a0a0a; overflow: hidden;
        font-family: "Inter", sans-serif;
      }
      #master-root { width: 1920px; height: 1080px; position: relative; background: #0a0a0a; }

      /* Dot grid */
      #master-root::before {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(circle, rgba(255,255,255,0.038) 1px, transparent 1px);
        background-size: 44px 44px; pointer-events: none; z-index: 0;
      }

      /* Left-zone glow */
      #bg-glow {
        position: absolute; top: 0; left: 0; width: 1152px; height: 1080px;
        background:
          radial-gradient(ellipse at 22% 55%, rgba(0,212,255,0.13) 0%, transparent 50%),
          radial-gradient(ellipse at 78% 18%, rgba(0,212,255,0.05) 0%, transparent 38%);
        pointer-events: none; z-index: 0; opacity: 0;
      }
      #zone-rule {
        position: absolute; left: 1151px; top: 60px; width: 1px; height: 960px;
        background: #2a2a2a; transform-origin: top center; z-index: 1; opacity: 0;
      }

      /*
        VIDEO — starts FULL FRAME (1920×1080), visible from t=0 for kinetic intro (both speakers).
        GSAP transitions to Mode A at the 4 phase boundaries only.

        Mode A (80% scale): width:614, height:864
          Centered in right zone: x=1152+(768-614)/2=1229, y=(1080-864)/2=108
          Bottom clearance: 1080-108-864=108px > 40px
          Top clearance: 108px > 20px
          object-position: 83% center → shows source x≈957-1725 (Jasper's half, name lower-third visible)
      */
      #short_mag_cut_frame {
        position: absolute;
        left: 0; top: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: transparent;
        border-radius: 0; z-index: 2;
      }
      #short_mag_cut,
      #short_mag_cut_frame > img.__render_frame__,
      #short_mag_cut_frame > img.__preview_render_frame__ {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover;
        /* 83% center: shows source from ~x:957 = Jasper's half (guest right), name fully visible */
        object-position: 83% center;
        display: block;
      }

      .overlay-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
      }
      /* z-index:3 — EVERY overlay beat id MUST be listed here or it renders behind the video (z-index:2) */
      #beat-c5b1, #beat-c5b2, #beat-c5b3, #beat-c5b4, #beat-c5b5,
      #beat-c5b6, #beat-c5b7, #beat-c5b8, #beat-c5b9, #beat-c5b10,
      #beat-c5b11 { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="master-root" data-composition-id="master" data-width="1920" data-height="1080" data-start="0" data-duration="163">
      <div id="bg-glow" data-layout-ignore></div>
      <div id="zone-rule" data-layout-ignore></div>

      <!--
        VIEW-TIMELINE (grouped, proves R1 — 5 phases, all >=8s, no A-B-A within 12s):
          0.0  – 15.5  FULL    (b1, b2)   intro kinetics over both speakers
          15.5 – 64.9  Mode-A  (b3,b4,b5) rotation card -> JPM stat -> Wintermute quote
          64.9 – 84.1  FULL    (b6, b7)   Q/A exchange over both speakers
          84.1 – 154.6 Mode-A  (b8,b9,b10) exuberance flow -> vol-profile chart -> vol comparison
          154.6– 163.0 FULL    (b11)      closer kinetic, settles to clean video (D4 no-outro)
        Only 4 GSAP mode toggles in 163s. Smallest sustained phase = 8.4s (closer). All A-B-A gaps >=19s.
      -->

      <!-- b1 — OPENING KINETIC "RETAIL PIVOTED / VERY AGGRESSIVELY / INTO EQUITY" — FULL -->
      <div id="beat-c5b1" class="overlay-layer clip"
        data-composition-id="beat-c5b1"
        data-composition-src="compositions/beat-c5b1-pivoted-into-equity.html"
        data-start="-0.2" data-duration="5.2" data-track-index="3"></div>

      <!-- b2 — KINETIC "ALTCOIN SEASON / IS NOW HAPPENING / IN EQUITIES" — FULL (2nd of intro pair) -->
      <div id="beat-c5b2" class="overlay-layer clip"
        data-composition-id="beat-c5b2"
        data-composition-src="compositions/beat-c5b2-altcoin-season.html"
        data-start="12.0" data-duration="3.4" data-track-index="3"></div>

      <!-- b3 — ROTATION before->after CARD (distinct device pt1) — Mode-A -->
      <div id="beat-c5b3" class="overlay-layer clip"
        data-composition-id="beat-c5b3"
        data-composition-src="compositions/beat-c5b3-rotation-card.html"
        data-start="15.5" data-duration="4.9" data-track-index="3"></div>

      <!-- b4 — JP MORGAN ALL-TIME-HIGH stat (swiss-grid) — Mode-A -->
      <div id="beat-c5b4" class="overlay-layer clip"
        data-composition-id="beat-c5b4"
        data-composition-src="compositions/beat-c5b4-jpm-all-time-high.html"
        data-start="20.5" data-duration="12.5" data-track-index="3"></div>

      <!-- b5 — WINTERMUTE WEEKLY + "marginal risk dollar" QUOTE CARD (liquid-glass) — Mode-A -->
      <div id="beat-c5b5" class="overlay-layer clip"
        data-composition-id="beat-c5b5"
        data-composition-src="compositions/beat-c5b5-wintermute-weekly-quote.html"
        data-start="38.9" data-duration="20.1" data-track-index="3"></div>

      <!-- b6 — HOST QUESTION kinetic "IS CRYPTO DEAD / FOR RETAIL TODAY" — FULL (Q of Q/A pair) -->
      <div id="beat-c5b6" class="overlay-layer clip"
        data-composition-id="beat-c5b6"
        data-composition-src="compositions/beat-c5b6-is-crypto-dead.html"
        data-start="64.6" data-duration="2.2" data-track-index="3"></div>

      <!-- b7 — JASPER'S ANSWER kinetic "NO — / NOT FOR THE OG HOLDERS / SINCE 2021" — FULL (A of Q/A pair) -->
      <div id="beat-c5b7" class="overlay-layer clip"
        data-composition-id="beat-c5b7"
        data-composition-src="compositions/beat-c5b7-not-for-the-og-holders.html"
        data-start="69.9" data-duration="9.7" data-track-index="3"></div>

      <!-- b8 — 2021 EXUBERANCE 3-node causal chain (hand-built flowchart, dark) — Mode-A -->
      <div id="beat-c5b8" class="overlay-layer clip"
        data-composition-id="beat-c5b8"
        data-composition-src="compositions/beat-c5b8-exuberance-flow.html"
        data-start="83.0" data-duration="38.0" data-track-index="3"></div>

      <!-- b9 — VOL-PROFILE two-series converging chart (hand-built data-chart, dark) — Mode-A -->
      <div id="beat-c5b9" class="overlay-layer clip"
        data-composition-id="beat-c5b9"
        data-composition-src="compositions/beat-c5b9-vol-profile-chart.html"
        data-start="121.0" data-duration="16.5" data-track-index="3"></div>

      <!-- b10 — VOL COMPARISON crypto down vs equity rising (swiss-grid two-col) — Mode-A -->
      <div id="beat-c5b10" class="overlay-layer clip"
        data-composition-id="beat-c5b10"
        data-composition-src="compositions/beat-c5b10-vol-comparison.html"
        data-start="143.4" data-duration="10.8" data-track-index="3"></div>

      <!-- b11 — CLOSER kinetic "THEY JUST WANT / A VOLATILITY TRADE / EQUITY OFFERS IT" — FULL -->
      <div id="beat-c5b11" class="overlay-layer clip"
        data-composition-id="beat-c5b11"
        data-composition-src="compositions/beat-c5b11-vol-trade-closer.html"
        data-start="154.3" data-duration="7.4" data-track-index="3"></div>

      <script>
        window.__timelines = window.__timelines || {};
        const masterTL = gsap.timeline({ paused: true });

        const v   = document.getElementById("short_mag_cut_frame");
        const vid = document.getElementById("short_mag_cut");
        const gr  = document.getElementById("bg-glow");
        const zr  = document.getElementById("zone-rule");

        // Mode A: 80% of right 40% zone. object-position:83% centers Jasper, name visible.
        const MODE_A = { left: 1229, top: 108, width: 614, height: 864 };

        // ── PHASE 0: 0.0–15.5 — FULL FRAME (b1+b2 kinetics over both speakers) ──
        // CSS default is full-frame; video visible from t=0. No GSAP needed.

        // Ken Burns: deterministic slow zoom across full 163s (no random, no repeat:-1)
        masterTL.fromTo(vid,
          { scale: 1.0, transformOrigin: "center center" },
          { scale: 1.04, duration: 163, ease: "none" },
          0
        );

        // ── TOGGLE 1: 15.0 — FULL → Mode-A (cinematic shrink) as b3 rotation card builds ──
        masterTL.to(v, {
          left: MODE_A.left, top: MODE_A.top,
          width: MODE_A.width, height: MODE_A.height,
          borderRadius: "6px",
          duration: 0.5, ease: "expo.inOut"
        }, 15.0);
        masterTL.to(gr, { opacity: 1, duration: 0.5, ease: "power2.out" }, 15.2);
        masterTL.fromTo(zr, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.6, ease: "power4.out" }, 15.3);

        // ── PHASE 1: 15.5–64.9 — Mode-A holds across b3, b4, b5 (one stable frame) ──

        // ── TOGGLE 2: 64.4 — Mode-A → FULL (expand) for b6 host-Q over both speakers ──
        masterTL.to([gr, zr], { opacity: 0, duration: 0.3, ease: "power2.in" }, 64.2);
        masterTL.to(v, {
          left: 0, top: 0, width: 1920, height: 1080,
          borderRadius: "0px", duration: 0.45, ease: "expo.inOut"
        }, 64.4);

        // ── PHASE 2: 64.9–84.1 — FULL holds across b6, b7 (Q/A exchange) ──

        // ── TOGGLE 3: 83.2 — FULL → Mode-A (shrink) for b8 flowchart ──
        // QA fix #3: shrink moved 83.6 → 83.2 so the b8 eyebrow (comp 83.30) is never over a stable FULL frame.
        masterTL.to(v, {
          left: MODE_A.left, top: MODE_A.top,
          width: MODE_A.width, height: MODE_A.height,
          borderRadius: "6px", duration: 0.5, ease: "expo.inOut"
        }, 83.2);
        masterTL.to(gr, { opacity: 1, duration: 0.45, ease: "power2.out" }, 83.4);
        masterTL.fromTo(zr, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.5, ease: "power4.out" }, 83.5);

        // ── PHASE 3: 84.1–154.6 — Mode-A holds across b8, b9, b10 (one stable frame) ──

        // ── TOGGLE 4: 154.0 — Mode-A → FULL (expand) for b11 closer over both speakers ──
        masterTL.to([gr, zr], { opacity: 0, duration: 0.3, ease: "power2.in" }, 153.8);
        masterTL.to(v, {
          left: 0, top: 0, width: 1920, height: 1080,
          borderRadius: "0px", duration: 0.45, ease: "expo.inOut"
        }, 154.0);

        // ── PHASE 4: 154.6–163.0 — FULL holds; b11 lines drift out @161.7; clean video to 163.0 (D4 no-outro) ──

        window.__timelines["master"] = masterTL;
      </script>
    </div>

    <!-- A-roll: full-frame by default; GSAP toggles to Mode A at the 4 phase boundaries -->
    <div id="short_mag_cut_frame">
      <video id="short_mag_cut"
        src="source.mp4" muted playsinline
        data-media-start="1135.5" data-duration="163"
        data-start="0" data-track-index="1"></video>
    </div>
    <audio id="a-roll-audio"
      src="source.mp4"
      data-media-start="1135.5" data-duration="163"
      data-start="0" data-track-index="5" data-volume="1"></audio>
  </body>
</html>
