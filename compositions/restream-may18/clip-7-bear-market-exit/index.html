<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clip 7 — Bear-Market Exit: The Narrative Cycle (v3)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body, html {
        width: 1920px; height: 1080px;
        background: #0a0a0a; overflow: hidden;
        font-family: "Inter", sans-serif;
      }
      #master-root { width: 1920px; height: 1080px; position: relative; background: #0a0a0a; }

      /* Dot grid */
      #master-root::before {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(circle, rgba(255,255,255,0.038) 1px, transparent 1px);
        background-size: 44px 44px; pointer-events: none; z-index: 0;
      }

      /* Left-zone glow */
      #bg-glow {
        position: absolute; top: 0; left: 0; width: 1152px; height: 1080px;
        background:
          radial-gradient(ellipse at 22% 55%, rgba(0,212,255,0.13) 0%, transparent 50%),
          radial-gradient(ellipse at 78% 18%, rgba(0,212,255,0.05) 0%, transparent 38%);
        pointer-events: none; z-index: 0; opacity: 0;
      }
      #zone-rule {
        position: absolute; left: 1151px; top: 60px; width: 1px; height: 960px;
        background: #2a2a2a; transform-origin: top center; z-index: 1; opacity: 0;
      }

      /*
        VIDEO — starts FULL FRAME (1920×1080), visible from t=0 for kinetic intro (both speakers).
        Master GSAP transitions to Mode A at comp 6.0.

        Mode A (80% scale): width:614, height:864
          Centered in right zone: x=1152+(768-614)/2=1229, y=(1080-864)/2=108
          Bottom clearance: 1080-108-864=108px > 40px ✓  Top clearance: 108px > 20px ✓
          object-position: 84% center → with object-fit:cover scaling source by height (×0.8),
          the 614px window shows a 768px source slice centered at 84%×1152+384=1352 → source x≈968-1736:
          centers Jasper (face ≈x1400), keeps his "Jasper De Maere / Wintermute" lower-third
          (left edge ≈x990) inside window-left (968), trims the dead right-wall.
          (50%→center 960 = the seam, 62%→center 1098 = half-host — both REJECTED.)
      */
      #short_mag_cut_frame {
        position: absolute;
        left: 0; top: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: transparent;
        border-radius: 0; z-index: 2;
      }
      #short_mag_cut,
      #short_mag_cut_frame > img.__render_frame__,
      #short_mag_cut_frame > img.__preview_render_frame__ {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover;
        /* 84% center: centers Jasper, name tag visible, trims dead right-wall */
        object-position: 84% center;
        display: block;
      }

      .overlay-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
      }
      /* z-index:3 — EVERY overlay beat id MUST be listed or it renders behind the video */
      #beat-c7b1-hook, #beat-c7b2-narrative-cycle, #beat-c7b3-spiral,
      #beat-c7b4-examples, #beat-c7b5-cadence, #beat-c7b6-privacy-ai { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="master-root" data-composition-id="master" data-width="1920" data-height="1080" data-start="0" data-duration="66.5">
      <div id="bg-glow" data-layout-ignore></div>
      <div id="zone-rule" data-layout-ignore></div>

      <!--
        c7b1 — KINETIC opener · view V1 full-frame (both speakers) · comp 0.0–6.0
        WE ALWAYS EXIT / BEAR MARKETS / IN AN INTERESTING WAY (L3 cyan). Video shrinks to Mode-A at 6.0.
      -->
      <div id="beat-c7b1-hook" class="overlay-layer clip"
        data-composition-id="beat-c7b1-hook"
        data-composition-src="compositions/beat-c7b1-hook.html"
        data-start="0.0" data-duration="6.0" data-track-index="3"></div>

      <!--
        c7b2 — DECISION-TREE narrative-cycle TIMELINE (HERO) · view V2 Mode-A · comp 6.0–32.0
        6 nodes spoken order: 2024/ETF → ORDINALS+INSCRIPTIONS → DeFi SUMMER → DePIN → AI AGENTS → ?/NEXT (cyan).
      -->
      <div id="beat-c7b2-narrative-cycle" class="overlay-layer clip"
        data-composition-id="beat-c7b2-narrative-cycle"
        data-composition-src="compositions/beat-c7b2-narrative-cycle.html"
        data-start="6.0" data-duration="26.0" data-track-index="3"></div>

      <!--
        c7b3 — KINETIC spiral mechanism · view V3 full-frame (both speakers) · comp 32.0–41.2
        IT'S A SPIRAL / PRICES GO UP / WE FIND THE NARRATIVE / EXCITED LATE IN THE CYCLE (L4 cyan).
        Video expands Mode-A→full at 32.0, STAYS full for c7b4 & c7b5 (NO view change between them).
      -->
      <div id="beat-c7b3-spiral" class="overlay-layer clip"
        data-composition-id="beat-c7b3-spiral"
        data-composition-src="compositions/beat-c7b3-spiral.html"
        data-start="32.0" data-duration="9.2" data-track-index="3"></div>

      <!--
        c7b4 — LIQUID-GLASS examples chip-row · view V3 full-frame (over both speakers) · comp 41.2–45.2
        PERP DEXES · MEME COINS. Non-kinetic device between the two kinetics. Video stays full (NO view change).
      -->
      <div id="beat-c7b4-examples" class="overlay-layer clip"
        data-composition-id="beat-c7b4-examples"
        data-composition-src="compositions/beat-c7b4-examples.html"
        data-start="41.2" data-duration="4.0" data-track-index="3"></div>

      <!--
        c7b5 — KINETIC cadence bridge · view V3 full-frame (both speakers) · comp 45.2–49.0
        THE CADENCE / OF INNOVATION (L2 cyan). Video still full (NO view change since c7b3).
        Switches to Mode-A only at comp 49.0 (next beat).
      -->
      <div id="beat-c7b5-cadence" class="overlay-layer clip"
        data-composition-id="beat-c7b5-cadence"
        data-composition-src="compositions/beat-c7b5-cadence.html"
        data-start="45.2" data-duration="3.8" data-track-index="3"></div>

      <!--
        c7b6 — LIQUID-GLASS payoff card: the "?" RESOLVES → PRIVACY + AI · view V4 Mode-A · comp 49.0–66.5
        Eyebrow WHAT COMES NEXT (R4); "? →" rhyme; PRIVACY / AI; sublabel "the frontrunners".
        Video shrinks full→Mode-A at 49.0; card holds over live continuing speaker video to clip end.
      -->
      <div id="beat-c7b6-privacy-ai" class="overlay-layer clip"
        data-composition-id="beat-c7b6-privacy-ai"
        data-composition-src="compositions/beat-c7b6-privacy-ai.html"
        data-start="49.0" data-duration="17.5" data-track-index="3"></div>

      <script>
        window.__timelines = window.__timelines || {};
        const masterTL = gsap.timeline({ paused: true });

        const v   = document.getElementById("short_mag_cut_frame");
        const vid = document.getElementById("short_mag_cut");
        const gr  = document.getElementById("bg-glow");
        const zr  = document.getElementById("zone-rule");

        // Mode A: 80% of right 40% zone. object-position:84% centers Jasper, name visible.
        const MODE_A = { left: 1229, top: 108, width: 614, height: 864 };

        // ──────────────────────────────────────────────────────────────────────────
        // v3 GROUPED VIEW-TIMELINE — 4 views, only 3 switches, every non-intro seg ≥17s:
        //   V1 full-frame   0.0 – 6.0   (6.0s)  c7b1 opener
        //   V2 Mode-A       6.0 – 32.0  (26.0s) c7b2 HERO timeline
        //   V3 full-frame   32.0 – 49.0 (17.0s) c7b3 spiral · c7b4 examples · c7b5 cadence (GROUPED, no bounce)
        //   V4 Mode-A       49.0 – 66.5 (17.5s) c7b6 privacy+AI card (holds to clip end)
        // A-B-A proof: full gap [0–6]→[32–49] = 26s; Mode-A gap [6–32]→[49–66.5] = 17s. No return within 12s.
        // ──────────────────────────────────────────────────────────────────────────

        // ── PHASE 0: comp 0.0–6.0 — FULL FRAME (c7b1 kinetic over both speakers). CSS default. ──

        // ── PHASE 1 @ comp 6.0 — full→Mode-A (glow/zone-rule in @6.3); Ken-Burns across timeline ──
        masterTL.to(v, {
          left: MODE_A.left, top: MODE_A.top,
          width: MODE_A.width, height: MODE_A.height,
          borderRadius: "6px",
          duration: 0.7, ease: "expo.inOut"
        }, 6.0);
        masterTL.to(gr, { opacity: 1, duration: 0.5, ease: "power2.out" }, 6.3);
        masterTL.fromTo(zr, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.6, ease: "power4.out" }, 6.3);
        // Ken Burns: slow zoom on Jasper across the timeline beat
        masterTL.fromTo(vid,
          { scale: 1.0, transformOrigin: "center center" },
          { scale: 1.04, duration: 25, ease: "none" },
          6.5
        );

        // ── PHASE 2 @ comp 32.0 — Mode-A→full (glow/zone-rule out @31.7; Ken-Burns reset). ──
        //    HOLDS full through 49.0 — NO intermediate switches (R1 fix: c7b3/c7b4/c7b5 all in one full-frame window).
        masterTL.to([gr, zr], { opacity: 0, duration: 0.3, ease: "power2.in" }, 31.7);
        masterTL.to(vid, { scale: 1.0, duration: 0.4, ease: "power2.out" }, 31.7); // Ken-Burns reset
        masterTL.to(v, {
          left: 0, top: 0, width: 1920, height: 1080,
          borderRadius: "0px", duration: 0.4, ease: "expo.inOut"
        }, 32.0);
        // Gentle full-frame Ken-Burns across the grouped V3 block (spiral+examples+cadence)
        masterTL.fromTo(vid,
          { scale: 1.0, transformOrigin: "center center" },
          { scale: 1.03, duration: 16.5, ease: "none" },
          32.5
        );

        // ── PHASE 3 @ comp 49.0 — full→Mode-A (glow/zone-rule return); gentle settle to clip end ──
        masterTL.to(vid, { scale: 1.0, duration: 0.4, ease: "power2.out" }, 48.7); // reset before shrink
        masterTL.to(v, {
          left: MODE_A.left, top: MODE_A.top,
          width: MODE_A.width, height: MODE_A.height,
          borderRadius: "6px", duration: 0.7, ease: "expo.inOut"
        }, 49.0);
        masterTL.to(gr, { opacity: 1, duration: 0.5, ease: "power2.out" }, 49.3);
        masterTL.fromTo(zr, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.6, ease: "power4.out" }, 49.3);
        // Gentle settle Ken-Burns to clip end (card holds over continuing speaker video)
        masterTL.fromTo(vid,
          { scale: 1.0, transformOrigin: "center center" },
          { scale: 1.035, duration: 17.0, ease: "none" },
          49.5
        );

        window.__timelines["master"] = masterTL;
      </script>
    </div>

    <!-- A-roll: full-frame by default; master GSAP transitions to Mode A at comp 6.0 -->
    <div id="short_mag_cut_frame">
      <video id="short_mag_cut"
        src="source.mp4" muted playsinline
        data-start="0" data-duration="66.5" data-media-start="1530.50" data-track-index="1"></video>
    </div>
    <audio id="a-roll-audio"
      src="source.mp4"
      data-start="0" data-duration="66.5" data-media-start="1530.50" data-track-index="5" data-volume="1"></audio>
  </body>
</html>
