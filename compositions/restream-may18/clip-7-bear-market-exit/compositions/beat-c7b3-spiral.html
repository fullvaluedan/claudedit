<!--
  c7b3 — KINETIC: the "spiral" mechanism (kinetic-type) · view V3 full-frame (both speakers)
  Beat starts comp 32.0; offsets = comp_t - 32.0.
  4-line phrase build — lines slam in and STAY. Explains WHY the cycle repeats.
  comp = src - 1530.50:
    L1 "a spiral where"                 spiral src1564.66 / comp 34.16 / offset 2.16  #F0F0F0
    L2 "like prices go up"              prices src1565.70 / comp 35.20 / offset 3.20  #F0F0F0
    L3 "We find the narrative"          We     src1567.02 / comp 36.52 / offset 4.52  #F0F0F0
    L4 "People get excited ... late"    People src1568.02 / comp 37.52 / offset 5.52  CYAN payoff (line-lead)
  L4 fires on the first spoken word of its line ("People") per line-lead convention;
  reads through "late ... in the cycle" (cycle @ comp 40.46). Cyan: L4 only.
  Video stays FULL-FRAME (NO view change) into c7b4. Lines hold to ~40.8 then exit.
-->
<div data-composition-id="beat-c7b3-spiral" data-width="1920" data-height="1080" data-duration="9.2">

  <div class="b3-backdrop" data-layout-ignore></div>

  <div class="b3-zone">
    <div class="b3-words">
      <div id="b3-l1" class="b3-line">IT'S A SPIRAL</div>

      <div id="b3-l3" class="b3-line">WE FIND THE NARRATIVE</div>
      <div id="b3-l4" class="b3-line b3-cyan">EXCITED LATE IN THE CYCLE</div>
    </div>
  </div>

  <style>
    [data-composition-id="beat-c7b3-spiral"] {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: transparent;
      font-family: "Inter", "Helvetica", sans-serif;
    }
    [data-composition-id="beat-c7b3-spiral"] .b3-backdrop {
      position: absolute; top: 0; left: 0; width: 1080px; height: 1080px;
      background: linear-gradient(to right,
        rgba(0,0,0,0.78) 0%,
        rgba(0,0,0,0.55) 60%,
        transparent 100%);
      pointer-events: none;
    }
    [data-composition-id="beat-c7b3-spiral"] .b3-zone {
      position: absolute; top: 0; left: 0;
      width: 1080px; height: 1080px;
      display: flex; align-items: center;
      padding-left: 80px;
    }
    [data-composition-id="beat-c7b3-spiral"] .b3-words {
      display: flex; flex-direction: column; gap: 12px;
      width: 100%;
    }
    [data-composition-id="beat-c7b3-spiral"] .b3-line {
      font-family: "Inter", sans-serif;
      font-weight: 900;
      font-size: 92px;
      color: #ffffff;
      line-height: 1.0;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      opacity: 0;
      text-shadow: 0 4px 22px rgba(0,0,0,0.95), 0 2px 8px rgba(0,0,0,0.85);
    }
    [data-composition-id="beat-c7b3-spiral"] .b3-cyan {
      color: #00d4ff;
      text-shadow:
        0 0 80px rgba(0,212,255,0.95),
        0 0 40px rgba(0,212,255,0.75),
        0 0 18px rgba(0,212,255,0.55),
        0 4px 22px rgba(0,0,0,0.85);
    }

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // L1 "IT'S A SPIRAL" — offset 2.16 (spiral @ comp 34.16)
    tl.fromTo("#b3-l1", {opacity:0, y:26}, {opacity:1, y:0, duration:0.28, ease:"expo.out"}, 2.16);
    // L2 "PRICES GO UP" — offset 3.20 (prices @ comp 35.20)
    tl.fromTo("#b3-l2", {opacity:0, y:26}, {opacity:1, y:0, duration:0.28, ease:"expo.out"}, 3.20);
    // L3 "WE FIND THE NARRATIVE" — offset 4.52 (We @ comp 36.52)
    tl.fromTo("#b3-l3", {opacity:0, y:26}, {opacity:1, y:0, duration:0.28, ease:"expo.out"}, 4.52);
    // L4 "EXCITED LATE IN THE CYCLE" — offset 5.52 (People line-lead @ comp 37.52) — CYAN payoff
    tl.fromTo("#b3-l4", {opacity:0, y:26, scale:0.92}, {opacity:1, y:0, scale:1, duration:0.32, ease:"expo.out"}, 5.52);

    // Hold full sentence, exit upward before c7b4 chip-strip (video stays full-frame)
    tl.to(".b3-line", {y:-30, opacity:0, duration:0.28, ease:"power2.in"}, 8.8);

    window.__timelines["beat-c7b3-spiral"] = tl;
  })();
  </script>
