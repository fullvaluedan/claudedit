<template id="beat-c6b2-template">
<!--
  c6b2 — Mode-A chrome (index/eyebrow/rule) + answer kinetic · MODE-A (speaker right) · comp 3.0–14.0
  transparent background: left zone = graphics, right zone = Mode A video (driven by index.html).
  NOT a swiss-grid stat block — no big-number slam, no tag-row.

  Chrome (EDITORIAL — structural label, not a sentence):
    index "06" + eyebrow "THE BULL-CASE"  slam comp 3.0 (offset 0.0)
      (eyebrow changed from v2 "FOUR-YEAR CYCLE" so the opener's "THE FOUR-YEAR CYCLE" is not echoed next beat)
    cyan rule draws comp 3.4 (offset 0.4) → settles to #2a2a2a (so LINE 2 is the single cyan)
  Answer kinetic (WORD-SYNCED, phrases STAY):
    "THOUGHT IT WAS DEAD"  fires comp 9.02 (offset 6.02) → "was" src 1429.32  (1429.32 - 1420.30)
    "NOW IT IS"            fires comp 13.16 (offset 10.16) → "is." src 1433.46 (1433.46 - 1420.30)  CYAN payoff
  data-duration 11.0 → clock 3.0→14.0; LINE 2 offset 10.16 < 11.0 → renders before clock stops.
-->
<div data-composition-id="beat-c6b2" data-width="1920" data-height="1080" data-duration="11.0">

  <!-- Corner registration marks -->
  <div class="b2-reg b2-tl" data-layout-ignore></div>
  <div class="b2-reg b2-tr" data-layout-ignore></div>
  <div class="b2-reg b2-bl" data-layout-ignore></div>
  <div class="b2-reg b2-br" data-layout-ignore></div>

  <div class="b2-zone">
    <div class="b2-inner">

      <!-- Chrome: index + eyebrow + rule -->
      <div id="b2-eye">THE BULL-CASE</div>
      <div id="b2-rule"></div>

      <!-- Answer kinetic: 2 phrase lines, left zone, STAY -->
      <div class="b2-words">
        <div id="b2-l1" class="b2-line">THOUGHT IT WAS DEAD</div>
        <div id="b2-l2" class="b2-line"><span class="b2-cyan">NOW IT IS</span></div>
      </div>

    </div>
  </div>

  <style>
    [data-composition-id="beat-c6b2"] {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: transparent; font-family: "Inter", "Helvetica", sans-serif;
    }
    /* Corner marks (left zone) */
    [data-composition-id="beat-c6b2"] .b2-reg {
      position: absolute; width: 26px; height: 26px; opacity: 0;
    }
    [data-composition-id="beat-c6b2"] .b2-tl { top:30px; left:30px; border-top:2px solid #2a2a2a; border-left:2px solid #2a2a2a; }
    [data-composition-id="beat-c6b2"] .b2-tr { top:30px; left:1094px; border-top:2px solid #2a2a2a; border-right:2px solid #2a2a2a; }
    [data-composition-id="beat-c6b2"] .b2-bl { bottom:30px; left:30px; border-bottom:2px solid #2a2a2a; border-left:2px solid #2a2a2a; }
    [data-composition-id="beat-c6b2"] .b2-br { bottom:30px; left:1094px; border-bottom:2px solid #2a2a2a; border-right:2px solid #2a2a2a; }

    [data-composition-id="beat-c6b2"] .b2-zone {
      position: absolute; top: 0; left: 0; width: 1152px; height: 1080px;
      display: flex; align-items: center;
    }
    [data-composition-id="beat-c6b2"] .b2-inner { padding: 0 80px; width: 100%; }

    [data-composition-id="beat-c6b2"] #b2-idx {
      font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 400;
      color: #f0f0f0; letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 16px; opacity: 0;
    }
    [data-composition-id="beat-c6b2"] #b2-eye {
      font-family: "Inter", sans-serif; font-size: 36px; font-weight: 700;
      color: #f0f0f0; letter-spacing: 0.18em; text-transform: uppercase;
      margin-bottom: 22px; opacity: 0;
    }
    [data-composition-id="beat-c6b2"] #b2-rule {
      width: 0; height: 3px; background: #00d4ff; margin-bottom: 56px; border-radius: 2px;
    }

    [data-composition-id="beat-c6b2"] .b2-words {
      display: flex; flex-direction: column; gap: 14px; max-width: 1010px;
    }
    [data-composition-id="beat-c6b2"] .b2-line {
      font-family: "Inter", sans-serif; font-weight: 900; font-size: 84px;
      color: #f0f0f0; line-height: 1.02; letter-spacing: -0.035em;
      text-transform: uppercase; opacity: 0; white-space: nowrap;
      text-shadow: 0 4px 22px rgba(0,0,0,0.9);
    }
    [data-composition-id="beat-c6b2"] .b2-cyan {
      color: #00d4ff;
      text-shadow:
        0 0 80px rgba(0,212,255,0.9), 0 0 40px rgba(0,212,255,0.7),
        0 0 18px rgba(0,212,255,0.5), 0 4px 22px rgba(0,0,0,0.8);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ── Chrome (EDITORIAL) — slams at beat start; fills the 3.0–9.0 stretch ──
    tl.fromTo(".b2-reg", {opacity:0}, {opacity:1, duration:0.22, ease:"power1.out"}, 0.05);
    tl.fromTo("#b2-eye", {opacity:0, y:10}, {opacity:1, y:0, duration:0.30, ease:"power3.out"}, 0.18);
    // Rule draws cyan (offset 0.4 = comp 3.4), then settles to neutral #2a2a2a so kinetic LINE 2 is the single cyan
    tl.fromTo("#b2-rule", {width:"0px"}, {width:"440px", duration:0.45, ease:"power3.inOut"}, 0.40);
    tl.to("#b2-rule", {backgroundColor:"#2a2a2a", duration:0.6, ease:"power2.inOut"}, 1.6);

    // ── Answer kinetic (WORD-SYNCED) ──
    // SPARSE-HOLD FIX: was +6.02 -> "THE BULL-CASE" eyebrow alone for ~5.8s. Land line 1 ~1s sooner
    // so the eyebrow->content gap is under the sparse threshold (the line leads "was" by ~1s, fine).
    tl.fromTo("#b2-l1", {opacity:0, y:28}, {opacity:1, y:0, duration:0.30, ease:"expo.out"}, 5.00);
    // "is." src 1433.46 → comp 13.16 → offset 10.16 (cyan payoff)
    tl.fromTo("#b2-l2", {opacity:0, y:28, scale:0.94}, {opacity:1, y:0, scale:1, duration:0.34, ease:"expo.out"}, 10.16);

    // Beat ends comp 14.0 (offset 11.0); index.html shrinks→timeline handoff for c6b3.
    // Hold to the window end (14.0) so the zone never empties before c6b3 fills it. Was 10.6
    // (comp 13.6) -> a real ~1.5s blank-left the luminance gate missed; exit-model caught it.
    tl.to(".b2-inner", {opacity:0, duration:0.30, ease:"power2.in"}, 11.5);

    window.__timelines["beat-c6b2"] = tl;
  })();
  </script>
</div>
</template>
