<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clip 6 — Four-Year Cycle Dead? (23:40–24:31)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body, html {
        width: 1920px; height: 1080px;
        background: #0a0a0a; overflow: hidden;
        font-family: "Inter", sans-serif;
      }
      #master-root { width: 1920px; height: 1080px; position: relative; background: #0a0a0a; }

      /* Dot grid */
      #master-root::before {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(circle, rgba(255,255,255,0.038) 1px, transparent 1px);
        background-size: 44px 44px; pointer-events: none; z-index: 0;
      }

      /* Left-zone glow */
      #bg-glow {
        position: absolute; top: 0; left: 0; width: 1152px; height: 1080px;
        background:
          radial-gradient(ellipse at 22% 55%, rgba(0,212,255,0.13) 0%, transparent 50%),
          radial-gradient(ellipse at 78% 18%, rgba(0,212,255,0.05) 0%, transparent 38%);
        pointer-events: none; z-index: 0; opacity: 0;
      }
      #zone-rule {
        position: absolute; left: 1151px; top: 60px; width: 1px; height: 960px;
        background: #2a2a2a; transform-origin: top center; z-index: 1; opacity: 0;
      }

      /*
        VIDEO — starts FULL FRAME (1920×1080), visible from t=0 for the kinetic host-question intro.
        GSAP transitions to Mode A at comp 3.0, holds Mode A through comp 40.4 (answer + halving timeline +
        decay chart — ONE sustained Mode-A view, no bounce), then expands back to FULL FRAME at 40.4 to clip end.

        Mode A (80% scale): width:614, height:864
          Centered in right zone: x=1152+(768-614)/2=1229, y=(1080-864)/2=108
          Bottom clearance: 1080-108-864=108px > 40px ✓   Top clearance: 108px > 20px ✓
          object-position: 83% center → centers Jasper (guest, right half); name lower-third fully in-frame.
      */
      #short_mag_cut_frame {
        position: absolute;
        left: 0; top: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: transparent;
        border-radius: 0; z-index: 2;
      }
      #short_mag_cut,
      #short_mag_cut_frame > img.__render_frame__,
      #short_mag_cut_frame > img.__preview_render_frame__ {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover;
        /* 83% center: shows source from ~x:960 = Jasper's half, name fully visible (verified value from v2) */
        object-position: 83% center;
        display: block;
      }

      .overlay-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
      }
      /* z-index:3 — EVERY overlay beat id must be here or it renders behind the z-index:2 video */
      #beat-c6b1, #beat-c6b2, #beat-c6b3, #beat-c6b4, #beat-c6b5, #beat-c6b6 { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="master-root" data-composition-id="master" data-width="1920" data-height="1080" data-start="0" data-duration="50.70">
      <div id="bg-glow" data-layout-ignore></div>
      <div id="zone-rule" data-layout-ignore></div>

      <!-- c6b1: comp 0.0–3.0 — FULL-FRAME host question (both speakers) -->
      <div id="beat-c6b1" class="overlay-layer clip"
        data-composition-id="beat-c6b1"
        data-composition-src="compositions/beat-c6b1-host-cycle-dead.html"
        data-start="0.0" data-duration="3.0" data-track-index="3"></div>

      <!-- c6b2: comp 3.0–14.0 — MODE-A chrome + answer kinetic -->
      <div id="beat-c6b2" class="overlay-layer clip"
        data-composition-id="beat-c6b2"
        data-composition-src="compositions/beat-c6b2-was-dead-it-is.html"
        data-start="3.0" data-duration="11.0" data-track-index="3"></div>

      <!-- c6b3: comp 14.0–25.9 — MODE-A halving TIMELINE (device #1); 2028 tick (comp 25.68) is the cyan -->
      <div id="beat-c6b3" class="overlay-layer clip"
        data-composition-id="beat-c6b3"
        data-composition-src="compositions/beat-c6b3-halving-timeline.html"
        data-start="14.0" data-duration="11.9" data-track-index="3"></div>

      <!-- c6b4: comp 25.4–40.4 — MODE-A nyt-graph block-reward DECAY (HERO device #2).
           On track 4 (not 3) so it can OVERLAP c6b3 (track 3, ends 25.9) over comp 25.4–25.9 for the
           required 2028-tick→decay-chart cross-dissolve. Paint order is governed by the z-index:3 rule
           on #beat-c6b4, so it still renders over the video. -->
      <div id="beat-c6b4" class="overlay-layer clip"
        data-composition-id="beat-c6b4"
        data-composition-src="compositions/beat-c6b4-halving-decay.html"
        data-start="25.4" data-duration="15.0" data-track-index="4"></div>

      <!-- c6b5: comp 40.4–46.4 — FULL-FRAME closing kinetic (both speakers) -->
      <div id="beat-c6b5" class="overlay-layer clip"
        data-composition-id="beat-c6b5"
        data-composition-src="compositions/beat-c6b5-doesnt-matter.html"
        data-start="40.4" data-duration="6.0" data-track-index="3"></div>

      <!-- c6b6: comp 46.4–50.7 — FULL-FRAME kicker + caption-neon-glow payoff → clean tail -->
      <div id="beat-c6b6" class="overlay-layer clip"
        data-composition-id="beat-c6b6"
        data-composition-src="compositions/beat-c6b6-strong-narrative.html"
        data-start="46.4" data-duration="4.3" data-track-index="3"></div>

      <script>
        window.__timelines = window.__timelines || {};
        const masterTL = gsap.timeline({ paused: true });

        const v   = document.getElementById("short_mag_cut_frame");
        const vid = document.getElementById("short_mag_cut");
        const gr  = document.getElementById("bg-glow");
        const zr  = document.getElementById("zone-rule");

        // Mode A: 80% of right 40% zone. object-position:83% shows Jasper centered + full name.
        const MODE_A = { left: 1229, top: 108, width: 614, height: 864 };

        // ── VIEW-TIMELINE (proves R1): FULL 0–3 → MODE-A 3–40.4 → FULL 40.4–50.7 ──
        // Exactly TWO transitions. FULL is left at 3.0 and not re-entered until 40.4 (gap 37.4s ≫ 12s).
        // The three middle beats (c6b2 answer + c6b3 timeline + c6b4 decay chart) all live in the ONE
        // Mode-A view → the frame does NOT bounce while the halving story tells.

        // ── t=3.0 — FULL FRAME → Mode A (cinematic shrink as c6b2 chrome slams) ──
        masterTL.to(v, {
          left: MODE_A.left, top: MODE_A.top,
          width: MODE_A.width, height: MODE_A.height,
          borderRadius: "6px",
          duration: 0.7, ease: "expo.inOut"
        }, 3.0);
        // Glow + rule appear with Mode A
        masterTL.to(gr, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.3);
        masterTL.fromTo(zr, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.6, ease: "power4.out" }, 3.4);
        // Slow Ken-Burns zoom on the speaker across the sustained Mode-A view
        masterTL.fromTo(vid,
          { scale: 1.0, transformOrigin: "center center" },
          { scale: 1.04, duration: 37, ease: "none" },
          3.5
        );

        // ── Mode A HOLDS 3.0 → 40.4 (c6b2 → c6b3 → c6b4, one sustained view; no return to full) ──

        // ── t=40.4 — Mode A → FULL FRAME (expands for c6b5 closing kinetic) ──
        // glow/rule fade at 40.2 so the frame is clean as it expands; switch lands 0.44s before c6b5 LINE 1 (40.84).
        masterTL.to([gr, zr], { opacity: 0, duration: 0.3, ease: "power2.in" }, 40.2);
        masterTL.to(v, {
          left: 0, top: 0, width: 1920, height: 1080,
          borderRadius: "0px", duration: 0.4, ease: "expo.inOut"
        }, 40.4);

        // ── FULL FRAME HOLDS 40.4 → 50.7 (c6b5 + c6b6 + clean tail) — no Mode-A return (R1) ──

        window.__timelines["master"] = masterTL;
      </script>
    </div>

    <!-- A-roll: full-frame by default; GSAP transitions to Mode A at comp 3.0. src_in 1420.30, dur 50.70. -->
    <div id="short_mag_cut_frame">
      <video id="short_mag_cut"
        src="source.mp4" muted playsinline
        data-start="0" data-media-start="1420.30" data-duration="50.70" data-track-index="1"></video>
    </div>
    <audio id="a-roll-audio"
      src="source.mp4"
      data-start="0" data-media-start="1420.30" data-duration="50.70" data-track-index="5" data-volume="1"></audio>
  </body>
</html>
