<template id="beat-c8b4-template">
<!--
  c8b4 — 2-line kinetic + 2 staggered tag-chips (DISTINCT layout) · MODE-A (left zone)
  comp 16.0–26.0 · src 1693.20–1703.20 · beat offset = comp − 16.0
    L1 IT COLLAPSES THE                  @17.46 (offset 1.46)  ("completely collapses" 1694.66)
    L2 LONGER-DURATION GRUNT WORK        @19.72 (offset 3.72)  ("longer" 1696.92); GRUNT WORK cyan ~21.1
    chip ANALYSIS                        @23.06 (offset 7.06)  ("analysis" 1700.26)
    chip DATA GATHERING                  @23.88 (offset 7.88)  ("data gathering" 1701.08)
  R3: "graft work" → GRUNT WORK (the flagged fix). cyan ONLY on GRUNT WORK.
-->
<div data-composition-id="beat-c8b4" data-width="1920" data-height="1080" data-duration="10.0">

  <div class="b4-backdrop" data-layout-ignore></div>
  <div class="b4-reg b4-tl" data-layout-ignore></div>
  <div class="b4-reg b4-bl" data-layout-ignore></div>

  <div class="b4-zone">
    <div class="b4-inner">
      <div class="b4-words">
        <div id="b4-l1" class="b4-line">IT COLLAPSES THE</div>
        <div id="b4-l2" class="b4-line">LONGER-DURATION <span class="b4-cyan">GRUNT WORK</span></div>
      </div>
      <div class="b4-chips">
        <div id="b4-c1" class="b4-chip">ANALYSIS</div>
        <div id="b4-c2" class="b4-chip">DATA GATHERING</div>
      </div>
    </div>
  </div>

  <style>
    [data-composition-id="beat-c8b4"] {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: transparent; font-family: "Inter", "Helvetica", sans-serif;
    }
    [data-composition-id="beat-c8b4"] .b4-backdrop {
      position: absolute; top: 0; left: 0; width: 1160px; height: 1080px;
      background: linear-gradient(to right,
        rgba(8,11,16,0.90) 0%, rgba(8,11,16,0.72) 60%, rgba(8,11,16,0.22) 82%, transparent 100%);
      pointer-events: none;
    }
    [data-composition-id="beat-c8b4"] .b4-reg { position: absolute; width: 26px; height: 26px; opacity: 0; }
    [data-composition-id="beat-c8b4"] .b4-tl { top: 30px; left: 30px; border-top: 2px solid #2a2a2a; border-left: 2px solid #2a2a2a; }
    [data-composition-id="beat-c8b4"] .b4-bl { bottom: 30px; left: 30px; border-bottom: 2px solid #2a2a2a; border-left: 2px solid #2a2a2a; }
    [data-composition-id="beat-c8b4"] .b4-zone {
      position: absolute; top: 0; left: 0; width: 1120px; height: 1080px;
      display: flex; align-items: center;
    }
    [data-composition-id="beat-c8b4"] .b4-inner { padding: 0 80px; width: 100%; }
    [data-composition-id="beat-c8b4"] .b4-idx {
      font-family: "JetBrains Mono", monospace; font-size: 24px; font-weight: 500;
      color: #f0f0f0; letter-spacing: 0.1em; margin-bottom: 26px; opacity: 0;
    }
    [data-composition-id="beat-c8b4"] .b4-words { display: flex; flex-direction: column; gap: 8px; }
    [data-composition-id="beat-c8b4"] .b4-line {
      font-family: "Inter", sans-serif; font-weight: 900; font-size: 92px;
      color: #f0f0f0; line-height: 1.0; letter-spacing: -0.025em; text-transform: uppercase;
      opacity: 0; text-shadow: 0 4px 22px rgba(0,0,0,0.92);
    }
    [data-composition-id="beat-c8b4"] .b4-cyan {
      color: #00d4ff;
      text-shadow: 0 0 70px rgba(0,212,255,0.85), 0 0 30px rgba(0,212,255,0.55), 0 4px 18px rgba(0,0,0,0.8);
    }
    [data-composition-id="beat-c8b4"] .b4-chips { display: flex; gap: 18px; margin-top: 46px; }
    [data-composition-id="beat-c8b4"] .b4-chip {
      font-family: "Inter", sans-serif; font-weight: 600; font-size: 34px;
      color: #f0f0f0; letter-spacing: 0.06em; text-transform: uppercase;
      background: rgba(20,26,34,0.92); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px; padding: 16px 28px; opacity: 0;
      box-shadow: 0 8px 30px rgba(0,0,0,0.55);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const S = '[data-composition-id="beat-c8b4"]';

    // R7 FRAME-AT-START: reg + first line fill the zone immediately (was +1.2/1.46). L2 stays word-synced.
    tl.fromTo(S + " .b4-reg", {opacity:0}, {opacity:1, duration:0.25, ease:"power1.out"}, 0.15);
    tl.fromTo(S + " #b4-l1", {opacity:0, y:28}, {opacity:1, y:0, duration:0.30, ease:"expo.out"}, 0.35);
    // L2 @19.72 (offset 3.72) — GRUNT WORK cyan
    tl.fromTo(S + " #b4-l2", {opacity:0, y:28}, {opacity:1, y:0, duration:0.30, ease:"power3.out"}, 3.72);

    // chips slide in as he lists the work types
    tl.fromTo(S + " #b4-c1", {opacity:0, x:-24}, {opacity:1, x:0, duration:0.32, ease:"back.out(1.5)"}, 7.06);
    tl.fromTo(S + " #b4-c2", {opacity:0, x:-24}, {opacity:1, x:0, duration:0.32, ease:"back.out(1.5)"}, 7.88);

    // Build-and-stay; exit before c8b5 enters (~comp 25.6, offset 9.6)
    tl.to(S + " .b4-inner, " + S + " .b4-reg", {opacity:0, duration:0.4, ease:"power2.in"}, 9.6);

    window.__timelines["beat-c8b4"] = tl;
  })();
  </script>
</div>
</template>
