<template id="beat-2h-template">
<!-- KINETIC WORD STACK — "PASSIVE YIELD / GENERATING / ELEMENT" -->
<!-- beat starts comp 93.5 = abs 511.22 -->
<!-- "passive" abs 510.34 = slightly before beat, use abs 511.24 = offset 0.02s → 0.1s -->
<!-- "yield" abs 510.82 = beat offset -0.4s → delay slightly: use offset 0.6s -->
<!-- "generating" abs 511.24 = beat offset 0.02s → 0.1s -->
<!-- "element" abs 512.26 = beat offset 1.04s -->
<!-- "compelling" abs 513.94 = beat offset 2.72s -->
<div data-composition-id="beat-2h" data-width="1920" data-height="1080" data-duration="8.5">

  <div class="b2h-zone">
    <div class="b2h-words">
      <div id="b2h-w1" class="b2h-chunk">PASSIVE YIELD</div>
      <div id="b2h-w2" class="b2h-chunk">GENERATING</div>
      <div id="b2h-w3" class="b2h-chunk b2h-cyan">ELEMENT</div>
    </div>
    <div id="b2h-sub" class="b2h-sub">More compelling than staking on obscure chains</div>
  </div>

  <style>
    [data-composition-id="beat-2h"] {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background:
        radial-gradient(ellipse at 15% 55%, rgba(0,212,255,0.10) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 15%, rgba(0,212,255,0.04) 0%, transparent 38%),
        #0a0a0a;
      font-family: "Inter", "Helvetica", sans-serif;
    }
    [data-composition-id="beat-2h"] .b2h-zone {
      position: absolute; top: 0; left: 0; width: 1152px; height: 1080px;
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 80px;
    }
    [data-composition-id="beat-2h"] .b2h-words { display: flex; flex-direction: column; gap: 0; }
    [data-composition-id="beat-2h"] .b2h-chunk {
      font-family: "Inter", sans-serif; font-weight: 900; font-size: 140px;
      color: #f0f0f0; line-height: 1.0; letter-spacing: -0.03em;
      text-transform: uppercase; opacity: 0; max-width: 1000px;
    }
    [data-composition-id="beat-2h"] .b2h-cyan { color: #00d4ff; }
    [data-composition-id="beat-2h"] #b2h-sub {
      font-family: "JetBrains Mono", monospace; font-size: 26px; font-weight: 400;
      color: #555; letter-spacing: 0.12em; text-transform: uppercase;
      margin-top: 40px; opacity: 0;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // beat starts comp 93.5 = abs 511.22
    // "passive yield" abs 510.34-510.82 → use beat offset 0.6s (anticipatory by ~0.4s)
    tl.fromTo("#b2h-w1", {opacity:0, y:60}, {opacity:1, y:0, duration:0.3, ease:"expo.out"}, 0.6);

    // "generating" abs 511.24, beat 511.22 → offset 0.02s, adjust to 1.1s (let w1 breathe)
    tl.to("#b2h-w1", {opacity:0.4, duration:0.2, ease:"power2.out"}, 1.08);
    tl.fromTo("#b2h-w2", {opacity:0, y:60}, {opacity:1, y:0, duration:0.3, ease:"expo.out"}, 1.10);

    // "element" abs 512.26, beat 511.22 → beat offset 1.04s → use 2.0s (after w2 settles)
    tl.to("#b2h-w2", {opacity:0.4, duration:0.2, ease:"power2.out"}, 1.98);
    tl.fromTo("#b2h-w3", {opacity:0, y:60}, {opacity:1, y:0, duration:0.35, ease:"expo.out"}, 2.0);

    // Sub when "compelling" abs 513.94 = beat offset 2.72s
    tl.fromTo("#b2h-sub", {opacity:0}, {opacity:1, duration:0.4, ease:"power2.out"}, 2.72);

    // Exit
    tl.to(".b2h-chunk, #b2h-sub", {y:-40, opacity:0, duration:0.25, ease:"power2.in"}, 8.1);

    window.__timelines["beat-2h"] = tl;
  })();
  </script>
</div>
</template>
