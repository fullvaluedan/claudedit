<template id="beat-fscreen-template">
<!--
  FULL-FRAME CONVERSATION — comp 42–57s (15s)
  transparent background: full 1920×1080 video shows behind (BOTH speakers)

  Two word-stack sequences on RIGHT side, vertically centered (over Jasper):

  SEQ 1 (beat offset 0.6): Host question word stack
    "ARE / THOSE GUYS / CRYPTO-NATIVE / ASSET MANAGERS?" — each phrase stays
    Jasper's first sentence ends ~comp 44.12

  SEQ 2 (beat offset 4.5): Host continuation word stack
    "USUAL / TRADFI TOOLS?" — condensed from "the usual tools they have access to in TradFi?"
    Host speaks this at comp ~46-49 = beat offset ~4-7

  Rest is clean window — both speakers visible, no overlay.
-->
<div data-composition-id="beat-fscreen" data-width="1920" data-height="1080" data-duration="15.0">

  <!-- Subtle bottom vignette for grounding -->
  <div class="bfs-vignette" data-layout-ignore></div>

  <!-- SEQ 1: Host question — right side, vertically centered -->
  <div id="bfs-q1" class="bfs-wstack">
    <div id="bfs-q1-w1" class="bfs-sw">ARE</div>
    <div id="bfs-q1-w2" class="bfs-sw">THOSE GUYS</div>
    <div id="bfs-q1-w3" class="bfs-sw">CRYPTO-NATIVE</div>
    <div id="bfs-q1-w4" class="bfs-sw bfs-sw-cyan">ASSET MANAGERS?</div>
  </div>

  <!-- SEQ 2: Host continuation -->
  <div id="bfs-q2" class="bfs-wstack">
    <div id="bfs-q2-w1" class="bfs-sw">USUAL</div>
    <div id="bfs-q2-w2" class="bfs-sw bfs-sw-cyan">TRADFI TOOLS?</div>
  </div>

  <style>
    [data-composition-id="beat-fscreen"] {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: transparent;
      font-family: "Inter", "Helvetica", sans-serif;
    }
    [data-composition-id="beat-fscreen"] .bfs-vignette {
      position: absolute; bottom: 0; left: 0; width: 1920px; height: 280px;
      background: linear-gradient(to top, rgba(0,0,0,0.45) 0%, transparent 100%);
      pointer-events: none;
    }
    /* Word stack — right side, vertically centered */
    [data-composition-id="beat-fscreen"] .bfs-wstack {
      position: absolute; right: 80px; top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 6px;
      opacity: 0;
    }
    [data-composition-id="beat-fscreen"] .bfs-label {
      font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 400;
      color: #888; letter-spacing: 0.18em; text-transform: uppercase;
      margin-bottom: 10px;
    }
    [data-composition-id="beat-fscreen"] .bfs-sw {
      font-family: "Inter", sans-serif; font-weight: 900; font-size: 88px;
      color: #ffffff; line-height: 1.0; letter-spacing: -0.02em;
      text-transform: uppercase; opacity: 0;
      text-shadow: 0 4px 28px rgba(0,0,0,0.95), 0 2px 8px rgba(0,0,0,0.9);
    }
    [data-composition-id="beat-fscreen"] .bfs-sw-cyan {
      color: #00d4ff;
      text-shadow:
        0 0 60px rgba(0,212,255,0.7),
        0 0 30px rgba(0,212,255,0.5),
        0 4px 28px rgba(0,0,0,0.9);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ── SEQ 1: HOST QUESTION WORD STACK ──
    // Container becomes visible, each word slams and STAYS (no HOST label)
    tl.to("#bfs-q1", {opacity:1, duration:0.01}, 0.55);

    tl.fromTo("#bfs-q1-w1", {opacity:0, y:20}, {opacity:1, y:0, duration:0.22, ease:"expo.out"}, 0.60);
    tl.fromTo("#bfs-q1-w2", {opacity:0, y:20}, {opacity:1, y:0, duration:0.22, ease:"expo.out"}, 0.80);
    tl.fromTo("#bfs-q1-w3", {opacity:0, y:20}, {opacity:1, y:0, duration:0.22, ease:"expo.out"}, 1.00);
    tl.fromTo("#bfs-q1-w4", {opacity:0, y:20}, {opacity:1, y:0, duration:0.25, ease:"expo.out"}, 1.20);
    // Words STAY — no dim. Seq1 exits at offset 4.0
    tl.to("#bfs-q1", {opacity:0, x:60, duration:0.32, ease:"power2.in"}, 4.0);

    // ── SEQ 2: HOST CONTINUATION ──
    // "USUAL TRADFI TOOLS?" — fires at beat offset 4.5
    tl.to("#bfs-q2", {opacity:1, duration:0.01}, 4.45);
    tl.fromTo("#bfs-q2-w1", {opacity:0, y:20}, {opacity:1, y:0, duration:0.22, ease:"expo.out"}, 4.50);
    tl.fromTo("#bfs-q2-w2", {opacity:0, y:20}, {opacity:1, y:0, duration:0.25, ease:"expo.out"}, 4.72);
    // Words STAY — clean exit at offset 7.5
    tl.to("#bfs-q2", {opacity:0, x:60, duration:0.32, ease:"power2.in"}, 7.5);

    // Rest is clean window (both speakers visible) through end of beat at comp 57

    window.__timelines["beat-fscreen"] = tl;
  })();
  </script>
</div>
</template>
