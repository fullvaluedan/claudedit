<template id="beat-2b-template">
<div data-composition-id="beat-2b" data-width="1920" data-height="1080" data-duration="11.5">

  <div class="b2b-reg b2b-tl" data-layout-ignore></div>
  <div class="b2b-reg b2b-tr" data-layout-ignore></div>
  <div class="b2b-reg b2b-bl" data-layout-ignore></div>
  <div class="b2b-reg b2b-br" data-layout-ignore></div>
  <div class="b2b-ghost" data-layout-ignore>3.5×</div>

  <div class="b2b-zone">
    <div class="b2b-inner">
      <div id="b2b-idx">05</div>
      <div id="b2b-eye">WINTERMUTE OTC DESK · 2025 H1</div>
      <div id="b2b-rule"></div>
      <div class="b2b-stat-row">
        <div id="b2b-stat">1.0×</div>
        <div class="b2b-stat-labels">
          <div id="b2b-label" class="b2b-label">MORE ALTCOIN OPTIONS NOTIONAL</div>
          <div id="b2b-sub" class="b2b-sub">vs. 2024 same period</div>
        </div>
      </div>
      <div id="b2b-bar-wrap" class="b2b-bar-wrap">
        <div id="b2b-bar-fill" class="b2b-bar-fill"></div>
        <div id="b2b-bar-label" class="b2b-bar-label">2025 vs 2024</div>
      </div>
      <div id="b2b-footer" class="b2b-footer">
        YIELD STRATEGIES · LOW DELTA · ELEGANT RISK EXPRESSIONS
      </div>
    </div>
  </div>

  <style>
    [data-composition-id="beat-2b"] {
      width: 1920px; height: 1080px; position: relative;
      overflow: hidden; background: transparent;
      font-family: "Inter", "Helvetica", sans-serif;
    }
    [data-composition-id="beat-2b"] .b2b-ghost {
      position: absolute; bottom: -80px; right: -20px;
      font-family: "Inter", sans-serif; font-weight: 900; font-size: 420px;
      color: rgba(0,212,255,0.05); letter-spacing: -0.06em; line-height: 1;
      user-select: none; pointer-events: none; white-space: nowrap;
    }
    [data-composition-id="beat-2b"] .b2b-reg { position: absolute; width: 26px; height: 26px; opacity: 0; }
    [data-composition-id="beat-2b"] .b2b-tl { top: 30px; left: 30px; border-top: 2px solid #2a2a2a; border-left: 2px solid #2a2a2a; }
    [data-composition-id="beat-2b"] .b2b-tr { top: 30px; left: 1094px; border-top: 2px solid #2a2a2a; border-right: 2px solid #2a2a2a; }
    [data-composition-id="beat-2b"] .b2b-bl { bottom: 30px; left: 30px; border-bottom: 2px solid #2a2a2a; border-left: 2px solid #2a2a2a; }
    [data-composition-id="beat-2b"] .b2b-br { bottom: 30px; left: 1094px; border-bottom: 2px solid #2a2a2a; border-right: 2px solid #2a2a2a; }
    [data-composition-id="beat-2b"] .b2b-zone {
      position: absolute; top: 0; left: 0; width: 1152px; height: 1080px;
      display: flex; align-items: center;
    }
    [data-composition-id="beat-2b"] .b2b-inner { padding: 0 80px; width: 100%; }
    [data-composition-id="beat-2b"] #b2b-idx {
      font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 400;
      color: #888; letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 16px; opacity: 0;
    }
    [data-composition-id="beat-2b"] #b2b-eye {
      font-family: "JetBrains Mono", monospace; font-size: 24px; font-weight: 700;
      color: #f0f0f0; letter-spacing: 0.22em; text-transform: uppercase;
      margin-bottom: 24px; opacity: 0;
    }
    [data-composition-id="beat-2b"] #b2b-rule { width: 0; height: 2px; background: #00d4ff; margin-bottom: 52px; }
    [data-composition-id="beat-2b"] .b2b-stat-row {
      display: flex; align-items: flex-end; gap: 48px; margin-bottom: 32px;
    }
    [data-composition-id="beat-2b"] #b2b-stat {
      font-family: "Inter", sans-serif; font-weight: 900; font-size: 200px;
      color: #00d4ff; line-height: 0.88; letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums; opacity: 0;
      text-shadow: 0 0 60px rgba(0,212,255,0.35);
    }
    [data-composition-id="beat-2b"] .b2b-stat-labels { padding-bottom: 20px; opacity: 0; }
    [data-composition-id="beat-2b"] .b2b-label {
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 40px;
      color: #f0f0f0; text-transform: uppercase; letter-spacing: 0.01em;
      margin-bottom: 12px; line-height: 1.2;
    }
    [data-composition-id="beat-2b"] .b2b-sub {
      font-family: "JetBrains Mono", monospace; font-size: 24px; font-weight: 400;
      color: #555; letter-spacing: 0.08em; text-transform: uppercase;
    }
    [data-composition-id="beat-2b"] .b2b-bar-wrap {
      width: 0; height: 6px; background: #1a1a1a;
      border-radius: 3px; margin-bottom: 28px; position: relative; overflow: visible;
    }
    [data-composition-id="beat-2b"] .b2b-bar-fill {
      position: absolute; top: 0; left: 0; height: 100%;
      background: linear-gradient(90deg, #00d4ff 0%, rgba(0,212,255,0.4) 100%);
      border-radius: 3px; width: 0;
    }
    [data-composition-id="beat-2b"] .b2b-bar-label {
      position: absolute; top: -28px; right: 0;
      font-family: "JetBrains Mono", monospace; font-size: 18px; font-weight: 400;
      color: #555; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0;
    }
    [data-composition-id="beat-2b"] #b2b-footer {
      font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 400;
      color: #444; letter-spacing: 0.12em; text-transform: uppercase;
      border-left: 4px solid #00d4ff; padding-left: 20px; opacity: 0;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const statEl = document.getElementById("b2b-stat");
    const counterObj = { val: 1.0 };

    // Chrome appears first
    tl.fromTo(".b2b-reg", {opacity:0}, {opacity:1, duration:0.25, ease:"power1.out"}, 0.15);
    tl.fromTo("#b2b-idx", {opacity:0, x:-16}, {opacity:1, x:0, duration:0.28, ease:"expo.out"}, 0.18);
    tl.fromTo("#b2b-eye", {opacity:0, y:12}, {opacity:1, y:0, duration:0.32, ease:"power3.out"}, 0.28);
    tl.fromTo("#b2b-rule", {width:"0px"}, {width:"380px", duration:0.55, ease:"power3.inOut"}, 0.42);
    tl.to(".b2b-ghost", {y:-30, duration:10, ease:"sine.inOut"}, 0.2);

    // beat now starts comp 3.5 = abs 421.22; Jasper says "three" at abs 421.22 = beat offset 0.0
    // Stat slams in at 0.4s (chrome appears at 0.15-0.42, stat just after)
    tl.fromTo("#b2b-stat", {opacity:0, scale:0.88}, {opacity:1, scale:1, duration:0.45, ease:"expo.out"}, 0.4);
    tl.fromTo(".b2b-stat-labels", {opacity:0, x:30}, {opacity:1, x:0, duration:0.4, ease:"power3.out"}, 0.55);

    // Count-up: fires at beat offset 0.65s as Jasper says "and a half times" (abs 421.58)
    // "three" (0.0s), "half" (0.36s), "times" (0.88s) — count-up starts when he's mid-phrase
    tl.to(counterObj, {
      val: 3.5, duration: 1.4, ease: "power2.out",
      onUpdate: function() {
        statEl.textContent = counterObj.val.toFixed(1) + "×";
      }
    }, 0.65);

    // Progress bar extends with count-up
    tl.fromTo(".b2b-bar-wrap", {width:"0px"}, {width:"760px", duration:0.5, ease:"power3.inOut"}, 0.4);
    tl.fromTo(".b2b-bar-fill", {width:"0%"}, {width:"71%", duration:1.4, ease:"power2.out"}, 0.65);
    tl.to(".b2b-bar-label", {opacity:1, duration:0.3, ease:"power1.out"}, 0.9);

    // Footer: "yield strategies" abs 431.48, beat starts 421.22 → beat offset 10.26s
    tl.fromTo("#b2b-footer", {opacity:0, x:20}, {opacity:1, x:0, duration:0.4, ease:"power2.out"}, 10.26);

    window.__timelines["beat-2b"] = tl;
  })();
  </script>
</div>
</template>
