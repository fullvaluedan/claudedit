  <style>

  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // "But the reality is" abs 475.30, beat 474.72 → offset 0.58s
    tl.fromTo("#b2e-w1", {opacity:0, y:60}, {opacity:1, y:0, duration:0.3, ease:"expo.out"}, 0.58);
