<template id="beat-open-template">
<!--
  OPENING BEAT — Swiss-grid stat build with speaker visible in Mode A
  transparent background: left zone = graphics, right zone = Mode A video (from index.html)

  QA: 3 DIFFERENT ELEMENT TYPES before t=6s
    TYPE 1 (chrome)  t=0.08: index "05" + eyebrow + cyan rule + corner marks
    TYPE 2 (stat)    t=0.80: "3.5×" count-up + label + sublabel + progress bar
    TYPE 3 (tag row) t=3.20: tag "YIELD STRATEGIES · LOW DELTA · ELEGANT RISK"
  Speaker: Mode A from t=0 (handled by index.html) — NEVER full-frame black

  Word sync:
    comp 3.50 = Jasper says "three" → count-up COMPLETES at this exact moment
    comp 13.76 = Jasper says "yield strategies" → tag row gets accent pulse
-->
<div data-composition-id="beat-open" data-width="1920" data-height="1080" data-duration="22.0">

  <!-- Corner registration marks -->
  <div class="bo-reg bo-tl" data-layout-ignore></div>
  <div class="bo-reg bo-tr" data-layout-ignore></div>
  <div class="bo-reg bo-bl" data-layout-ignore></div>
  <div class="bo-reg bo-br" data-layout-ignore></div>

  <!-- Ghost watermark — atmospheric depth -->
  <div class="bo-ghost" data-layout-ignore>3.5×</div>

  <!-- Main content — left zone only (0–1152px) -->
  <div class="bo-zone">
    <div class="bo-inner">

      <!-- TYPE 1: Chrome elements (index + eyebrow + rule) -->
      <div id="bo-idx">05</div>
      <div id="bo-eye">WINTERMUTE OTC DESK · 2026 H1</div>
      <div id="bo-rule"></div>

      <!-- TYPE 2: Stat block (count-up + label + sublabel + bar) -->
      <div class="bo-stat-row">
        <div id="bo-stat">1.0×</div>
        <div id="bo-labels" class="bo-labels">
          <div class="bo-label">MORE ALTCOIN OPTIONS NOTIONAL</div>
          <div id="bo-sub" class="bo-sub">vs. 2025 same period</div>
        </div>
      </div>
      <div class="bo-bar-wrap" id="bo-bar-wrap">
        <div id="bo-bar-fill" class="bo-bar-fill"></div>
        <div id="bo-bar-tick" class="bo-bar-tick"></div>
      </div>

      <!-- TYPE 3: Tag row — fires at t=3.2 (editorial context) -->
      <div id="bo-tags" class="bo-tags">
        <span class="bo-tag">YIELD STRATEGIES</span>
        <span class="bo-sep">·</span>
        <span class="bo-tag">LOW DELTA</span>
        <span class="bo-sep">·</span>
        <span id="bo-tag-accent" class="bo-tag">ELEGANT RISK</span>
      </div>

      <!-- Footer: appears when speaker says "altcoins on the option side" t=6.52 -->
      <div id="bo-footer" class="bo-footer">
        Altcoin options notional — H1 2026 vs H1 2025
      </div>

    </div>
  </div>

  <style>
    [data-composition-id="beat-open"] {
      width: 1920px; height: 1080px; position: relative;
      /* TRANSPARENT — Mode A video shows through on the right */
      overflow: hidden; background: transparent;
      font-family: "Inter", "Helvetica", sans-serif;
    }
    /* Ghost watermark */
    [data-composition-id="beat-open"] .bo-ghost {
      position: absolute; bottom: -80px; right: 40px;
      font-family: "Inter", sans-serif; font-weight: 900; font-size: 420px;
      color: rgba(0,212,255,0.05); letter-spacing: -0.06em; line-height: 1;
      user-select: none; pointer-events: none; white-space: nowrap;
    }
    /* Corner marks */
    [data-composition-id="beat-open"] .bo-reg {
      position: absolute; width: 26px; height: 26px; opacity: 0;
    }
    [data-composition-id="beat-open"] .bo-tl { top:30px; left:30px; border-top:2px solid #2a2a2a; border-left:2px solid #2a2a2a; }
    [data-composition-id="beat-open"] .bo-tr { top:30px; left:1094px; border-top:2px solid #2a2a2a; border-right:2px solid #2a2a2a; }
    [data-composition-id="beat-open"] .bo-bl { bottom:30px; left:30px; border-bottom:2px solid #2a2a2a; border-left:2px solid #2a2a2a; }
    [data-composition-id="beat-open"] .bo-br { bottom:30px; left:1094px; border-bottom:2px solid #2a2a2a; border-right:2px solid #2a2a2a; }
    /* Zone — constrains content to left 60% */
    [data-composition-id="beat-open"] .bo-zone {
      position: absolute; top: 0; left: 0; width: 1152px; height: 1080px;
      display: flex; align-items: center;
    }
    [data-composition-id="beat-open"] .bo-inner {
      padding: 0 80px; width: 100%;
    }
    /* INDEX (TYPE 1) */
    [data-composition-id="beat-open"] #bo-idx {
      font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 400;
      color: #888; letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 16px; opacity: 0;
    }
    /* EYEBROW (TYPE 1) — Inter 700, #F0F0F0 per DESIGN.md hard rule */
    [data-composition-id="beat-open"] #bo-eye {
      font-family: "JetBrains Mono", monospace; font-size: 32px; font-weight: 700;
      color: #f0f0f0; letter-spacing: 0.18em; text-transform: uppercase;
      margin-bottom: 20px; opacity: 0;
    }
    /* RULE (TYPE 1) */
    [data-composition-id="beat-open"] #bo-rule {
      width: 0; height: 2px; background: #00d4ff; margin-bottom: 48px;
    }
    /* STAT ROW (TYPE 2) */
    [data-composition-id="beat-open"] .bo-stat-row {
      display: flex; align-items: flex-end; gap: 40px; margin-bottom: 28px;
    }
    [data-composition-id="beat-open"] #bo-stat {
      font-family: "Inter", sans-serif; font-weight: 900; font-size: 200px;
      color: #00d4ff; line-height: 0.88; letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums; opacity: 0;
      text-shadow: 0 0 80px rgba(0,212,255,0.4);
    }
    [data-composition-id="beat-open"] .bo-labels {
      padding-bottom: 24px; opacity: 0;
    }
    [data-composition-id="beat-open"] .bo-label {
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 40px;
      color: #f0f0f0; text-transform: uppercase; letter-spacing: 0.01em;
      margin-bottom: 10px; line-height: 1.2;
    }
    [data-composition-id="beat-open"] .bo-sub {
      font-family: "JetBrains Mono", monospace; font-size: 32px; font-weight: 400;
      color: #555; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0;
    }
    /* PROGRESS BAR (TYPE 2) */
    [data-composition-id="beat-open"] .bo-bar-wrap {
      width: 0; height: 5px; background: #1a1a1a;
      border-radius: 3px; margin-bottom: 36px; position: relative; overflow: visible;
    }
    [data-composition-id="beat-open"] .bo-bar-fill {
      position: absolute; top: 0; left: 0; height: 100%;
      background: linear-gradient(90deg, #00d4ff 0%, rgba(0,212,255,0.35) 100%);
      border-radius: 3px; width: 0;
    }
    /* TAG ROW (TYPE 3) — 32px minimum per DESIGN.md hard rule */
    [data-composition-id="beat-open"] .bo-tags {
      display: flex; align-items: center; gap: 20px;
      margin-bottom: 24px; opacity: 0;
    }
    [data-composition-id="beat-open"] .bo-tag {
      font-family: "JetBrains Mono", monospace; font-size: 32px; font-weight: 400;
      color: #555; letter-spacing: 0.08em; text-transform: uppercase;
    }
    [data-composition-id="beat-open"] #bo-tag-accent {
      color: #888;
    }
    [data-composition-id="beat-open"] .bo-sep {
      font-size: 22px; color: #333;
    }
    /* FOOTER */
    [data-composition-id="beat-open"] #bo-footer {
      font-family: "JetBrains Mono", monospace; font-size: 32px; font-weight: 400;
      color: #444; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0;
      border-left: 4px solid #00d4ff; padding-left: 16px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const statEl = document.getElementById("bo-stat");
    const counterObj = { val: 1.0 };

    // beat now starts at comp 3.0s (after beat-intro full-frame kinetic)
    // Stat slams at beat offset 0.5 = comp 3.5 = EXACTLY when Jasper says "three and a half times"
    // Perfect sync: count-up STARTS as he confirms the number

    // ─── TYPE 1: Chrome — appears quickly at beat start ───
    tl.fromTo(".bo-reg",   {opacity:0}, {opacity:1, duration:0.22, ease:"power1.out"}, 0.05);
    tl.fromTo("#bo-idx",   {opacity:0, x:-14}, {opacity:1, x:0, duration:0.25, ease:"expo.out"}, 0.08);
    tl.fromTo("#bo-eye",   {opacity:0, y:10}, {opacity:1, y:0, duration:0.30, ease:"power3.out"}, 0.16);
    tl.fromTo("#bo-rule",  {width:"0px"}, {width:"380px", duration:0.45, ease:"power3.inOut"}, 0.28);
    tl.to(".bo-ghost", {y:-30, duration:18, ease:"sine.inOut"}, 0.1);

    // ─── TYPE 2: Stat block — slams at beat offset 0.5 = comp 3.5 = "three" spoken ───
    tl.fromTo("#bo-stat",  {opacity:0, scale:0.88}, {opacity:1, scale:1, duration:0.45, ease:"expo.out"}, 0.5);
    tl.fromTo(".bo-labels",{opacity:0, x:28}, {opacity:1, x:0, duration:0.38, ease:"power3.out"}, 0.7);

    // Count-up: starts with "three" at offset 0.5, Jasper says "and a half times" as it animates
    // "times" at comp 4.38 = beat offset 1.38 → count-up covers ~1.0s duration
    tl.to(counterObj, {
      val: 3.5, duration: 1.0, ease: "power2.out",
      onUpdate: function() {
        statEl.textContent = counterObj.val.toFixed(1) + "×";
      }
    }, 0.5);

    // Progress bar
    tl.fromTo(".bo-bar-wrap", {width:"0px"}, {width:"680px", duration:0.4, ease:"power3.inOut"}, 0.5);
    tl.fromTo(".bo-bar-fill", {width:"0%"}, {width:"71%", duration:1.8, ease:"power2.out"}, 0.5);

    // Sublabel: "vs. 2024" at beat offset 1.5 (comp 4.5, Jasper has confirmed the number)
    tl.fromTo("#bo-sub", {opacity:0}, {opacity:1, duration:0.35, ease:"power2.out"}, 1.5);

    // ─── TYPE 3: Tag row — at beat offset 2.5 = comp 5.5 (before t=6.0 ✓) ───
    tl.fromTo("#bo-tags", {opacity:0, y:12}, {opacity:1, y:0, duration:0.42, ease:"power2.out"}, 2.5);

    // Footer: Jasper says "altcoins" at comp 6.52 = beat offset 3.52
    tl.fromTo("#bo-footer", {opacity:0, x:14}, {opacity:1, x:0, duration:0.38, ease:"power2.out"}, 3.52);

    // "yield strategies" at comp 13.76 = beat offset 10.76 → accent pulse on tag
    tl.to("#bo-tag-accent", {color:"#00d4ff", duration:0.22, ease:"power2.out"}, 10.76);
    tl.to("#bo-tag-accent", {color:"#888", duration:0.5, ease:"power2.in"}, 12.0);

    window.__timelines["beat-open"] = tl;
  })();
  </script>
</div>
</template>
