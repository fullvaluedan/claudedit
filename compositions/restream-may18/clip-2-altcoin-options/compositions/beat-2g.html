<template id="beat-2g-template">
<!--
  FULL-FRAME KINETIC — CAPITAL EFFICIENT / PASSIVE YIELD
  transparent background — full-frame video (Jasper speaking) shows behind

  beat starts comp 88.0 = abs 505.72
  "capital" abs 505.78 = beat offset 0.06  → fire at 0.3 (very near sync)
  "efficient" abs 506.10 = beat offset 0.38 → fire at 0.6
  "passive" abs 510.34 = beat offset 4.62  → exact sync
  "yield" abs 510.82 = beat offset 5.10

  Duration 9s (comp 88–97). Fade at beat offset 8.0.
  Clean window 97–106 follows: Jasper discusses staking risks.
-->
<div data-composition-id="beat-2g" data-width="1920" data-height="1080" data-duration="9.0">

  <div class="b2g-backdrop" data-layout-ignore></div>

  <!-- Eyebrow context in left zone -->
  <div class="b2g-eyezone" data-layout-ignore>
    <div id="b2g-idx" class="b2g-idx">08</div>
    <div id="b2g-eye" class="b2g-eye">ALTCOIN OPTIONS — THE CASE FOR</div>
    <div id="b2g-rule" class="b2g-rule"></div>
  </div>

  <!-- Full-canvas kinetic words -->
  <div class="b2g-zone">
    <div class="b2g-words">
      <div id="b2g-w1" class="b2g-word">CAPITAL</div>
      <div id="b2g-w2" class="b2g-word">EFFICIENT</div>
      <div id="b2g-w3" class="b2g-word b2g-cyan">PASSIVE YIELD</div>
    </div>
  </div>

  <style>
    [data-composition-id="beat-2g"] {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: transparent; font-family: "Inter", sans-serif;
    }
    [data-composition-id="beat-2g"] .b2g-backdrop {
      position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
      background: linear-gradient(to right,
        rgba(5,8,12,0.88) 0%, rgba(5,8,12,0.82) 40%,
        rgba(5,8,12,0.65) 62%, rgba(5,8,12,0.25) 78%, transparent 100%);
      pointer-events: none;
    }
    [data-composition-id="beat-2g"] .b2g-eyezone {
      position: absolute; top: 60px; left: 72px;
    }
    [data-composition-id="beat-2g"] .b2g-idx {
      font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 400;
      color: #888; letter-spacing: 0.1em; opacity: 0; margin-bottom: 12px;
    }
    [data-composition-id="beat-2g"] .b2g-eye {
      font-family: "JetBrains Mono", monospace; font-size: 32px; font-weight: 700;
      color: #f0f0f0; letter-spacing: 0.2em; text-transform: uppercase;
      opacity: 0; margin-bottom: 16px;
    }
    [data-composition-id="beat-2g"] .b2g-rule {
      width: 0; height: 2px; background: #00d4ff;
    }
    [data-composition-id="beat-2g"] .b2g-zone {
      position: absolute; top: 0; left: 0; width: 1200px; height: 1080px;
      display: flex; align-items: center; padding: 0 80px;
    }
    [data-composition-id="beat-2g"] .b2g-words {
      display: flex; flex-direction: column; gap: 0;
    }
    [data-composition-id="beat-2g"] .b2g-word {
      font-family: "Inter", sans-serif; font-weight: 900; font-size: 160px;
      color: #f0f0f0; line-height: 0.92; letter-spacing: -0.04em;
      text-transform: uppercase; opacity: 0;
      text-shadow: 0 4px 28px rgba(0,0,0,0.9), 0 2px 8px rgba(0,0,0,0.8);
    }
    [data-composition-id="beat-2g"] .b2g-cyan {
      color: #00d4ff;
      text-shadow:
        0 0 100px rgba(0,212,255,0.8), 0 0 50px rgba(0,212,255,0.6),
        0 0 25px rgba(0,212,255,0.4), 0 4px 28px rgba(0,0,0,0.9);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Eyebrow chrome appears first
    tl.fromTo("#b2g-idx", {opacity:0, x:-14}, {opacity:1, x:0, duration:0.28, ease:"expo.out"}, 0.15);
    tl.fromTo("#b2g-eye", {opacity:0, y:10}, {opacity:1, y:0, duration:0.32, ease:"power3.out"}, 0.25);
    tl.fromTo("#b2g-rule", {width:"0px"}, {width:"440px", duration:0.5, ease:"power3.inOut"}, 0.38);

    // "CAPITAL" — near-sync with spoken word (abs 505.78 = beat offset 0.06 → fire at 0.3)
    tl.fromTo("#b2g-w1",
      {opacity:0, y:60, scale:0.88},
      {opacity:1, y:0, scale:1, duration:0.4, ease:"expo.out"},
      0.3
    );
    // "EFFICIENT" — spoken at beat offset 0.38 → fire at 0.6, dim CAPITAL
    tl.to("#b2g-w1", {opacity:0.4, duration:0.2, ease:"power2.out"}, 0.58);
    tl.fromTo("#b2g-w2",
      {opacity:0, y:60, scale:0.88},
      {opacity:1, y:0, scale:1, duration:0.4, ease:"expo.out"},
      0.6
    );
    // "PASSIVE YIELD" (cyan) — spoken at beat offset 4.62 → exact sync
    tl.to(["#b2g-w1","#b2g-w2"], {opacity:0.35, duration:0.22, ease:"power2.out"}, 4.60);
    tl.fromTo("#b2g-w3",
      {opacity:0, y:60, scale:0.88},
      {opacity:1, y:0, scale:1, duration:0.45, ease:"expo.out"},
      4.62
    );

    // Fade everything at offset 8.0 — backdrop included so no hard cut when beat ends
    tl.to([".b2g-words", ".b2g-eyezone", ".b2g-backdrop"], {opacity:0, duration:1.0, ease:"power2.out"}, 8.0);

    window.__timelines["beat-2g"] = tl;
  })();
  </script>
</div>
</template>
