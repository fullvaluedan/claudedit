<template id="beat-2f-template">
<!-- DECISION TREE — Option selection criteria: vol surface → catalysts → strikes/tenors -->
<!-- beat starts comp 66.0 = abs 483.72 -->
<!-- "full profile" abs 485.28 → beat offset 1.56s -->
<!-- "surface" abs 486.34 → beat offset 2.62s -->
<!-- "catalysts" abs 488.08 → beat offset 4.36s -->
<!-- "strikes" abs 494.94 → beat offset 11.22s -->
<!-- "tenors" abs 496.02 → beat offset 12.30s -->
<!-- "structures" abs 497.46 → beat offset 13.74s -->
<div data-composition-id="beat-2f" data-width="1920" data-height="1080" data-duration="14.0">

  <div class="b2f-reg b2f-tl" data-layout-ignore></div>
  <div class="b2f-reg b2f-tr" data-layout-ignore></div>
  <div class="b2f-reg b2f-bl" data-layout-ignore></div>
  <div class="b2f-reg b2f-br" data-layout-ignore></div>

  <div class="b2f-zone">
    <div class="b2f-inner">
      <div id="b2f-idx">07</div>
      <div id="b2f-eye">HOW INSTITUTIONS PICK OPTIONS</div>
      <div id="b2f-rule"></div>

      <!-- Vertical flow: 3 input nodes → arrow → 2 output nodes -->
      <div class="b2f-flow">
        <!-- Inputs -->
        <div class="b2f-inputs">
          <div id="b2f-n1" class="b2f-node b2f-input">
            <div class="b2f-node-title">VOL SURFACE</div>
            <div class="b2f-node-desc">IV curve, skew, term structure</div>
          </div>
          <div id="b2f-n2" class="b2f-node b2f-input">
            <div class="b2f-node-title">CATALYSTS</div>
            <div class="b2f-node-desc">Unlocks, protocol events, macro</div>
          </div>
        </div>

        <!-- Arrow -->
        <div class="b2f-arrow-col">
          <div id="b2f-arr" class="b2f-arrow">→</div>
        </div>

        <!-- Outputs -->
        <div class="b2f-outputs">
          <div id="b2f-n3" class="b2f-node b2f-output">
            <div class="b2f-node-title">STRIKES</div>
            <div class="b2f-node-desc">OTM or ATM depending on thesis</div>
          </div>
          <div id="b2f-n4" class="b2f-node b2f-output">
            <div class="b2f-node-title">TENORS</div>
            <div class="b2f-node-desc">Expiry aligned to catalyst timeline</div>
          </div>
          <div id="b2f-n5" class="b2f-node b2f-output b2f-accent">
            <div class="b2f-node-title">STRUCTURES</div>
            <div class="b2f-node-desc">Calls, puts, spreads, covered</div>
          </div>
        </div>
      </div>

      <div id="b2f-footer" class="b2f-footer">The underlying doesn't matter — the surface does</div>
    </div>
  </div>

  <style>
    [data-composition-id="beat-2f"] {
      width: 1920px; height: 1080px; position: relative;
      overflow: hidden; background: transparent;
      font-family: "Inter", "Helvetica", sans-serif;
    }
    [data-composition-id="beat-2f"] .b2f-reg { position: absolute; width: 26px; height: 26px; opacity: 0; }
    [data-composition-id="beat-2f"] .b2f-tl { top: 30px; left: 30px; border-top: 2px solid #2a2a2a; border-left: 2px solid #2a2a2a; }
    [data-composition-id="beat-2f"] .b2f-tr { top: 30px; left: 1094px; border-top: 2px solid #2a2a2a; border-right: 2px solid #2a2a2a; }
    [data-composition-id="beat-2f"] .b2f-bl { bottom: 30px; left: 30px; border-bottom: 2px solid #2a2a2a; border-left: 2px solid #2a2a2a; }
    [data-composition-id="beat-2f"] .b2f-br { bottom: 30px; left: 1094px; border-bottom: 2px solid #2a2a2a; border-right: 2px solid #2a2a2a; }
    [data-composition-id="beat-2f"] .b2f-zone {
      position: absolute; top: 0; left: 0; width: 1152px; height: 1080px;
      display: flex; align-items: center;
    }
    [data-composition-id="beat-2f"] .b2f-inner { padding: 0 60px; width: 100%; }
    [data-composition-id="beat-2f"] #b2f-idx {
      font-family: "JetBrains Mono", monospace; font-size: 20px; font-weight: 400;
      color: #888; letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 14px; opacity: 0;
    }
    [data-composition-id="beat-2f"] #b2f-eye {
      font-family: "JetBrains Mono", monospace; font-size: 32px; font-weight: 700;
      color: #f0f0f0; letter-spacing: 0.18em; text-transform: uppercase;
      margin-bottom: 22px; opacity: 0;
    }
    [data-composition-id="beat-2f"] #b2f-rule { width: 0; height: 2px; background: #00d4ff; margin-bottom: 28px; }
    [data-composition-id="beat-2f"] .b2f-flow {
      display: flex; align-items: center; gap: 0;
    }
    [data-composition-id="beat-2f"] .b2f-inputs,
    [data-composition-id="beat-2f"] .b2f-outputs {
      display: flex; flex-direction: column; gap: 16px;
    }
    [data-composition-id="beat-2f"] .b2f-arrow-col {
      padding: 0 20px; display: flex; align-items: center;
    }
    [data-composition-id="beat-2f"] .b2f-arrow {
      font-size: 48px; color: #2a2a2a; opacity: 0; flex-shrink: 0;
    }
    [data-composition-id="beat-2f"] .b2f-node {
      background: rgba(20,26,34,0.92);
      border: 1px solid #2a2a2a;
      border-radius: 4px; padding: 18px 20px; opacity: 0;
      display: flex; flex-direction: column; justify-content: center;
      min-height: 96px;
    }
    [data-composition-id="beat-2f"] .b2f-accent {
      border-color: #00d4ff;
      box-shadow: 0 0 24px rgba(0,212,255,0.12);
    }
    [data-composition-id="beat-2f"] .b2f-node-title {
      font-family: "Inter", sans-serif; font-weight: 800; font-size: 32px;
      color: #f0f0f0; text-transform: uppercase; letter-spacing: 0.01em;
      line-height: 1.1; margin-bottom: 8px;
    }
    [data-composition-id="beat-2f"] .b2f-node-desc {
      font-size: 32px; font-weight: 500; color: #777; line-height: 1.35;
    }
    [data-composition-id="beat-2f"] #b2f-footer {
      font-family: "JetBrains Mono", monospace; font-size: 32px; font-weight: 400;
      color: #444; letter-spacing: 0.08em; text-transform: uppercase;
      margin-top: 24px; opacity: 0;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(".b2f-reg", {opacity:0}, {opacity:1, duration:0.22, ease:"power1.out"}, 0.12);
    tl.fromTo("#b2f-idx", {opacity:0, x:-14}, {opacity:1, x:0, duration:0.26, ease:"expo.out"}, 0.15);
    tl.fromTo("#b2f-eye", {opacity:0, y:10}, {opacity:1, y:0, duration:0.3, ease:"power3.out"}, 0.24);
    tl.fromTo("#b2f-rule", {width:"0px"}, {width:"360px", duration:0.45, ease:"power3.inOut"}, 0.36);

    // beat starts comp 66.0 = abs 483.72
    // Slower animation per user: duration 0.55s (was 0.38s), more stagger between nodes

    // "full profile" abs 485.28 → beat offset 1.56s → VOL SURFACE node
    // Smoother: power3.out (no elastic bounce), longer duration
    tl.fromTo("#b2f-n1", {opacity:0, y:24}, {opacity:1, y:0, duration:0.65, ease:"power3.out"}, 1.56);

    // "catalysts" abs 488.08 → beat offset 4.36s
    tl.fromTo("#b2f-n2", {opacity:0, y:24}, {opacity:1, y:0, duration:0.65, ease:"power3.out"}, 4.36);

    // Arrow appears after inputs settle — extra gap for cleaner reveal
    tl.fromTo("#b2f-arr", {opacity:0, x:-24}, {opacity:1, x:0, duration:0.45, ease:"expo.out"}, 6.0);

    // "strikes" abs 494.94 → beat offset 11.22s
    tl.fromTo("#b2f-n3", {opacity:0, y:24}, {opacity:1, y:0, duration:0.65, ease:"power3.out"}, 11.22);

    // "tenors" abs 496.02 → beat offset 12.30s
    tl.fromTo("#b2f-n4", {opacity:0, y:24}, {opacity:1, y:0, duration:0.65, ease:"power3.out"}, 12.30);

    // "structures" abs 497.46 → beat offset 13.74s (accent node — payoff, slower)
    tl.fromTo("#b2f-n5", {opacity:0, scale:0.86}, {opacity:1, scale:1, duration:0.65, ease:"expo.out"}, 13.74);

    // Footer with last node
    tl.fromTo("#b2f-footer", {opacity:0}, {opacity:1, duration:0.5, ease:"power2.out"}, 13.74);

    // Exit before beat-2g fires at comp 88 (beat-2f now ends at comp 88, data-duration=22)
    tl.to(".b2f-inner, .b2f-reg", {opacity:0, duration:0.5, ease:"power2.out"}, 21.5);

    window.__timelines["beat-2f"] = tl;
  })();
  </script>
</div>
</template>
