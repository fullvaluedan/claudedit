<template id="beat-intro-template">
<!--
  FULL-FRAME KINETIC INTRO — 3-phrase sentence build
  Each phrase slams in as a unit and STAYS — sentence builds 3 lines at a time:
    IN THIS HALF
    OF THE YEAR
    WE TRADED      (TRADED in cyan)

  "in" comp 0.88 = beat offset 0.88 | "of" comp 1.50 = offset 1.50 | "we" comp 2.26 = offset 2.26
  Fire phrases slightly anticipatory: 0.5 / 1.15 / 1.85
-->
<div data-composition-id="beat-intro" data-width="1920" data-height="1080" data-duration="3.0">

  <!-- Dark gradient — text reads over full-frame video -->
  <div class="bi-backdrop" data-layout-ignore></div>

  <!-- 3-phrase stack — vertically centered, left half so faces visible right -->
  <div class="bi-zone">
    <div class="bi-words">
      <div id="bi-l1" class="bi-line">IN THIS HALF</div>
      <div id="bi-l2" class="bi-line">OF THE YEAR</div>
      <div id="bi-l3" class="bi-line"><span>WE </span><span class="bi-cyan">TRADED</span></div>
    </div>
  </div>

  <style>
    [data-composition-id="beat-intro"] {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: transparent;
      font-family: "Inter", "Helvetica", sans-serif;
    }
    [data-composition-id="beat-intro"] .bi-backdrop {
      position: absolute; top: 0; left: 0; width: 980px; height: 1080px;
      background: linear-gradient(to right,
        rgba(0,0,0,0.75) 0%,
        rgba(0,0,0,0.55) 60%,
        transparent 100%);
      pointer-events: none;
    }
    /* Vertically centered left zone */
    [data-composition-id="beat-intro"] .bi-zone {
      position: absolute; top: 0; left: 0;
      width: 900px; height: 1080px;
      display: flex; align-items: center;
      padding-left: 80px;
    }
    /* 3 phrases stack — each stays visible */
    [data-composition-id="beat-intro"] .bi-words {
      display: flex; flex-direction: column; gap: 12px;
      width: 100%;
    }
    [data-composition-id="beat-intro"] .bi-line {
      font-family: "Inter", sans-serif;
      font-weight: 900;
      font-size: 130px;
      color: #ffffff;
      line-height: 1.0;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      opacity: 0;
      text-shadow: 0 4px 22px rgba(0,0,0,0.95), 0 2px 8px rgba(0,0,0,0.85);
    }
    [data-composition-id="beat-intro"] .bi-cyan {
      color: #00d4ff;
      text-shadow:
        0 0 80px rgba(0,212,255,0.95),
        0 0 40px rgba(0,212,255,0.75),
        0 0 18px rgba(0,212,255,0.55),
        0 4px 22px rgba(0,0,0,0.85);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Each phrase fires in tight sync with spoken words (0.03s anticipatory)
    // "in" spoken at comp 0.88 | "of" spoken at comp 1.50 | "we" spoken at comp 2.26

    // Line 1 "IN THIS HALF" — offset 0.85 (Jasper says "in" at 0.88)
    tl.fromTo("#bi-l1",
      {opacity:0, y:28},
      {opacity:1, y:0, duration:0.28, ease:"expo.out"},
      0.85
    );
    // Line 2 "OF THE YEAR" — offset 1.47 (Jasper says "of" at 1.50)
    tl.fromTo("#bi-l2",
      {opacity:0, y:28},
      {opacity:1, y:0, duration:0.28, ease:"expo.out"},
      1.47
    );
    // Line 3 "WE TRADED" — offset 2.22 (Jasper says "we" at 2.26)
    tl.fromTo("#bi-l3",
      {opacity:0, y:28, scale:0.92},
      {opacity:1, y:0, scale:1, duration:0.32, ease:"expo.out"},
      2.22
    );

    // All 3 lines hold — full sentence visible
    // Exit all together — upward wipe before beat-open at t=3.0
    tl.to(".bi-line", {y:-32, opacity:0, duration:0.28, ease:"power2.in"}, 2.65);

    window.__timelines["beat-intro"] = tl;
  })();
  </script>
</div>
</template>
