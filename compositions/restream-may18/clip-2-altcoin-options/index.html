<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clip 2 — Altcoin Options: The Inflection Point (06:57–09:03)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body, html {
        width: 1920px; height: 1080px;
        background: #0a0a0a; overflow: hidden;
        font-family: "Inter", sans-serif;
      }
      #master-root { width: 1920px; height: 1080px; position: relative; background: #0a0a0a; }

      /* Dot grid */
      #master-root::before {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(circle, rgba(255,255,255,0.038) 1px, transparent 1px);
        background-size: 44px 44px; pointer-events: none; z-index: 0;
      }

      /* Left-zone glow */
      #bg-glow {
        position: absolute; top: 0; left: 0; width: 1152px; height: 1080px;
        background:
          radial-gradient(ellipse at 22% 55%, rgba(0,212,255,0.13) 0%, transparent 50%),
          radial-gradient(ellipse at 78% 18%, rgba(0,212,255,0.05) 0%, transparent 38%);
        pointer-events: none; z-index: 0; opacity: 0;
      }
      #zone-rule {
        position: absolute; left: 1151px; top: 60px; width: 1px; height: 960px;
        background: #2a2a2a; transform-origin: top center; z-index: 1; opacity: 0;
      }

      /*
        VIDEO — starts FULL FRAME (1920×1080), visible from t=0 for kinetic intro.
        GSAP transitions to Mode A at t=3.0s.

        Mode A (80% scale): width:614, height:864
          Centered in right zone: x=1152+(768-614)/2=1229, y=(1080-864)/2=108
          Bottom clearance: 1080-108-864=108px > 40px ✓
          Top clearance: 108px > 20px ✓
          object-position: 83% center → shows source x≈960-1574 (Jasper's half, full name visible)
      */
      #short_mag_cut_frame {
        position: absolute;
        left: 0; top: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: transparent;
        border-radius: 0; z-index: 2;
      }
      #short_mag_cut,
      #short_mag_cut_frame > img.__render_frame__,
      #short_mag_cut_frame > img.__preview_render_frame__ {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover;
        /* 83% center: shows source from ~x:960 = Jasper's half, name fully visible */
        object-position: 83% center;
        display: block;
      }

      .overlay-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
      }
      #beat-intro, #beat-open, #beat-kinetic2, #beat-2c, #beat-2d,
      #beat-fscreen, #beat-2e, #beat-2f,
      #beat-2g, #beat-2i, #beat-apy { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="master-root" data-composition-id="master" data-width="1920" data-height="1080" data-start="0" data-duration="126">
      <div id="bg-glow" data-layout-ignore></div>
      <div id="zone-rule" data-layout-ignore></div>

      <!--
        BEAT INTRO: t=0.0–3.0s
        Full-frame video (BOTH speakers visible). Kinetic text overlay.
        Inter Black 900, 132px, cyan glow. expo.out entry, power2.in upward exit.
        DESIGN.md: "pull strongest phrase from 5–15s if opening filler" → anticipatory "WE TRADED / THREE AND A HALF / TIMES MORE"
      -->
      <div id="beat-intro" class="overlay-layer clip"
        data-composition-id="beat-intro"
        data-composition-src="compositions/beat-intro.html"
        data-start="0.0" data-duration="3.0" data-track-index="3"></div>

      <!--
        BEAT OPEN: t=3.0–9.0s — Stat fires when Jasper says "three" (comp 3.5)
        Shortened to 6s; beat-kinetic2 takes over at t=9 for full-frame variety
      -->
      <div id="beat-open" class="overlay-layer clip"
        data-composition-id="beat-open"
        data-composition-src="compositions/beat-open.html"
        data-start="3.0" data-duration="6.0" data-track-index="3"></div>

      <!--
        BEAT KINETIC2: t=9.0–23.0s — Extended 14s with two sequences
        SEQ1: WE'RE SEEING / STRONG / APPETITE (offsets 0.5–4.0)
        SEQ2: YIELD STRATEGIES / LOW DELTA / ELEGANT RISK (offsets 4.76–13.2)
        Video stays FULL FRAME entire 14s — no Mode A return at 14.2
      -->
      <div id="beat-kinetic2" class="overlay-layer clip"
        data-composition-id="beat-kinetic2"
        data-composition-src="compositions/beat-kinetic2.html"
        data-start="9.0" data-duration="14.0" data-track-index="3"></div>

      <!-- Beat 2C: Kinetic "OPTIONS / INFLECTION POINT / IN ADOPTION" — t=23.2–30.9s -->
      <!-- Shifted 0.4s to avoid track overlap with extended beat-kinetic2 -->
      <div id="beat-2c" class="overlay-layer clip"
        data-composition-id="beat-2c"
        data-composition-src="compositions/beat-2c.html"
        data-start="23.2" data-duration="7.7" data-track-index="3"></div>

      <!--
        Beat 2D: Liquid Glass Card — buyer types — t=31.0–42.0s (shortened 3s)
        User: "00:42 we should shift to full screen by this point"
      -->
      <div id="beat-2d" class="overlay-layer clip"
        data-composition-id="beat-2d"
        data-composition-src="compositions/beat-2d.html"
        data-start="31.0" data-duration="11.0" data-track-index="3"></div>

      <!--
        BEAT FSCREEN: t=42.0–57.0s — Full-frame conversation window
        Host question on right: "ARE THOSE GUYS CRYPTO-NATIVE ASSET MANAGERS?"
        Fires at beat offset 0.6, exits at 4.2. Rest is clean conversation window.
      -->
      <div id="beat-fscreen" class="overlay-layer clip"
        data-composition-id="beat-fscreen"
        data-composition-src="compositions/beat-fscreen.html"
        data-start="42.0" data-duration="15.0" data-track-index="3"></div>

      <!-- Beat 2E: Kinetic "THE REALITY IS / WITH OPTIONS / IT DOESN'T MATTER" — t=57.0–65.5s -->
      <div id="beat-2e" class="overlay-layer clip"
        data-composition-id="beat-2e"
        data-composition-src="compositions/beat-2e.html"
        data-start="57.0" data-duration="8.5" data-track-index="3"></div>

      <!--
        Beat 2F: Decision-tree option selection — t=66.0–82.0s (extended 2s for STRUCTURES hold)
        Smoother animation: power3.out (no elastic bounce). STRUCTURES visible through comp 82.
        Clean window 82–88 follows (6s gap before beat-2g).
      -->
      <div id="beat-2f" class="overlay-layer clip"
        data-composition-id="beat-2f"
        data-composition-src="compositions/beat-2f.html"
        data-start="66.0" data-duration="22.0" data-track-index="3"></div>

      <!--
        Beat 2G: CAPITAL EFFICIENT / PASSIVE YIELD — t=88.0–97.0s (9s)
        Delayed to comp 88 (6s clean window after beat-2f). Re-synced word timings.
        "capital" comp 88.06 | "passive yield" comp 92.62
      -->
      <div id="beat-2g" class="overlay-layer clip"
        data-composition-id="beat-2g"
        data-composition-src="compositions/beat-2g.html"
        data-start="88.0" data-duration="9.0" data-track-index="3"></div>

      <!-- beat-2h REMOVED: graphic was contextually wrong (PASSIVE YIELD while Jasper discusses staking risks) -->
      <!-- clean window t=97–106: Jasper talks about staking risks, full-frame video holds -->

      <!--
        Beat 2I: STAKING vs COVERED CALLS — t=106.0–119.0s (13s)
        COVERED CALLS fires at offset 4.80 (5s earlier). Smoother y-slide entry.
        Fadeout at offset 12.0. beat-apy picks up at comp 119.
      -->
      <div id="beat-2i" class="overlay-layer clip"
        data-composition-id="beat-2i"
        data-composition-src="compositions/beat-2i.html"
        data-start="99.0" data-duration="20.0" data-track-index="3"></div>

      <!--
        Beat APY: APY bar chart — t=119.0–126.0s (7s)
        Stocks 12% → BTC 38% → ETH 65% → ALTCOINS 90%+ (cyan, glow)
        Footer: "PRETTY IMPRESSIVE" at offset 4.14 when Jasper says it
      -->
      <div id="beat-apy" class="overlay-layer clip"
        data-composition-id="beat-apy"
        data-composition-src="compositions/beat-apy.html"
        data-start="119.0" data-duration="7.0" data-track-index="3"></div>

      <script>
        window.__timelines = window.__timelines || {};
        const masterTL = gsap.timeline({ paused: true });

        const v   = document.getElementById("short_mag_cut_frame");
        const vid = document.getElementById("short_mag_cut");
        const gr  = document.getElementById("bg-glow");
        const zr  = document.getElementById("zone-rule");

        // Mode A: 80% of right 40% zone. object-position:83% shows full name.
        const MODE_A = { left: 1229, top: 108, width: 614, height: 864 };
        // Jasper-only clean windows
        const JASPER  = { left: 960, top: 0, width: 960, height: 1080 };

        // ── PHASE 0: t=0.0–3.0s — FULL FRAME (beat-intro kinetic fires over both speakers) ──
        // No GSAP needed — CSS default is full-frame, video visible immediately.

        // ── PHASE 1: t=3.0 — Video transitions from FULL FRAME to Mode A ──
        // Cinematic shrink: full-frame → right panel as beat-open stat fires
        masterTL.to(v, {
          left: MODE_A.left, top: MODE_A.top,
          width: MODE_A.width, height: MODE_A.height,
          borderRadius: "6px",
          duration: 0.7, ease: "expo.inOut"
        }, 3.0);
        // Glow + rule appear with Mode A
        masterTL.to(gr, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.3);
        masterTL.fromTo(zr, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.6, ease: "power4.out" }, 3.4);
        // Ken Burns: slow zoom on speaker
        masterTL.fromTo(vid,
          { scale: 1.0, transformOrigin: "center center" },
          { scale: 1.04, duration: 115, ease: "none" },
          3.5
        );

        // ── PHASE 2: beat-open ends (t=9.0) — video expands to FULL FRAME for beat-kinetic2 ──
        // Extended beat-kinetic2 (14s) holds full-frame through comp 23. No Mode A return at 14.
        masterTL.to([gr, zr], { opacity: 0, duration: 0.3, ease: "power2.in" }, 8.8);
        masterTL.to(v, {
          left: 0, top: 0, width: 1920, height: 1080,
          borderRadius: "0px", duration: 0.4, ease: "expo.inOut"
        }, 9.0);

        // ── PHASE 3: beat-2c kinetic (t=22.5) — video exits while kinetic2 still running ──
        // beat-kinetic2 words exit at offset 13.2 (comp 22.2); video follows at 22.5
        masterTL.to(v, { x: 300, opacity: 0, duration: 0.28, ease: "power3.in" }, 22.5);

        // ── PHASE 4: beat-2c ends (t=30.5) — return Mode A ──
        masterTL.to(v, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 30.5);
        masterTL.to([gr, zr], { opacity: 1, duration: 0.3, ease: "power2.out" }, 31.2);

        // ── PHASE 5: beat-2d ends (t=42.0) — FULL FRAME for beat-fscreen ──
        // User: "00:42 we should shift to full screen by this point"
        masterTL.to([gr, zr], { opacity: 0, duration: 0.35, ease: "power2.out" }, 42.0);
        masterTL.to(v, {
          left: 0, top: 0, width: 1920, height: 1080,
          borderRadius: "0px", duration: 0.45, ease: "expo.out"
        }, 42.0);

        // ── PHASE 6: beat-fscreen runs 42–57 (15s) — FULL FRAME holds ──

        // ── PHASE 7: beat-2e kinetic (t=56.7) — video exits from FULL FRAME ──
        masterTL.to(v, { x: 300, opacity: 0, duration: 0.28, ease: "power3.in" }, 56.7);

        // ── PHASE 8: beat-2e ends (t=65.5) — return Mode A ──
        masterTL.to(v, {
          x: 0, opacity: 1,
          left: MODE_A.left, top: MODE_A.top,
          width: MODE_A.width, height: MODE_A.height,
          borderRadius: "6px", duration: 0.4, ease: "expo.out"
        }, 65.8);
        masterTL.to(gr, { opacity: 1, duration: 0.35, ease: "power2.out" }, 65.8);
        masterTL.fromTo(zr, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.45, ease: "power4.out" }, 65.8);

        // ── PHASE 9: beat-2f runs 66-82 in Mode A, then 6s clean window (82-88) ──
        // beat-2g starts comp 88 — video needs to be full-frame at 88.0
        masterTL.to([gr, zr], { opacity: 0, duration: 0.3, ease: "power2.out" }, 87.8);
        masterTL.to(v, {
          left: 0, top: 0, width: 1920, height: 1080,
          borderRadius: "0px", duration: 0.4, ease: "expo.out"
        }, 88.0);

        // ── PHASE 10: beat-2g ends (t=97) → clean window 97-106 ──
        // beat-2h REMOVED (wrong context). Video stays FULL FRAME. No exit tween.
        // beat-2g overlay fades internally at its offset 8.0; video holds clean.

        // ── PHASE 11: beat-2i starts at t=106 — video already FULL FRAME ──
        // No transition needed. beat-2i has its own dark gradient backdrop.

        // ── PHASE 12: beat-apy starts at t=119 — video stays FULL FRAME through clip end ──

        window.__timelines["master"] = masterTL;
      </script>
    </div>

    <!-- A-roll: full-frame by default; GSAP transitions to Mode A at t=3.0 -->
    <div id="short_mag_cut_frame">
      <video id="short_mag_cut"
        src="source.mp4" muted playsinline
        data-start="0" data-duration="126" data-media-start="417.72" data-track-index="1"></video>
    </div>
    <audio id="a-roll-audio"
      src="source.mp4"
      data-start="0" data-duration="126" data-media-start="417.72" data-track-index="5" data-volume="1"></audio>
  </body>
</html>
