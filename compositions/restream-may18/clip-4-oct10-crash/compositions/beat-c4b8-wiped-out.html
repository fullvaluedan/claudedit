<template id="beat-c4b8-template">
<!--
  c4b8 — kinetic-type HUMAN CLOSER · full-frame (both speakers) · comp 80.6–88.2
  Phrase build, lines STAY (no dim). Inter 900 ~130px over a left dark-gradient backdrop.
  The human cost — a different beat-type than the 25× stat (fixes v1's stat-callback repeat).

  WORD-SYNCED (offset = comp_t − 80.6, comp read off clip4-words.txt):
    L1 "NEW TO PERPS"      white  "new"@comp81.82 → slam offset 1.22
         (Whisper "burp"@comp82.32 → on-screen "PERPS" per _JARGON.md — corrected spelling)
    L2 "CROSS-MARGINING ON" white "cross"@comp83.90 → slam offset 3.30
    L3 "WIPED OUT"         cyan   "wiped"@comp87.16 → slam offset 6.56 ("out."@87.50)

  CYAN ELEMENT (single): L3 "WIPED OUT" only.
  L3 lands ~87.5, holds; clip ends at comp 88.2 on live full-frame video (no outro, D4).
-->
<div data-composition-id="beat-c4b8" data-width="1920" data-height="1080" data-duration="7.6">

  <div class="c8-backdrop" data-layout-ignore></div>

  <div class="c8-zone">
    <div class="c8-words">
      <div id="c8-l1" class="c8-line">NEW TO PERPS</div>
      <div id="c8-l2" class="c8-line">CROSS-MARGINING ON</div>
      <div id="c8-l3" class="c8-line c8-cyan">WIPED OUT</div>
    </div>
  </div>

  <style>
    [data-composition-id="beat-c4b8"] {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: transparent;
      font-family: "Inter", "Helvetica", sans-serif;
    }
    [data-composition-id="beat-c4b8"] .c8-backdrop {
      position: absolute; top: 0; left: 0; width: 1040px; height: 1080px;
      background: linear-gradient(to right,
        rgba(0,0,0,0.78) 0%,
        rgba(0,0,0,0.58) 60%,
        transparent 100%);
      pointer-events: none;
    }
    [data-composition-id="beat-c4b8"] .c8-zone {
      position: absolute; top: 0; left: 0;
      width: 1000px; height: 1080px;
      display: flex; align-items: center;
      padding-left: 80px;
    }
    [data-composition-id="beat-c4b8"] .c8-words {
      display: flex; flex-direction: column; gap: 14px; width: 100%;
    }
    [data-composition-id="beat-c4b8"] .c8-line {
      font-family: "Inter", sans-serif; font-weight: 900;
      font-size: 122px; color: #ffffff; line-height: 1.0;
      letter-spacing: -0.03em; text-transform: uppercase; opacity: 0;
      text-shadow: 0 4px 22px rgba(0,0,0,0.95), 0 2px 8px rgba(0,0,0,0.85);
    }
    [data-composition-id="beat-c4b8"] .c8-cyan {
      color: #00d4ff;
      text-shadow:
        0 0 80px rgba(0,212,255,0.95),
        0 0 40px rgba(0,212,255,0.75),
        0 0 18px rgba(0,212,255,0.55),
        0 4px 22px rgba(0,0,0,0.85);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // beat starts comp 80.6 → offset = comp_t − 80.6

    // L1 "NEW TO PERPS" — slam offset 1.22 ("new"@comp81.82)
    tl.fromTo("#c8-l1",
      {opacity:0, y:28},
      {opacity:1, y:0, duration:0.28, ease:"expo.out"},
      1.22
    );
    // L2 "CROSS-MARGINING ON" — slam offset 3.30 ("cross"@comp83.90)
    tl.fromTo("#c8-l2",
      {opacity:0, y:28},
      {opacity:1, y:0, duration:0.28, ease:"expo.out"},
      3.30
    );
    // L3 "WIPED OUT" (cyan payoff) — slam offset 6.56 ("wiped"@comp87.16 / "out."@87.50)
    tl.fromTo("#c8-l3",
      {opacity:0, y:28, scale:0.92},
      {opacity:1, y:0, scale:1, duration:0.34, ease:"expo.out"},
      6.56
    );

    // Build & STAY (no dim). L3 holds through clip end at comp 88.2 — no exit tween,
    // no outro (D4); the clip ends on live full-frame video with the line settled.

    window.__timelines["beat-c4b8"] = tl;
  })();
  </script>
