<template id="beat-c4b1-template">
<!--
  c4b1 — KINETIC COLD OPEN · full-frame (both speakers) → Mode A @3.5 · comp 0.0–7.5
  Phrase build, lines STAY (no dim). Inter 900 ~130px over a left dark-gradient backdrop.
  WORD-SYNCED to the literal first spoken words (read off clip4-words.txt, comp = src−1030.76):
    L1 "YOUR DELTA"        white  — "your"@comp0.00 / "delta"@comp0.16   → fire 0.08
    L2 "COMPLETELY SHIFTS" cyan   — "completely"@comp0.48 / "shifts"@comp0.98 → fire 0.48
  Single cyan element = L2. Whole stack drifts up (power2.in) ~comp 3.1, cleared before
  the master shrink to Mode A at comp 3.5.
-->
<div data-composition-id="beat-c4b1" data-width="1920" data-height="1080" data-duration="7.5">

  <!-- Dark gradient — left zone so the kinetic reads over the full-frame video -->
  <div class="c1-backdrop" data-layout-ignore></div>

  <div class="c1-zone">
    <div class="c1-words">
      <div id="c1-l1" class="c1-line">YOUR DELTA</div>
      <div id="c1-l2" class="c1-line c1-cyan">COMPLETELY SHIFTS</div>
    </div>
  </div>

  <style>
    [data-composition-id="beat-c4b1"] {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: transparent;
      font-family: "Inter", "Helvetica", sans-serif;
    }
    [data-composition-id="beat-c4b1"] .c1-backdrop {
      position: absolute; top: 0; left: 0; width: 1000px; height: 1080px;
      background: linear-gradient(to right,
        rgba(0,0,0,0.78) 0%,
        rgba(0,0,0,0.58) 60%,
        transparent 100%);
      pointer-events: none;
    }
    [data-composition-id="beat-c4b1"] .c1-zone {
      position: absolute; top: 0; left: 0;
      width: 980px; height: 1080px;
      display: flex; align-items: center;
      padding-left: 80px;
    }
    [data-composition-id="beat-c4b1"] .c1-words {
      display: flex; flex-direction: column; gap: 14px; width: 100%;
    }
    [data-composition-id="beat-c4b1"] .c1-line {
      font-family: "Inter", sans-serif; font-weight: 900;
      font-size: 130px; color: #ffffff; line-height: 1.0;
      letter-spacing: -0.03em; text-transform: uppercase; opacity: 0;
      text-shadow: 0 4px 22px rgba(0,0,0,0.95), 0 2px 8px rgba(0,0,0,0.85);
    }
    [data-composition-id="beat-c4b1"] .c1-cyan {
      color: #00d4ff;
      text-shadow:
        0 0 80px rgba(0,212,255,0.95),
        0 0 40px rgba(0,212,255,0.75),
        0 0 18px rgba(0,212,255,0.55),
        0 4px 22px rgba(0,0,0,0.85);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // L1 "YOUR DELTA" — fire comp 0.08 (he says "your"@0.00 / "delta"@0.16)
    tl.fromTo("#c1-l1",
      {opacity:0, y:28},
      {opacity:1, y:0, duration:0.28, ease:"expo.out"},
      0.08
    );
    // L2 "COMPLETELY SHIFTS" (cyan payoff) — fire comp 0.48 ("completely"@0.48 / "shifts"@0.98)
    tl.fromTo("#c1-l2",
      {opacity:0, y:28, scale:0.92},
      {opacity:1, y:0, scale:1, duration:0.32, ease:"expo.out"},
      0.48
    );

    // Both lines hold (build & STAY, no dim). Whole stack drifts up before the 3.5 shrink.
    tl.to(".c1-line", {y:-32, opacity:0, duration:0.30, ease:"power2.in"}, 3.10);

    window.__timelines["beat-c4b1"] = tl;
  })();
  </script>
</div>
</template>
