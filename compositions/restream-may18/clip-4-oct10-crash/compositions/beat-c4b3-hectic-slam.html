<template id="beat-c4b3-template">
<!--
  c4b3 — caption-kinetic-slam (HECTIC) · full-frame (both speakers) · comp 34.0–39.4
  Device: the installed `caption-kinetic-slam` component's motion signature (single-word
  full-screen slams, ALTERNATING entrance directions) — restyled to DESIGN palette
  (Inter 900, white + single cyan, dark gradient backdrop). Distinct motion from c4b1's
  y-rise phrase build (these enter horizontally from opposite sides).

  WORD-SYNCED (offset = comp_t − 34.0, comp read off clip4-words.txt):
    EXTREMELY  white  "extremely"@comp34.52 → slam offset 0.52 (enters from LEFT)
    HECTIC     cyan   "hectic,"  @comp34.98 → slam offset 0.98 (enters from RIGHT)
  Both stay visible (build & STAY), then scale-down + fade ~comp 39.0 → offset 5.0.
  CYAN ELEMENT (single): HECTIC only.
-->
<div data-composition-id="beat-c4b3" data-width="1920" data-height="1080" data-duration="5.4">

  <div class="c3-backdrop" data-layout-ignore></div>

  <div class="c3-stage">
    <div id="c3-w1" class="c3-word">EXTREMELY</div>
    <div id="c3-w2" class="c3-word c3-cyan">HECTIC</div>
  </div>

  <style>
    [data-composition-id="beat-c4b3"] {
      width: 1920px; height: 1080px; position: relative; overflow: hidden;
      background: transparent;
      font-family: "Inter", "Helvetica", sans-serif;
    }
    /* Full-frame dark backdrop so the centered slams read over both speakers */
    [data-composition-id="beat-c4b3"] .c3-backdrop {
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.62) 50%,
        rgba(0,0,0,0.45) 100%);
      pointer-events: none;
    }
    [data-composition-id="beat-c4b3"] .c3-stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px;
    }
    [data-composition-id="beat-c4b3"] .c3-word {
      font-family: "Inter", sans-serif; font-weight: 900;
      font-size: 168px; color: #ffffff; line-height: 0.98;
      letter-spacing: -0.02em; text-transform: uppercase; opacity: 0;
      text-shadow: 0 6px 30px rgba(0,0,0,0.95), 0 2px 10px rgba(0,0,0,0.9);
    }
    [data-composition-id="beat-c4b3"] .c3-cyan {
      color: #00d4ff;
      text-shadow:
        0 0 90px rgba(0,212,255,0.95),
        0 0 44px rgba(0,212,255,0.78),
        0 0 20px rgba(0,212,255,0.55),
        0 6px 26px rgba(0,0,0,0.85);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function(){
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // EXTREMELY — slam offset 0.52 (he says "extremely"@comp34.52), enters from LEFT
    tl.fromTo("#c3-w1",
      {opacity:0, x:-360},
      {opacity:1, x:0, duration:0.26, ease:"expo.out"},
      0.52
    );
    // HECTIC (cyan payoff) — slam offset 0.98 ("hectic,"@comp34.98), enters from RIGHT
    tl.fromTo("#c3-w2",
      {opacity:0, x:360},
      {opacity:1, x:0, duration:0.26, ease:"expo.out"},
      0.98
    );

    // Both hold (build & STAY), then scale-down + fade ~comp 39.0 → offset 5.0
    tl.to(".c3-word", {opacity:0, scale:0.9, duration:0.32, ease:"power2.in"}, 5.0);

    window.__timelines["beat-c4b3"] = tl;
  })();
  </script>
</div>
</template>
