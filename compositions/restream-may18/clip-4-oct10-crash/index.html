<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clip 4 — Oct 10 Crash (ADL Cascade) — 17:10–18:38</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body, html {
        width: 1920px; height: 1080px;
        background: #0a0a0a; overflow: hidden;
        font-family: "Inter", sans-serif;
      }
      #master-root { width: 1920px; height: 1080px; position: relative; background: #0a0a0a; }

      /* Dot grid */
      #master-root::before {
        content: ''; position: absolute; inset: 0;
        background-image: radial-gradient(circle, rgba(255,255,255,0.038) 1px, transparent 1px);
        background-size: 44px 44px; pointer-events: none; z-index: 0;
      }

      /* Left-zone glow */
      #bg-glow {
        position: absolute; top: 0; left: 0; width: 1152px; height: 1080px;
        background:
          radial-gradient(ellipse at 22% 55%, rgba(0,212,255,0.13) 0%, transparent 50%),
          radial-gradient(ellipse at 78% 18%, rgba(0,212,255,0.05) 0%, transparent 38%);
        pointer-events: none; z-index: 0; opacity: 0;
      }
      #zone-rule {
        position: absolute; left: 1151px; top: 60px; width: 1px; height: 960px;
        background: #2a2a2a; transform-origin: top center; z-index: 1; opacity: 0;
      }

      /*
        VIDEO — starts FULL FRAME (1920×1080), visible from t=0 for the cold-open kinetic
        (the spoken "YOUR DELTA / COMPLETELY SHIFTS" line — word-synced, NOT anticipatory).
        GSAP shrinks it to Mode A at comp 3.5 (v3 grouped view-timeline).

        Mode A (80% scale): width:614, height:864
          Centered in right zone: x=1152+(768-614)/2=1229, y=(1080-864)/2=108
          Bottom clearance: 1080-108-864=108px > 40px ✓ | Top clearance: 108px > 20px ✓
          object-position: 83% center → window lands on JASPER's face (~70-88% of source
          width), catches the right of his name-tag, EXCLUDES the center seam + host.
          (50%/62% center the seam/host — the clip-1 mistake.)
      */
      #short_mag_cut_frame {
        position: absolute;
        left: 0; top: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: transparent;
        border-radius: 0; z-index: 2;
      }
      #short_mag_cut,
      #short_mag_cut_frame > img.__render_frame__,
      #short_mag_cut_frame > img.__preview_render_frame__ {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover;
        /* 83% center: window lands on Jasper's face, seam/host excluded, name kept */
        object-position: 83% center;
        display: block;
      }

      .overlay-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
      }
      /* z-index:3 — EVERY overlay beat id MUST be listed here (DESIGN.md line 58)
         or it renders BEHIND the z-index:2 video and is invisible.
         All 7 beat ids (c4b7 intentionally skipped per EDL). */
      #beat-c4b1, #beat-c4b2, #beat-c4b3, #beat-c4b4,
      #beat-c4b5, #beat-c4b6, #beat-c4b8 { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="master-root" data-composition-id="master" data-width="1920" data-height="1080" data-start="0" data-duration="88.2">
      <div id="bg-glow" data-layout-ignore></div>
      <div id="zone-rule" data-layout-ignore></div>

      <!--
        c4b1 — KINETIC COLD OPEN: comp 0.0–7.5 · V0 full-frame → Mode A @3.5
        Full-frame video (BOTH speakers) while the WORD-SYNCED line builds:
          YOUR DELTA          (white)  — fire comp 0.08 ("your"@0.00 / "delta"@0.16)
          COMPLETELY SHIFTS   (cyan)   — fire comp 0.48 ("completely"@0.48 / "shifts"@0.98)
        These are the literal first spoken words. Stack exits up ~3.1; master shrinks
        video to Mode A at 3.5.
      -->
      <div id="beat-c4b1" class="overlay-layer clip"
        data-composition-id="beat-c4b1"
        data-composition-src="compositions/beat-c4b1-delta-open.html"
        data-start="0.0" data-duration="7.5" data-track-index="3"></div>

      <!--
        c4b2 — ADL CASCADE flowchart (CENTERPIECE / PRIMARY DEVICE): comp 8.0–33.4, Mode A (V1)
        5 cause→effect nodes that build IN SYNC with the spoken cascade:
          node2 "closed out" comp 15.9 | node3 "naked long delta" comp 17.7
          node4 "feedback loop" comp 24.7 | node5 "alts -60/70/80%" comp 31.9→32.78 (cyan)
        Connectors muted #6B7480 (structural, NOT an accent). Node 5 = sole cyan element.
      -->
      <div id="beat-c4b2" class="overlay-layer clip"
        data-composition-id="beat-c4b2"
        data-composition-src="compositions/beat-c4b2-adl-cascade.html"
        data-start="8.0" data-duration="25.4" data-track-index="3"></div>

      <!--
        c4b3 — caption-kinetic-slam (full-frame V2): comp 34.0–39.4
        EXTREMELY (slam 34.52, enters left) / HECTIC (cyan slam 34.98, enters right).
        Master expanded to full-frame @33.6; STAYS full-frame after this beat through
        comp 46.0 (live "shorter/compression" stretch — same view, no switch).
      -->
      <div id="beat-c4b3" class="overlay-layer clip"
        data-composition-id="beat-c4b3"
        data-composition-src="compositions/beat-c4b3-hectic-slam.html"
        data-start="34.0" data-duration="5.4" data-track-index="3"></div>

      <!-- live video full-frame comp 39.4–46.0 (V2 tail — "shorter than people think / real compression"), no overlay -->
      <!-- clean window comp 46.0–51.0 (Mode A V3, no overlay) -->

      <!--
        c4b4 — liquid-glass card (Mode A V3): comp 51.0–58.0
        HOW LONG IT LASTED / 30–45 MINUTES / of real stress — card slides in comp 51.5
        to land on spoken "half an hour to 45 minutes" (half@51.58 / 45@52.24).
      -->
      <div id="beat-c4b4" class="overlay-layer clip"
        data-composition-id="beat-c4b4"
        data-composition-src="compositions/beat-c4b4-30-45-min.html"
        data-start="51.0" data-duration="7.0" data-track-index="3"></div>

      <!--
        c4b5 — caption-kinetic-slam (25× REVEAL, task-required device): comp 58.5–72.8
        Full-frame (V4). Five alternating-direction slams word-synced:
          25× (hero, scale-pop) 63.76 | TIMES MORE (left) 65.68 | DERIVATIVES (right) 66.88
          THAN SPOT (bottom) 67.62 | $226K MELT-UP (cyan payoff) 69.92→71.82
        The ONLY 25× appearance in the clip. Master expanded full-frame @58.3, STAYS to end.
      -->
      <div id="beat-c4b5" class="overlay-layer clip"
        data-composition-id="beat-c4b5"
        data-composition-src="compositions/beat-c4b5-25x-slam.html"
        data-start="58.5" data-duration="14.3" data-track-index="3"></div>

      <!--
        c4b6 — liquid-glass card on full-frame backdrop (V4): comp 75.0–80.0
        WHAT FUELED THE MOVE / LEVERAGE, NOT SPOT / the rally ran on borrowed size.
        Card head slides ~75.4, headline settles by spoken "leverage."@76.20.
        Breaks the kinetic run between c4b5 slam and c4b8 closer (slam → card → kinetic).
      -->
      <div id="beat-c4b6" class="overlay-layer clip"
        data-composition-id="beat-c4b6"
        data-composition-src="compositions/beat-c4b6-leverage-not-spot.html"
        data-start="75.0" data-duration="5.0" data-track-index="3"></div>

      <!--
        c4b8 — kinetic-type human closer (full-frame V4): comp 80.6–88.2
        NEW TO PERPS (81.82) / CROSS-MARGINING ON (83.90) / WIPED OUT (cyan 87.16).
        Stays full-frame through clip end — no card, no end screen (D4 no-outro).
        Ends on the human consequence, not a stat callback.
      -->
      <div id="beat-c4b8" class="overlay-layer clip"
        data-composition-id="beat-c4b8"
        data-composition-src="compositions/beat-c4b8-wiped-out.html"
        data-start="80.6" data-duration="7.6" data-track-index="3"></div>

      <script>
        window.__timelines = window.__timelines || {};
        const masterTL = gsap.timeline({ paused: true });

        const v   = document.getElementById("short_mag_cut_frame");
        const vid = document.getElementById("short_mag_cut");
        const gr  = document.getElementById("bg-glow");
        const zr  = document.getElementById("zone-rule");

        // Mode A: 80% of right 40% zone. object-position:83% lands on Jasper, name visible.
        const MODE_A = { left: 1229, top: 108, width: 614, height: 864 };
        const FULL   = { left: 0, top: 0, width: 1920, height: 1080 };

        // ════════════════════════════════════════════════════════════════════
        //  V3 GROUPED VIEW-TIMELINE (every non-intro view ≥12.3s, no A-B-A <12s)
        //  V0 full   0.0 → 3.5  (3.5s intro, exempt)        c4b1
        //  V1 ModeA  3.5 → 33.6 (30.1s)                     c4b2 cascade
        //  V2 full   33.6 → 46.0 (12.4s)                    c4b3 + live tail
        //  V3 ModeA  46.0 → 58.3 (12.3s)                    live + c4b4 card
        //  V4 full   58.3 → 88.2 (29.9s)                    c4b5 → live → c4b6 → c4b8
        //  Switches happen ONLY at 3.5 / 33.6 / 46.0 / 58.3 — video never bounces.
        // ════════════════════════════════════════════════════════════════════

        // ── V0 → V1: comp 3.5 — shrink FULL → Mode A as he continues "…delta neutral…" ──
        masterTL.to(v, {
          left: MODE_A.left, top: MODE_A.top,
          width: MODE_A.width, height: MODE_A.height,
          borderRadius: "6px",
          duration: 0.7, ease: "expo.inOut"
        }, 3.5);
        masterTL.to(gr, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.8);
        masterTL.fromTo(zr, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.6, ease: "power4.out" }, 3.9);
        // Slow Ken-Burns across the clip (1.0 → 1.04)
        masterTL.fromTo(vid,
          { scale: 1.0, transformOrigin: "center center" },
          { scale: 1.04, duration: 84, ease: "none" },
          4.2
        );

        // ── V1: c4b2 cascade plays 8.0–33.4 in Mode A (glow + rule already in) ──

        // ── V1 → V2: comp 33.6 — expand to FULL FRAME for the HECTIC slam + live tail ──
        masterTL.to([gr, zr], { opacity: 0, duration: 0.3, ease: "power2.in" }, 33.4);
        masterTL.to(v, {
          left: FULL.left, top: FULL.top, width: FULL.width, height: FULL.height,
          borderRadius: "0px", duration: 0.4, ease: "expo.inOut"
        }, 33.6);

        // ── V2: c4b3 HECTIC slam (34.0–39.4), then live "shorter/compression" video.
        //        STAYS full-frame through comp 46.0 — no switch (no A-B-A). ──

        // ── V2 → V3: comp 51.0 — return to Mode A EXACTLY as the c4b4 card enters (R7: no blank-left).
        //        Full-frame holds 33.6–51.0 (both speakers); the prior return at 46.0 left a 5s blank left. ──
        masterTL.to(v, {
          left: MODE_A.left, top: MODE_A.top,
          width: MODE_A.width, height: MODE_A.height,
          borderRadius: "6px", duration: 0.45, ease: "expo.out"
        }, 51.0);
        masterTL.to(gr, { opacity: 1, duration: 0.4, ease: "power2.out" }, 51.1);
        masterTL.fromTo(zr, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: 0.5, ease: "power4.out" }, 51.2);

        // ── V3: c4b4 liquid-glass card 51.0–58.0 (Mode A, graphic fills the left the whole time) ──

        // ── V3 → V4: comp 58.3 — expand to FULL FRAME and STAY through clip end ──
        masterTL.to([gr, zr], { opacity: 0, duration: 0.3, ease: "power2.in" }, 58.1);
        masterTL.to(v, {
          left: FULL.left, top: FULL.top, width: FULL.width, height: FULL.height,
          borderRadius: "0px", duration: 0.4, ease: "expo.inOut"
        }, 58.3);

        // ── V4: c4b5 25× slam (58.5–72.8) → live → c4b6 leverage card (75.0–80.0) →
        //        c4b8 closer (80.6–88.2). No return to Mode A — D4 no-outro; clip ends
        //        on live full-frame video. ──

        window.__timelines["master"] = masterTL;
      </script>
    </div>

    <!-- A-roll: full-frame by default; GSAP shrinks to Mode A at comp 3.5. data-media-start = v3 src_in 1030.76 -->
    <div id="short_mag_cut_frame">
      <video id="short_mag_cut"
        src="source.mp4" muted playsinline
        data-start="0" data-media-start="1030.76" data-duration="88.2" data-track-index="1"></video>
    </div>
    <audio id="a-roll-audio"
      src="source.mp4"
      data-start="0" data-media-start="1030.76" data-duration="88.2" data-track-index="5" data-volume="1"></audio>
  </body>
</html>
