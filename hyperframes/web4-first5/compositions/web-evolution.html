<template id="web-evolution-tpl">

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set("#we-band", { opacity: 0 }, 0);
      tl.set("#we-eyebrow", { opacity: 0, y: 14 }, 0);
      tl.set("#we-s1", { opacity: 0, y: 24 }, 0);

      tl.to("#we-plus", { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "expo.out" }, 1.45);

      // exit (clip ~3.8s)
      tl.to(["#we-wrap", "#we-band"], { opacity: 0, y: 12, duration: 0.5, ease: "power2.in" }, 3.2);
