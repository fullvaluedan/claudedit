<template id="gA-template">
  <div data-composition-id="gA" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="gA"]{
        --ink:#14110D; --ink2:#4A463E; --red:#BC1C08; --paper:#F6F4EE;
        --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
        position:absolute; inset:0; font-family:'Inter',system-ui,sans-serif;
      }
      [data-composition-id="gA"] .panel{
        position:absolute; left:48px; top:196px; width:612px; padding:34px 36px 30px;
        background:#F6F4EE; border:2px solid var(--ink);
        box-shadow:10px 10px 0 rgba(20,17,13,0.20);
      }
      [data-composition-id="gA"] .kick{
        font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:700; font-size:30px; letter-spacing:.12em;
        text-transform:uppercase; color:var(--red);
      }
      [data-composition-id="gA"] .sub{
        font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:500; font-size:30px; letter-spacing:.06em;
        color:var(--ink2); margin-top:6px;
      }
      [data-composition-id="gA"] .rule{ height:3px; background:var(--ink); margin:18px 0 10px; transform-origin:left center; }
      [data-composition-id="gA"] .title{
        font-weight:900; font-size:120px; line-height:0.9; letter-spacing:-0.03em; color:var(--ink);
        font-variant-numeric:tabular-nums; margin:4px 0 6px;
      }
      [data-composition-id="gA"] .ttag{ font-weight:800; font-size:40px; letter-spacing:.02em; color:var(--ink); margin-bottom:14px; }
      [data-composition-id="gA"] svg{ display:block; width:540px; height:330px; overflow:visible; }
      [data-composition-id="gA"] .foot{
        font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:600; font-size:26px; letter-spacing:.10em;
        text-transform:uppercase; color:var(--ink2); margin-top:14px; display:flex; justify-content:space-between;
      }
      [data-composition-id="gA"] .gl{ stroke:rgba(20,17,13,0.22); stroke-width:2; }
      [data-composition-id="gA"] .axis{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-size:22px; fill:var(--ink2); letter-spacing:.08em; }
      [data-composition-id="gA"] .contour{ fill:none; stroke:var(--red); stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      [data-composition-id="gA"] .dot{ fill:var(--paper); stroke:var(--ink); stroke-width:4; }
      [data-composition-id="gA"] .dnum{ font-weight:900; font-size:46px; fill:var(--ink); font-variant-numeric:tabular-nums; text-anchor:middle; }
    </style>

    <div class="panel">
      <div class="kick">Cantonese Tone Notation</div>
      <div class="sub">粵語九聲六調</div>
      <div class="rule"></div>
      <div class="title">0243</div>
      <div class="ttag">THE CORE OF MY WHOLE AI</div>
      <svg viewBox="0 0 540 330" aria-hidden="true">
        <!-- pitch gridlines: high(4) .. low(0) -->
        <line class="gl gln" x1="86" y1="44"  x2="540" y2="44"/>
        <line class="gl gln" x1="86" y1="128" x2="540" y2="128"/>
        <line class="gl gln" x1="86" y1="212" x2="540" y2="212"/>
        <line class="gl gln" x1="86" y1="296" x2="540" y2="296"/>
        <text class="axis" x="0"  y="52">HIGH</text>
        <text class="axis" x="0"  y="304">LOW</text>
        <!-- contour through 0(low) -> 2 -> 4(high) -> 3 -->
        <path class="contour" d="M 130 296 L 256 212 L 382 44 L 508 128"/>
        <!-- nodes -->
        <g class="node"><circle class="dot" cx="130" cy="296" r="22"/><text class="dnum" x="130" y="262">0</text></g>
        <g class="node"><circle class="dot" cx="256" cy="212" r="22"/><text class="dnum" x="256" y="178">2</text></g>
        <g class="node"><circle class="dot" cx="382" cy="44"  r="22"/><text class="dnum" x="382" y="20">4</text></g>
        <g class="node"><circle class="dot" cx="508" cy="128" r="22"/><text class="dnum" x="508" y="94">3</text></g>
      </svg>
      <div class="foot"><span>PITCH MAP</span><span>0 = LOW · 4 = HIGH</span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const root = document.querySelector('[data-composition-id="gA"]');
      const path = root.querySelector('.contour');
      const len = path.getTotalLength();
      path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".panel", { opacity:0, x:-44 }, { opacity:1, x:0, duration:0.32, ease:"power3.out" }, 0.12);
      tl.fromTo(".kick", { opacity:0, y:14 }, { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 0.08);
      tl.fromTo(".sub", { opacity:0 }, { opacity:1, duration:0.4, ease:"power1.out" }, 0.46);
      tl.fromTo(".rule", { scaleX:0 }, { scaleX:1, duration:0.5, ease:"expo.out" }, 0.55);
      tl.fromTo(".title", { opacity:0, y:24 }, { opacity:1, y:0, duration:0.55, ease:"power3.out" }, 0.30);
      tl.fromTo(".ttag", { opacity:0, x:-16 }, { opacity:1, x:0, duration:0.4, ease:"power2.out" }, 0.85);
      tl.fromTo(".gln", { scaleX:0, transformOrigin:"left center" }, { scaleX:1, duration:0.5, stagger:0.07, ease:"power2.out" }, 1.05);
      tl.fromTo(".axis", { opacity:0 }, { opacity:1, duration:0.4, stagger:0.1 }, 1.2);
      // draw the contour, then pop each note 0,2,4,3 along it
      tl.to(path, { strokeDashoffset:0, duration:1.5, ease:"power1.inOut" }, 1.35);
      tl.fromTo(".node", { opacity:0, scale:0.2, transformOrigin:"center center" },
                { opacity:1, scale:1, duration:0.42, stagger:0.34, ease:"back.out(2.2)" }, 1.5);
      tl.fromTo(".foot", { opacity:0, y:10 }, { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 3.0);
      // exit
      tl.to(".panel", { opacity:0, x:-30, duration:0.35, ease:"power2.in" }, 5.45);
      window.__timelines["gA"] = tl;
    </script>
  </div>
</template>
