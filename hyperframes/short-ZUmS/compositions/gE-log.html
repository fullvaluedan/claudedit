<template id="gE-template">
  <div data-composition-id="gE" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="gE"]{
        --ink:#14110D; --ink2:#4A463E; --red:#BC1C08; --paper:#F6F4EE;
        --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
        position:absolute; inset:0; font-family:'Inter',system-ui,sans-serif;
      }
      [data-composition-id="gE"] .panel{
        position:absolute; left:48px; top:250px; width:600px; padding:30px 34px 28px;
        background:#F6F4EE; border:2px solid var(--ink);
        box-shadow:10px 10px 0 rgba(20,17,13,0.20);
      }
      [data-composition-id="gE"] .kick{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:700; font-size:30px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2); }
      [data-composition-id="gE"] .rule{ height:3px; background:var(--ink); margin:14px 0 20px; transform-origin:left center; }
      [data-composition-id="gE"] .row{ display:flex; align-items:baseline; justify-content:space-between; padding:10px 0; border-bottom:2px solid rgba(20,17,13,0.18); }
      [data-composition-id="gE"] .row:last-child{ border-bottom:none; }
      [data-composition-id="gE"] .k{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:600; font-size:32px; letter-spacing:.06em; color:var(--ink2); text-transform:uppercase; }
      [data-composition-id="gE"] .v{ font-weight:900; font-size:52px; color:var(--ink); font-variant-numeric:tabular-nums; }
      [data-composition-id="gE"] .v.red{ color:var(--red); }
    </style>
    <div class="panel">
      <div class="kick">Field notes · one mentor</div>
      <div class="rule"></div>
      <div class="row"><span class="k">Encounters</span><span class="v">1</span></div>
      <div class="row"><span class="k">Time talked</span><span class="v red">HOURS</span></div>
      <div class="row"><span class="k">Lessons</span><span class="v">∞</span></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".panel", { opacity:0, x:-40 }, { opacity:1, x:0, duration:0.32, ease:"power3.out" }, 0.1);
      tl.fromTo(".kick", { opacity:0, y:10 }, { opacity:1, y:0, duration:0.35, ease:"power2.out" }, 0.08);
      tl.fromTo(".rule", { scaleX:0 }, { scaleX:1, duration:0.45, ease:"expo.out" }, 0.34);
      tl.fromTo(".row", { opacity:0, x:-20 }, { opacity:1, x:0, duration:0.45, stagger:0.22, ease:"power2.out" }, 0.5);
      tl.fromTo(".v", { scale:0.6, transformOrigin:"right center" }, { scale:1, duration:0.4, stagger:0.22, ease:"back.out(2)" }, 0.6);
      tl.to(".panel", { opacity:0, x:-26, duration:0.34, ease:"power2.in" }, 4.62);
      window.__timelines["gE"] = tl;
    </script>
  </div>
</template>
