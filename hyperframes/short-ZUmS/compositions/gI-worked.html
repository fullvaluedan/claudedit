<template id="gI-template">
  <div data-composition-id="gI" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="gI"]{
        --ink:#14110D; --ink2:#4A463E; --red:#BC1C08; --paper:#F6F4EE;
        --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
        position:absolute; inset:0; font-family:'Inter',system-ui,sans-serif;
      }
      [data-composition-id="gI"] .panel{
        position:absolute; left:48px; top:266px; width:560px; padding:32px 34px 30px;
        background:#F6F4EE; border:2px solid var(--ink);
        box-shadow:10px 10px 0 rgba(20,17,13,0.20);
      }
      [data-composition-id="gI"] .head{ display:flex; align-items:center; gap:22px; }
      [data-composition-id="gI"] .chk{ width:96px; height:96px; flex:none; background:var(--red); color:var(--paper); font-weight:900; font-size:70px; display:flex; align-items:center; justify-content:center; }
      [data-composition-id="gI"] .big{ font-weight:900; font-size:84px; line-height:0.88; letter-spacing:-0.03em; color:var(--ink); }
      [data-composition-id="gI"] .rule{ height:3px; background:var(--ink); margin:20px 0 16px; transform-origin:left center; }
      [data-composition-id="gI"] .magic{ font-weight:800; font-size:46px; letter-spacing:.01em; color:var(--ink); }
      [data-composition-id="gI"] .magic em{ font-style:normal; color:var(--red); }
      [data-composition-id="gI"] .spark{ position:absolute; font-weight:900; color:var(--red); font-size:40px; }
      [data-composition-id="gI"] .s1{ left:548px; top:250px; } [data-composition-id="gI"] .s2{ left:602px; top:330px; font-size:28px; }
      [data-composition-id="gI"] .s3{ left:560px; top:430px; font-size:32px; }
    </style>
    <div class="panel">
      <div class="head"><span class="chk">✓</span><span class="big">It<br>worked</span></div>
      <div class="rule"></div>
      <div class="magic">Suddenly — <em>like magic</em></div>
    </div>
    <span class="spark s1">✦</span>
    <span class="spark s2">✦</span>
    <span class="spark s3">✦</span>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".panel", { opacity:0, scale:0.9, transformOrigin:"left top" }, { opacity:1, scale:1, duration:0.32, ease:"back.out(1.7)" }, 0.1);
      tl.fromTo(".chk", { opacity:0, scale:0.2, transformOrigin:"center center" }, { opacity:1, scale:1, duration:0.45, ease:"back.out(3)" }, 0.14);
      tl.fromTo(".big", { opacity:0, x:18 }, { opacity:1, x:0, duration:0.45, ease:"power3.out" }, 0.5);
      tl.fromTo(".rule", { scaleX:0 }, { scaleX:1, duration:0.45, ease:"expo.out" }, 0.78);
      tl.fromTo(".magic", { opacity:0, y:12 }, { opacity:1, y:0, duration:0.45, ease:"power2.out" }, 0.92);
      tl.fromTo(".spark", { opacity:0, scale:0.2, rotation:-40, transformOrigin:"center center" },
                { opacity:1, scale:1, rotation:0, duration:0.4, stagger:0.16, ease:"back.out(3)" }, 1.1);
      tl.to(".spark", { opacity:0.2, scale:0.8, duration:0.6, stagger:0.1, yoyo:true, repeat:1, ease:"sine.inOut" }, 1.7);
      tl.to([".panel",".spark"], { opacity:0, duration:0.34, ease:"power2.in" }, 3.62);
      window.__timelines["gI"] = tl;
    </script>
  </div>
</template>
