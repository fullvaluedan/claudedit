<template id="gD-template">
  <div data-composition-id="gD" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="gD"]{
        --ink:#14110D; --ink2:#4A463E; --red:#BC1C08; --paper:#F6F4EE;
        --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
        position:absolute; inset:0; font-family:'Inter',system-ui,sans-serif;
      }
      [data-composition-id="gD"] .panel{
        position:absolute; left:48px; top:150px; width:984px; padding:30px 34px 34px;
        background:#F6F4EE; border:2px solid var(--ink);
        box-shadow:10px 10px 0 rgba(20,17,13,0.20);
      }
      [data-composition-id="gD"] .kick{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:700; font-size:30px; letter-spacing:.12em; text-transform:uppercase; color:var(--red); }
      [data-composition-id="gD"] .head{ font-weight:900; font-size:74px; line-height:0.94; letter-spacing:-0.02em; color:var(--ink); margin:8px 0 6px; }
      [data-composition-id="gD"] .rule{ height:3px; background:var(--ink); margin:14px 0 22px; transform-origin:left center; }
      [data-composition-id="gD"] .grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px; }
      [data-composition-id="gD"] .cell{ border:2px solid var(--ink); padding:20px 18px; display:flex; flex-direction:column; gap:10px; }
      [data-composition-id="gD"] .m{ font-weight:800; font-size:42px; color:var(--ink); }
      [data-composition-id="gD"] .x{ font-weight:900; font-size:60px; color:var(--red); line-height:0.8; }
      [data-composition-id="gD"] .st{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:600; font-size:26px; letter-spacing:.08em; color:var(--ink2); }
      [data-composition-id="gD"] .foot{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:700; font-size:32px; letter-spacing:.10em; text-transform:uppercase; color:var(--ink); margin-top:22px; }
      [data-composition-id="gD"] .foot b{ color:var(--paper); background:var(--red); padding:4px 12px; font-weight:800; }
    </style>
    <div class="panel">
      <div class="kick">Before the fix</div>
      <div class="head">Every major LLM failed</div>
      <div class="rule"></div>
      <div class="grid">
        <div class="cell"><span class="m">GPT-4</span><span class="x">✕</span><span class="st">TONE OFF</span></div>
        <div class="cell"><span class="m">Claude</span><span class="x">✕</span><span class="st">TONE OFF</span></div>
        <div class="cell"><span class="m">Gemini</span><span class="x">✕</span><span class="st">TONE OFF</span></div>
      </div>
      <div class="foot">Cantonese tone-match&nbsp;·&nbsp;<b>0 / 3 passed</b></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".panel", { opacity:0, y:-30 }, { opacity:1, y:0, duration:0.32, ease:"power3.out" }, 0.1);
      tl.fromTo(".kick", { opacity:0, x:-12 }, { opacity:1, x:0, duration:0.35, ease:"power2.out" }, 0.08);
      tl.fromTo(".head", { opacity:0, y:16 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.26);
      tl.fromTo(".rule", { scaleX:0 }, { scaleX:1, duration:0.5, ease:"expo.out" }, 0.6);
      tl.fromTo(".cell", { opacity:0, y:24 }, { opacity:1, y:0, duration:0.42, stagger:0.14, ease:"power2.out" }, 0.78);
      tl.fromTo(".x", { opacity:0, scale:0.2, transformOrigin:"center center" }, { opacity:1, scale:1, duration:0.34, stagger:0.16, ease:"back.out(3)" }, 1.0);
      tl.fromTo(".foot", { opacity:0, y:12 }, { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 1.5);
      tl.to(".panel", { opacity:0, y:-22, duration:0.34, ease:"power2.in" }, 4.62);
      window.__timelines["gD"] = tl;
    </script>
  </div>
</template>
