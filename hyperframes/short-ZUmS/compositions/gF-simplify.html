<template id="gF-template">
  <div data-composition-id="gF" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="gF"]{
        --ink:#14110D; --ink2:#4A463E; --red:#BC1C08; --paper:#F6F4EE;
        --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
        position:absolute; inset:0; font-family:'Inter',system-ui,sans-serif;
      }
      [data-composition-id="gF"] .panel{
        position:absolute; left:48px; top:270px; width:560px; padding:30px 34px 30px;
        background:#F6F4EE; border:2px solid var(--ink);
        box-shadow:10px 10px 0 rgba(20,17,13,0.20);
      }
      [data-composition-id="gF"] .kick{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:700; font-size:30px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2); }
      [data-composition-id="gF"] .big{ font-weight:900; font-size:104px; line-height:0.9; letter-spacing:-0.03em; color:var(--ink); margin:8px 0 22px; }
      [data-composition-id="gF"] .bars{ display:flex; flex-direction:column; gap:14px; }
      [data-composition-id="gF"] .bar{ height:20px; background:var(--ink2); transform-origin:left center; }
      [data-composition-id="gF"] .bar.keep{ background:var(--red); height:26px; }
      [data-composition-id="gF"] .foot{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:700; font-size:30px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); margin-top:22px; }
      [data-composition-id="gF"] .foot b{ color:var(--red); }
    </style>
    <div class="panel">
      <div class="kick">His advice</div>
      <div class="big">Simplify</div>
      <div class="bars">
        <div class="bar" style="width:92%"></div>
        <div class="bar" style="width:78%"></div>
        <div class="bar" style="width:85%"></div>
        <div class="bar" style="width:70%"></div>
        <div class="bar keep" style="width:60%"></div>
      </div>
      <div class="foot">Many rules&nbsp;→&nbsp;<b>one</b></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".panel", { opacity:0, x:-36 }, { opacity:1, x:0, duration:0.32, ease:"power3.out" }, 0.1);
      tl.fromTo(".kick", { opacity:0, y:10 }, { opacity:1, y:0, duration:0.32, ease:"power2.out" }, 0.08);
      tl.fromTo(".big", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.26);
      tl.fromTo(".bar", { scaleX:0 }, { scaleX:1, duration:0.4, stagger:0.08, ease:"power2.out" }, 0.6);
      // the redundant rules collapse away; the one red rule remains
      tl.to(".bar:not(.keep)", { scaleX:0, opacity:0, duration:0.4, stagger:0.07, ease:"power2.in" }, 1.45);
      tl.to(".bar.keep", { scaleX:1.15, duration:0.4, ease:"back.out(2)" }, 1.7);
      tl.fromTo(".foot", { opacity:0, y:10 }, { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 1.95);
      tl.to(".panel", { opacity:0, x:-24, duration:0.32, ease:"power2.in" }, 2.66);
      window.__timelines["gF"] = tl;
    </script>
  </div>
</template>
