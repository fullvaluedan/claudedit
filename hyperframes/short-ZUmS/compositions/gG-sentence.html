<template id="gG-template">
  <div data-composition-id="gG" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="gG"]{
        --ink:#14110D; --ink2:#4A463E; --red:#BC1C08; --paper:#F6F4EE;
        --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
        position:absolute; inset:0; font-family:'Inter',system-ui,sans-serif;
      }
      [data-composition-id="gG"] .panel{
        position:absolute; left:48px; top:184px; width:840px; padding:28px 34px 30px;
        background:#F6F4EE; border:2px solid var(--ink);
        box-shadow:10px 10px 0 rgba(20,17,13,0.20);
      }
      [data-composition-id="gG"] .kick{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:700; font-size:30px; letter-spacing:.12em; text-transform:uppercase; color:var(--red); }
      [data-composition-id="gG"] .big{ font-weight:900; font-size:96px; line-height:0.9; letter-spacing:-0.03em; color:var(--ink); margin:6px 0 4px; }
      [data-composition-id="gG"] .big em{ font-style:normal; color:var(--red); }
      [data-composition-id="gG"] .rule{ height:3px; background:var(--ink); margin:14px 0 18px; transform-origin:left center; }
      [data-composition-id="gG"] .map{ display:flex; align-items:center; gap:22px; flex-wrap:nowrap; }
      [data-composition-id="gG"] .chip{ border:2px solid var(--ink); padding:8px 18px; font-weight:900; font-size:54px; letter-spacing:.14em; color:var(--ink); font-variant-numeric:tabular-nums; }
      [data-composition-id="gG"] .arr{ font-weight:900; font-size:58px; color:var(--red); }
      [data-composition-id="gG"] .pitch{ font-weight:800; font-size:46px; color:var(--ink); }
      [data-composition-id="gG"] .pitch span{ color:var(--red); }
    </style>
    <div class="panel">
      <div class="kick">The breakthrough</div>
      <div class="big">One <em>sentence</em></div>
      <div class="rule"></div>
      <div class="map">
        <span class="chip">0 2 4 3</span>
        <span class="arr">→</span>
        <span class="pitch"><span>♪</span> relative pitch</span>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".panel", { opacity:0, y:-28 }, { opacity:1, y:0, duration:0.32, ease:"power3.out" }, 0.1);
      tl.fromTo(".kick", { opacity:0, x:-12 }, { opacity:1, x:0, duration:0.35, ease:"power2.out" }, 0.08);
      tl.fromTo(".big", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.26);
      tl.fromTo(".rule", { scaleX:0 }, { scaleX:1, duration:0.5, ease:"expo.out" }, 0.66);
      tl.fromTo(".chip", { opacity:0, x:-18 }, { opacity:1, x:0, duration:0.42, ease:"back.out(1.8)" }, 0.86);
      tl.fromTo(".arr", { opacity:0, scale:0.4 }, { opacity:1, scale:1, duration:0.34, ease:"back.out(3)" }, 1.12);
      tl.fromTo(".pitch", { opacity:0, x:18 }, { opacity:1, x:0, duration:0.42, ease:"power2.out" }, 1.3);
      tl.to(".panel", { opacity:0, y:-20, duration:0.34, ease:"power2.in" }, 4.62);
      window.__timelines["gG"] = tl;
    </script>
  </div>
</template>
