<template id="gC-template">
  <div data-composition-id="gC" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="gC"]{
        --ink:#14110D; --ink2:#4A463E; --red:#BC1C08; --paper:#F6F4EE;
        --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
        position:absolute; inset:0; font-family:'Inter',system-ui,sans-serif;
      }
      [data-composition-id="gC"] .panel{
        position:absolute; left:48px; top:300px; width:560px; padding:32px 34px;
        background:#F6F4EE; border:2px solid var(--ink);
        box-shadow:10px 10px 0 rgba(20,17,13,0.20);
      }
      [data-composition-id="gC"] .kick{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:700; font-size:30px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2); }
      [data-composition-id="gC"] .rule{ height:3px; background:var(--red); margin:16px 0 16px; transform-origin:left center; }
      [data-composition-id="gC"] .big{ font-weight:900; font-size:140px; line-height:0.9; letter-spacing:-0.03em; color:var(--ink); }
      [data-composition-id="gC"] .big .q{ color:var(--red); }
      [data-composition-id="gC"] .chk{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:600; font-size:32px; letter-spacing:.06em; color:var(--ink2); margin-top:18px; }
    </style>
    <div class="panel">
      <div class="kick">Self-doubt</div>
      <div class="rule"></div>
      <div class="big">Wrong<span class="q">?</span></div>
      <div class="chk">☐ HYPOTHESIS UNVERIFIED</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".panel", { opacity:0, scale:0.92, transformOrigin:"left top" }, { opacity:1, scale:1, duration:0.32, ease:"back.out(1.6)" }, 0.1);
      tl.fromTo(".kick", { opacity:0, x:-12 }, { opacity:1, x:0, duration:0.35, ease:"power2.out" }, 0.08);
      tl.fromTo(".rule", { scaleX:0 }, { scaleX:1, duration:0.4, ease:"expo.out" }, 0.34);
      tl.fromTo(".big", { opacity:0, y:20 }, { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.28);
      tl.fromTo(".big .q", { scale:0.3, transformOrigin:"center bottom" }, { scale:1, duration:0.45, ease:"elastic.out(1,0.5)" }, 0.7);
      tl.fromTo(".chk", { opacity:0 }, { opacity:1, duration:0.4, ease:"power1.out" }, 0.95);
      tl.to(".panel", { opacity:0, y:-18, duration:0.32, ease:"power2.in" }, 2.66);
      window.__timelines["gC"] = tl;
    </script>
  </div>
</template>
